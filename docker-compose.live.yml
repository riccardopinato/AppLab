services:
  backend:
    build:
      context: ./backend
    network_mode: host
    environment:
      ADB_SERIAL: 127.0.0.1:5555
      APPLAB_LIVE_ADB_SERIAL: 127.0.0.1:5555
      APPLAB_HISTORY_PATH: /data/history.jsonl
      APPLAB_FLOW_DIR: /app/flows
      APPLAB_DATA_DIR: /data
      APPLAB_EMULATOR_IMAGE: ${APPLAB_EMULATOR_IMAGE:-applab-emulator-runtime:0.3.1}
      APPLAB_EMULATOR_BASE_IMAGE: ${APPLAB_EMULATOR_BASE_IMAGE:-us-docker.pkg.dev/android-emulator-268719/images/30-google-x64-no-metrics:7148297}
      APPLAB_EMULATOR_BUILD_CONTEXT: /opt/applab/emulator-runtime
      APPLAB_EMULATOR_PARAMS: ${APPLAB_EMULATOR_PARAMS:--no-window -no-audio -no-boot-anim -gpu swiftshader_indirect}
      APPLAB_BOOT_TIMEOUT: ${APPLAB_BOOT_TIMEOUT:-240}
      APPLAB_DOCKER_TIMEOUT: ${APPLAB_DOCKER_TIMEOUT:-1200}
      APPLAB_BIND_HOST: ${APPLAB_BIND_HOST:-127.0.0.1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - applab-live-data:/data
      - ./emulator-runtime:/opt/applab/emulator-runtime:ro
    devices:
      - /dev/kvm:/dev/kvm

  event_gateway:
    profiles: ["v54g"]
    build:
      context: .
      dockerfile: gateway-v54g/Dockerfile
    ports:
      - "127.0.0.1:${APPLAB_V54G_PORT:-8090}:8090"
    environment:
      APPLAB_V54G_ENABLED: ${APPLAB_V54G_ENABLED:-false}
      APPLAB_V54G_BIND_HOST: 0.0.0.0
      APPLAB_V54G_STORE_PATH: /data/v54g.sqlite3
      APPLAB_V54G_WEBHOOK_SECRET: ${APPLAB_V54G_WEBHOOK_SECRET:-}
      APPLAB_V54G_DISPATCH_SECRET: ${APPLAB_V54G_DISPATCH_SECRET:-}
      APPLAB_V54G_GITHUB_TOKEN: ${APPLAB_V54G_GITHUB_TOKEN:-}
      APPLAB_V54G_APPLAB_REPOSITORY: ${APPLAB_V54G_APPLAB_REPOSITORY:-riccardopinato/AppLab}
      APPLAB_V54G_PILOT_ALLOWLIST: ${APPLAB_V54G_PILOT_ALLOWLIST:-{}}
    volumes:
      - applab-live-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
        VITE_GATEWAY_URI: ${VITE_GATEWAY_URI:-localhost:8080}
    ports:
      - "127.0.0.1:5173:80"

volumes:
  applab-live-data:
