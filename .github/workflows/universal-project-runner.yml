name: Universal Android Project Runner

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository in owner/name format
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA
        required: false
        default: main
        type: string
      run_maestro:
        description: Run Maestro after app launch
        required: false
        default: true
        type: boolean
      approve_visual_baseline:
        description: Explicitly accept a visual WARN as the new baseline
        required: false
        default: false
        type: boolean
      analysis_mode:
        description: AppLab analysis mode (fast, full or certification)
        required: false
        default: full
        type: string
      api_level_override:
        description: Optional Android API override for controlled certification/runtime lanes
        required: false
        default: ""
        type: string
      emulator_profile_override:
        description: Optional emulator profile override for controlled certification/runtime lanes
        required: false
        default: ""
        type: string
      baseline_sha:
        description: Last verified SHA used for FAST changed-file planning
        required: false
        default: ""
        type: string
      force_release_build:
        description: Force the release build profile without changing analysis mode
        required: false
        default: false
        type: boolean
      publish_release_artifact:
        description: Allow a CERTIFIED lane to publish its verified APK
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      ref:
        required: false
        default: main
        type: string
      run_maestro:
        required: false
        default: true
        type: boolean
      history_key:
        required: false
        default: universal
        type: string
      cache_verification:
        required: false
        default: false
        type: boolean
      cache_epoch:
        required: false
        default: "1"
        type: string
      contract_fingerprint:
        required: false
        default: "manual"
        type: string
      approve_visual_baseline:
        required: false
        default: false
        type: boolean
      config_fingerprint:
        required: false
        default: "manual"
        type: string
      analysis_mode:
        required: false
        default: full
        type: string
      api_level_override:
        required: false
        default: ""
        type: string
      emulator_profile_override:
        required: false
        default: ""
        type: string
      baseline_sha:
        required: false
        default: ""
        type: string
      force_release_build:
        required: false
        default: false
        type: boolean
      publish_release_artifact:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  discover:
    name: Auto-discover project
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.detect.outputs.engine }}
      profile: ${{ steps.detect.outputs.profile }}
      resolved_sha: ${{ steps.target.outputs.resolved_sha }}
      plan_artifact_name: ${{ steps.metadata.outputs.plan_artifact_name }}
      source_artifact_name: ${{ steps.snapshot.outputs.source_artifact_name }}

    steps:
      - name: Checkout trusted AppLab
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Checkout target project
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: target
          fetch-depth: 64
          persist-credentials: false

      - name: Extend FAST history window when needed
        if: inputs.analysis_mode == 'fast' && inputs.baseline_sha != ''
        shell: bash
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$BASELINE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git -C "$GITHUB_WORKSPACE/target" cat-file -e "$BASELINE_SHA^{commit}" 2>/dev/null || {
              git -C "$GITHUB_WORKSPACE/target" fetch --no-tags --deepen=256 origin || true
              git -C "$GITHUB_WORKSPACE/target" fetch --no-tags --depth=1 origin "$BASELINE_SHA" || true
            }
          fi

      - name: Restore verification history for adaptive risk
        uses: actions/cache/restore@v6
        with:
          path: .applab-history
          key: applab-watch-history-universal-${{ github.run_id }}
          restore-keys: |
            applab-watch-history-

      - name: Resolve exact target SHA
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA="$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "resolved_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Detect project engine and build profile
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/applab-autodiscovery"
          python .applab/scripts/project_autodiscover.py \
            --repo-root "$GITHUB_WORKSPACE/target" \
            --output "$GITHUB_WORKSPACE/applab-autodiscovery/profile.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Compute reusable adaptive impact plan
        id: plan
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/applab-universal-plan"
          ENGINE="${{ steps.detect.outputs.engine }}"
          WORKDIR="$(python -c 'import json; print(json.load(open("applab-autodiscovery/profile.json"))["working_directory"])')"
          python .applab/scripts/smart_test_plan.py \
            --repo-root "$GITHUB_WORKSPACE/target" \
            --mode "${{ inputs.analysis_mode }}" \
            --baseline-sha "${{ inputs.baseline_sha }}" \
            --engine "$ENGINE" \
            --working-directory "$WORKDIR" \
            --history-file "$GITHUB_WORKSPACE/.applab-history/history.jsonl" \
            --repository "${{ inputs.repository }}" \
            --output "$GITHUB_WORKSPACE/applab-universal-plan/analysis-plan.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set reusable plan identity
        id: metadata
        shell: bash
        run: |
          echo "plan_artifact_name=applab-universal-plan-${{ inputs.history_key }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload reusable adaptive plan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.plan_artifact_name }}
          path: applab-universal-plan/analysis-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Package reusable exact source snapshot
        id: snapshot
        if: steps.plan.outputs.lane != 'NO_RUNTIME_CHANGE'
        shell: bash
        run: |
          set -Eeuo pipefail
          NAME="applab-universal-source-${{ inputs.history_key }}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "source_artifact_name=$NAME" >> "$GITHUB_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/applab-universal-source"
          git -C "$GITHUB_WORKSPACE/target" archive \
            --format=tar \
            --output="$GITHUB_WORKSPACE/applab-universal-source/target.tar" \
            "${{ steps.target.outputs.resolved_sha }}"
          (
            cd "$GITHUB_WORKSPACE/applab-universal-source"
            sha256sum target.tar > target.tar.sha256
          )

      - name: Upload reusable exact source snapshot
        if: steps.plan.outputs.lane != 'NO_RUNTIME_CHANGE'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.snapshot.outputs.source_artifact_name }}
          path: applab-universal-source/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Publish discovery summary
        shell: bash
        run: |
          {
            echo "## AppLab Universal Auto-Discovery"
            echo
            echo "Repository: ${{ inputs.repository }}"
            echo "Ref: ${{ inputs.ref }}"
            echo "Detected engine: ${{ steps.detect.outputs.engine }}"
            echo "Resolved SHA: ${{ steps.target.outputs.resolved_sha }}"
            echo "Adaptive lane: ${{ steps.plan.outputs.lane }}"
            echo "Effective mode: ${{ steps.plan.outputs.effective_mode }}"
            echo
            cat "$GITHUB_WORKSPACE/applab-autodiscovery/profile.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery profile
        uses: actions/upload-artifact@v7
        with:
          name: applab-autodiscovery-${{ github.run_id }}
          path: applab-autodiscovery/profile.json
          if-no-files-found: error
          retention-days: 30

  verify_flutter:
    name: Auto Flutter verification
    if: needs.discover.outputs.engine == 'flutter'
    needs: discover
    uses: ./.github/workflows/external-project-runner.yml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      working_directory: ${{ fromJSON(needs.discover.outputs.profile).working_directory }}
      flutter_channel: ${{ fromJSON(needs.discover.outputs.profile).flutter_channel }}
      flutter_version: ${{ fromJSON(needs.discover.outputs.profile).flutter_version }}
      java_version: ${{ fromJSON(needs.discover.outputs.profile).java_version }}
      prepare_command: ${{ fromJSON(needs.discover.outputs.profile).prepare_command }}
      post_pub_get_command: ${{ fromJSON(needs.discover.outputs.profile).post_pub_get_command }}
      android_prepare_command: ${{ fromJSON(needs.discover.outputs.profile).android_prepare_command }}
      api_level: ${{ inputs.api_level_override != '' && inputs.api_level_override || fromJSON(needs.discover.outputs.profile).api_level }}
      emulator_profile: ${{ inputs.emulator_profile_override != '' && inputs.emulator_profile_override || fromJSON(needs.discover.outputs.profile).emulator_profile }}
      apk_path: ${{ (inputs.analysis_mode == 'certification' || inputs.force_release_build) && fromJSON(needs.discover.outputs.profile).certification_apk_path || fromJSON(needs.discover.outputs.profile).apk_path }}
      package_id: ${{ fromJSON(needs.discover.outputs.profile).package_id }}
      build_command: ${{ (inputs.analysis_mode == 'certification' || inputs.force_release_build) && fromJSON(needs.discover.outputs.profile).certification_build_command || fromJSON(needs.discover.outputs.profile).build_command }}
      run_flutter_tests: ${{ fromJSON(needs.discover.outputs.profile).run_flutter_tests }}
      run_maestro: ${{ inputs.run_maestro }}
      maestro_flow: ${{ fromJSON(needs.discover.outputs.profile).maestro_flow }}
      history_key: ${{ inputs.history_key }}
      cache_verification: ${{ inputs.cache_verification }}
      cache_epoch: ${{ inputs.cache_epoch }}
      contract_fingerprint: ${{ inputs.contract_fingerprint }}
      config_fingerprint: ${{ inputs.config_fingerprint }}
      approve_visual_baseline: ${{ inputs.approve_visual_baseline }}
      analysis_mode: ${{ inputs.analysis_mode }}
      baseline_sha: ${{ inputs.baseline_sha }}
      precomputed_plan_artifact_name: ${{ needs.discover.outputs.plan_artifact_name }}
      source_artifact_name: ${{ needs.discover.outputs.source_artifact_name }}
      source_resolved_sha: ${{ needs.discover.outputs.resolved_sha }}
      publish_release_artifact: ${{ inputs.publish_release_artifact }}

  verify_native:
    name: Auto native Android verification
    if: needs.discover.outputs.engine == 'native_android'
    needs: discover
    uses: ./.github/workflows/external-native-android-runner.yml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      working_directory: ${{ fromJSON(needs.discover.outputs.profile).working_directory }}
      java_version: ${{ fromJSON(needs.discover.outputs.profile).java_version }}
      gradle_version: ${{ fromJSON(needs.discover.outputs.profile).gradle_version }}
      compile_sdk: ${{ fromJSON(needs.discover.outputs.profile).compile_sdk }}
      build_tools: ${{ fromJSON(needs.discover.outputs.profile).build_tools }}
      prepare_command: ${{ fromJSON(needs.discover.outputs.profile).prepare_command }}
      test_command: ${{ fromJSON(needs.discover.outputs.profile).test_command }}
      lint_command: ${{ fromJSON(needs.discover.outputs.profile).lint_command }}
      build_command: ${{ (inputs.analysis_mode == 'certification' || inputs.force_release_build) && fromJSON(needs.discover.outputs.profile).certification_build_command || fromJSON(needs.discover.outputs.profile).build_command }}
      apk_path: ${{ (inputs.analysis_mode == 'certification' || inputs.force_release_build) && fromJSON(needs.discover.outputs.profile).certification_apk_path || fromJSON(needs.discover.outputs.profile).apk_path }}
      package_id: ${{ fromJSON(needs.discover.outputs.profile).package_id }}
      verify_signature: ${{ fromJSON(needs.discover.outputs.profile).verify_signature }}
      android_prepare_command: ${{ fromJSON(needs.discover.outputs.profile).android_prepare_command }}
      api_level: ${{ inputs.api_level_override != '' && inputs.api_level_override || fromJSON(needs.discover.outputs.profile).api_level }}
      emulator_profile: ${{ inputs.emulator_profile_override != '' && inputs.emulator_profile_override || fromJSON(needs.discover.outputs.profile).emulator_profile }}
      run_maestro: ${{ inputs.run_maestro }}
      maestro_flow: ${{ fromJSON(needs.discover.outputs.profile).maestro_flow }}
      history_key: ${{ inputs.history_key }}
      cache_verification: ${{ inputs.cache_verification }}
      cache_epoch: ${{ inputs.cache_epoch }}
      contract_fingerprint: ${{ inputs.contract_fingerprint }}
      config_fingerprint: ${{ inputs.config_fingerprint }}
      approve_visual_baseline: ${{ inputs.approve_visual_baseline }}
      analysis_mode: ${{ inputs.analysis_mode }}
      baseline_sha: ${{ inputs.baseline_sha }}
      precomputed_plan_artifact_name: ${{ needs.discover.outputs.plan_artifact_name }}
      source_artifact_name: ${{ needs.discover.outputs.source_artifact_name }}
      source_resolved_sha: ${{ needs.discover.outputs.resolved_sha }}
      publish_release_artifact: ${{ inputs.publish_release_artifact }}
