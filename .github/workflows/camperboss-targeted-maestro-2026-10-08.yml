name: CamperBoss Targeted Maestro Audit 2026-10-08

on:
  push:
    branches:
      - audit-camperboss-2026-10-07
    paths:
      - ".github/workflows/camperboss-targeted-maestro-2026-10-08.yml"

permissions:
  contents: read
  actions: read

jobs:
  top_level:
    name: Top-level 5-tab runtime flow
    uses: ./.github/workflows/external-project-runner.yml
    with:
      repository: riccardopinato/CamperBoss
      ref: 26f966f58934f6cfffbdb0d70c573a15f5445a9f
      source_ref: main
      working_directory: "."
      flutter_channel: stable
      flutter_version: "3.47.6"
      java_version: "21"
      prepare_command: ""
      post_pub_get_command: ""
      android_prepare_command: ""
      api_level: "35"
      emulator_profile: pixel_7_pro
      apk_path: build/app/outputs/flutter-apk/app-debug.apk
      package_id: com.camperboss.camperboss
      build_command: flutter build apk --debug
      run_maestro: true
      maestro_flow: ".maestro/applab-release-core-final.yaml"
      history_key: audit-camperboss-top-level
      cache_verification: false
      contract_fingerprint: camperboss-targeted-top-level-2026-10-08
      config_fingerprint: camperboss-targeted-top-level-2026-10-08
      approve_visual_baseline: false
      analysis_mode: full
      baseline_sha: ""
      publish_release_artifact: false

  map_poi:
    name: Map POI offline runtime flow
    uses: ./.github/workflows/external-project-runner.yml
    with:
      repository: riccardopinato/CamperBoss
      ref: 26f966f58934f6cfffbdb0d70c573a15f5445a9f
      source_ref: main
      working_directory: "."
      flutter_channel: stable
      flutter_version: "3.47.6"
      java_version: "21"
      prepare_command: ""
      post_pub_get_command: ""
      android_prepare_command: ""
      api_level: "35"
      emulator_profile: pixel_7_pro
      apk_path: build/app/outputs/flutter-apk/app-debug.apk
      package_id: com.camperboss.camperboss
      build_command: flutter build apk --debug
      run_maestro: true
      maestro_flow: ".maestro/applab-map-audit.yaml"
      history_key: audit-camperboss-map-poi
      cache_verification: false
      contract_fingerprint: camperboss-targeted-map-poi-2026-10-08
      config_fingerprint: camperboss-targeted-map-poi-2026-10-08
      approve_visual_baseline: false
      analysis_mode: full
