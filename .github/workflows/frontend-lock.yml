name: Frontend Lock Consistency

on:
  push:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/frontend-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: applab-frontend-lock
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
        continue-on-error: true
      - name: Generate deterministic lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit lockfile when dependency graph changes
        run: |
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "frontend/package-lock.json is already current."
            exit 0
          fi
          git config user.name "AppLab Lock Bot"
          git config user.email "applab-lock-bot@users.noreply.github.com"
          git commit -m "chore(frontend): refresh package lock"
          git push
