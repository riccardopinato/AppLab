name: CamperBoss Debug UX Audit 2026-10-07

on:
  push:
    branches:
      - audit-camperboss-2026-10-07
    paths:
      - ".github/workflows/camperboss-debug-ux-audit-2026-10-07.yml"

permissions:
  contents: read
  actions: read

jobs:
  shell:
    name: Five-area user journey
    uses: ./.github/workflows/external-project-runner.yml
    with:
      repository: riccardopinato/CamperBoss
      ref: 26f966f58934f6cfffbdb0d70c573a15f5445a9f
      source_ref: main
      working_directory: "."
      flutter_channel: stable
      flutter_version: "3.47.6"
      java_version: "21"
      prepare_command: ""
      post_pub_get_command: ""
      android_prepare_command: ""
      api_level: "35"
      emulator_profile: pixel_7_pro
      apk_path: build/app/outputs/flutter-apk/app-debug.apk
      package_id: com.camperboss.camperboss
      build_command: flutter build apk --debug
      run_maestro: true
      maestro_flow: ".maestro/applab-release-core-final.yaml"
      history_key: audit-camperboss-debug-shell
      cache_verification: false
      contract_fingerprint: camperboss-debug-shell-2026-10-07
      config_fingerprint: camperboss-debug-shell-2026-10-07
      approve_visual_baseline: false
      analysis_mode: full
      baseline_sha: ""
      publish_release_artifact: false

  map:
    name: Map and offline user journey
    uses: ./.github/workflows/external-project-runner.yml
    with:
      repository: riccardopinato/CamperBoss
      ref: 26f966f58934f6cfffbdb0d70c573a15f5445a9f
      source_ref: main
      working_directory: "."
      flutter_channel: stable
      flutter_version: "3.47.6"
      java_version: "21"
      prepare_command: ""
      post_pub_get_command: ""
      android_prepare_command: ""
      api_level: "35"
      emulator_profile: pixel_7_pro
      apk_path: build/app/outputs/flutter-apk/app-debug.apk
      package_id: com.camperboss.camperboss
      build_command: flutter build apk --debug
      run_maestro: true
      maestro_flow: ".maestro/applab-map-audit.yaml"
      history_key: audit-camperboss-debug-map
      cache_verification: false
      contract_fingerprint: camperboss-debug-map-2026-10-07
      config_fingerprint: camperboss-debug-map-2026-10-07
      approve_visual_baseline: false
      analysis_mode: full
      baseline_sha: ""
      publish_release_artifact: false
