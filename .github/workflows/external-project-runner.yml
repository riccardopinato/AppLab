name: External Flutter Project Runner

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository in owner/name format
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA to verify
        required: false
        default: main
        type: string
      working_directory:
        description: Flutter project directory inside the target repository
        required: false
        default: "."
        type: string
      flutter_channel:
        description: Flutter channel used when flutter_version is empty
        required: false
        default: stable
        type: string
      flutter_version:
        description: Optional exact Flutter version
        required: false
        default: ""
        type: string
      java_version:
        description: Java version used to build the target project
        required: false
        default: "17"
        type: string
      prepare_command:
        description: Optional repository-specific command run before flutter pub get
        required: false
        default: ""
        type: string
      post_pub_get_command:
        description: Optional repository-specific command run after flutter pub get
        required: false
        default: ""
        type: string
      android_prepare_command:
        description: Optional command run with ADB available after a preliminary APK install
        required: false
        default: ""
        type: string
      api_level:
        description: Android emulator API level
        required: false
        default: "35"
        type: string
      emulator_profile:
        description: Android emulator hardware profile
        required: false
        default: pixel_7_pro
        type: string
      apk_path:
        description: APK path relative to working_directory
        required: false
        default: build/app/outputs/flutter-apk/app-debug.apk
        type: string
      package_id:
        description: Optional Android application id; empty enables automatic detection
        required: false
        default: ""
        type: string
      build_command:
        description: Flutter APK build command
        required: false
        default: flutter build apk --debug
        type: string
      run_maestro:
        description: Run Maestro after launch
        required: false
        default: true
        type: boolean
      maestro_flow:
        description: Optional Maestro flow path relative to target repository root
        required: false
        default: ""
        type: string
      history_key:
        description: Stable identifier used by AppLab Watcher history and caches
        required: false
        default: external
        type: string
      cache_verification:
        description: Save this resolved commit as already verified by AppLab Watcher
        required: false
        default: false
        type: boolean
      contract_fingerprint:
        description: Automatic AppLab verification contract fingerprint
        required: false
        default: "manual"
        type: string
      approve_visual_baseline:
        description: Explicitly accept a visual WARN as the new baseline
        required: false
        default: false
        type: boolean
      config_fingerprint:
        description: Fingerprint of this target's watcher/build configuration
        required: false
        default: "manual"
        type: string
      analysis_mode:
        description: AppLab analysis mode (fast, full or certification)
        required: false
        default: full
        type: string
      baseline_sha:
        description: Last verified SHA used for FAST changed-file planning
        required: false
        default: ""
        type: string
      publish_release_artifact:
        description: Allow CERTIFIED runs to publish the verified APK
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      repository:
        description: Public GitHub repository in owner/name format
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA to verify
        required: false
        default: main
        type: string
      source_ref:
        description: Logical branch/tag ref used for watcher baseline identity
        required: false
        default: ""
        type: string
      working_directory:
        description: Flutter project directory inside the target repository
        required: false
        default: "."
        type: string
      flutter_channel:
        description: Flutter channel used when flutter_version is empty
        required: false
        default: stable
        type: string
      flutter_version:
        description: Optional exact Flutter version
        required: false
        default: ""
        type: string
      java_version:
        description: Java version used to build the target project
        required: false
        default: "17"
        type: string
      prepare_command:
        description: Optional repository-specific command run before flutter pub get
        required: false
        default: ""
        type: string
      post_pub_get_command:
        description: Optional repository-specific command run after flutter pub get
        required: false
        default: ""
        type: string
      android_prepare_command:
        description: Optional command run with ADB available after a preliminary APK install
        required: false
        default: ""
        type: string
      api_level:
        description: Android emulator API level
        required: false
        default: "35"
        type: string
      emulator_profile:
        description: Android emulator hardware profile
        required: false
        default: pixel_7_pro
        type: string
      apk_path:
        description: APK path relative to working_directory
        required: false
        default: build/app/outputs/flutter-apk/app-debug.apk
        type: string
      package_id:
        description: Optional Android application id; empty enables automatic detection
        required: false
        default: ""
        type: string
      build_command:
        description: Flutter APK build command
        required: false
        default: flutter build apk --debug
        type: string
      run_maestro:
        description: Run Maestro after launch
        required: false
        default: true
        type: boolean
      maestro_flow:
        description: Optional Maestro flow path relative to target repository root
        required: false
        default: ""
        type: string
      history_key:
        description: Stable identifier used by AppLab Watcher history and caches
        required: false
        default: external
        type: string
      cache_verification:
        description: Save this resolved commit as already verified by AppLab Watcher
        required: false
        default: false
        type: boolean
      contract_fingerprint:
        description: Automatic AppLab verification contract fingerprint
        required: false
        default: "manual"
        type: string
      approve_visual_baseline:
        description: Explicitly accept a visual WARN as the new baseline
        required: false
        default: false
        type: boolean
      config_fingerprint:
        description: Fingerprint of this target's watcher/build configuration
        required: false
        default: "manual"
        type: string
      analysis_mode:
        description: AppLab analysis mode (fast, full or certification)
        required: false
        default: full
        type: string
      baseline_sha:
        description: Last verified SHA used for FAST changed-file planning
        required: false
        default: ""
        type: string
      publish_release_artifact:
        description: Allow CERTIFIED runs to publish the verified APK
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: applab-external-${{ inputs.repository }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.repository }}@${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      resolved_sha: ${{ steps.target.outputs.resolved_sha }}
      artifact_name: ${{ steps.accel.outputs.artifact_name }}
      execution_key: ${{ steps.accel.outputs.execution_key }}
      build_cache_hit: ${{ steps.build_reuse.outputs.hit }}
      analysis_lane: ${{ steps.impact.outputs.lane }}
      run_runtime: ${{ steps.impact.outputs.run_runtime }}
      run_build: ${{ steps.impact.outputs.run_build }}
      contract_fingerprint: ${{ steps.adaptive_contract.outputs.fingerprint }}

    steps:
      - name: Validate target coordinates
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_REF: ${{ inputs.ref }}
          TARGET_WORKDIR: ${{ inputs.working_directory }}
          TARGET_APK_PATH: ${{ inputs.apk_path }}
          TARGET_MAESTRO_FLOW: ${{ inputs.maestro_flow }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath

          repo = os.environ["TARGET_REPOSITORY"].strip()
          ref = os.environ["TARGET_REF"].strip()
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise SystemExit(f"Invalid repository: {repo!r}")
          if not ref or any(ch in ref for ch in "\r\n"):
              raise SystemExit("Invalid ref")

          for key in ("TARGET_WORKDIR", "TARGET_APK_PATH", "TARGET_MAESTRO_FLOW"):
              raw = os.environ.get(key, "").strip()
              if not raw:
                  continue
              path = PurePosixPath(raw)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"{key} must be a safe repository-relative path: {raw!r}")
          PY

      - name: Checkout AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Checkout target project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: target
          fetch-depth: 2
          persist-credentials: false

      - name: Fetch FAST baseline commit
        if: inputs.analysis_mode == 'fast' && inputs.baseline_sha != ''
        shell: bash
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$BASELINE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git -C "$GITHUB_WORKSPACE/target" fetch --no-tags --depth=1 origin "$BASELINE_SHA" || true
            for DEEPEN in 32 128 512; do
              git -C "$GITHUB_WORKSPACE/target" merge-base --is-ancestor "$BASELINE_SHA" HEAD 2>/dev/null && break
              git -C "$GITHUB_WORKSPACE/target" fetch --no-tags --deepen="$DEEPEN" origin || true
            done
          fi

      - name: Restore central history for adaptive risk
        if: inputs.analysis_mode == 'fast'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-history
          key: applab-watch-history-fast-${{ github.run_id }}-${{ inputs.history_key }}
          restore-keys: |
            applab-watch-history-

      - name: Plan adaptive verification
        id: impact
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/applab-analysis-plan"
          python .applab/scripts/smart_test_plan.py \
            --repo-root "$GITHUB_WORKSPACE/target" \
            --mode "${{ inputs.analysis_mode }}" \
            --baseline-sha "${{ inputs.baseline_sha }}" \
            --history-file "$GITHUB_WORKSPACE/.applab-history/history.jsonl" \
            --repository "${{ inputs.repository }}" \
            --history-key "${{ inputs.history_key }}" \
            --source-ref "${{ inputs.source_ref != '' && inputs.source_ref || inputs.ref }}" \
            --output "$GITHUB_WORKSPACE/applab-analysis-plan/analysis-plan.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve current adaptive contract fingerprint
        id: adaptive_contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/domain_fingerprint.py \
            --root "$GITHUB_WORKSPACE/.applab" \
            --plan "$GITHUB_WORKSPACE/applab-analysis-plan/analysis-plan.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare evidence directory
        id: target
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/applab-report"
          RESOLVED_SHA="$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)"
          echo "resolved_sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "repository=${{ inputs.repository }}"
            echo "ref=${{ inputs.ref }}"
            echo "resolved_sha=$RESOLVED_SHA"
            echo "working_directory=${{ inputs.working_directory }}"
            echo "apk_path=${{ inputs.apk_path }}"
          } | tee "$GITHUB_WORKSPACE/applab-report/project.txt"

      - name: Validate Flutter project
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}"
          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"

      - name: Plan accelerated execution
        id: accel
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/applab-acceleration"
          python .applab/scripts/execution_acceleration.py \
            --analysis-plan "$GITHUB_WORKSPACE/applab-analysis-plan/analysis-plan.json" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ steps.target.outputs.resolved_sha }}" \
            --engine flutter \
            --history-key "${{ inputs.history_key }}" \
            --working-directory "${{ inputs.working_directory }}" \
            --build-command "${{ inputs.build_command }}" \
            --apk-path "${{ inputs.apk_path }}" \
            --contract-fingerprint "${{ steps.adaptive_contract.outputs.fingerprint }}" \
            --config-fingerprint "${{ inputs.config_fingerprint }}" \
            --toolchain "java:${{ inputs.java_version }}" \
            --toolchain "flutter:${{ inputs.flutter_version != '' && inputs.flutter_version || inputs.flutter_channel }}" \
            --build-input "prepare:${{ inputs.prepare_command }}" \
            --build-input "post-pub-get:${{ inputs.post_pub_get_command }}" \
            --output "$GITHUB_WORKSPACE/applab-acceleration/execution-plan.json" \
            --github-output "$GITHUB_OUTPUT"
          cp "$GITHUB_WORKSPACE/applab-acceleration/execution-plan.json" \
             "$GITHUB_WORKSPACE/applab-report/execution-plan.json"

      - name: Restore content-addressed build contract
        id: build_reuse
        if: steps.impact.outputs.run_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.accel.outputs.artifact_name }}
          APPLAB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          echo "hit=false" >> "$GITHUB_OUTPUT"
          JSON_FILE="$(mktemp)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
            > "$JSON_FILE"
          ARTIFACT_ID="$(
            python3 - "$JSON_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          workflow_sha = os.environ["APPLAB_WORKFLOW_SHA"]
          rows = []
          for item in payload.get("artifacts", []):
              if item.get("expired"):
                  continue
              workflow = item.get("workflow_run") or {}
              if workflow.get("head_sha") != workflow_sha:
                  continue
              rows.append(item)
          rows.sort(key=lambda item: str(item.get("created_at", "")), reverse=True)
          print(rows[0].get("id", "") if rows else "")
          PY
          )"
          rm -f "$JSON_FILE"
          [[ -n "$ARTIFACT_ID" ]] || exit 0

          rm -rf "$GITHUB_WORKSPACE/applab-build-contract"
          mkdir -p "$GITHUB_WORKSPACE/applab-build-contract"
          ZIP_FILE="$(mktemp --suffix=.zip)"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/applab-build-contract"
          rm -f "$ZIP_FILE"

          if python .applab/scripts/validate_build_contract.py \
            --root "$GITHUB_WORKSPACE/applab-build-contract" \
            --expected-repository "${{ inputs.repository }}" \
            --expected-sha "${{ steps.target.outputs.resolved_sha }}" \
            --expected-engine flutter \
            --expected-analysis-mode "${{ inputs.analysis_mode }}"; then
            cp "$GITHUB_WORKSPACE/applab-build-contract/adaptive-quality.json" \
               "$GITHUB_WORKSPACE/applab-report/adaptive-quality.json" 2>/dev/null || true
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
            echo "Reused content-addressed build contract $ARTIFACT_NAME ($ARTIFACT_ID)."
          else
            rm -rf "$GITHUB_WORKSPACE/applab-build-contract"
            echo "Cached build contract failed validation; rebuilding."
          fi

      - name: Record execution acceleration outcome
        shell: bash
        env:
          BUILD_CACHE_HIT: ${{ steps.build_reuse.outputs.hit || 'false' }}
          BUILD_CACHE_ARTIFACT_ID: ${{ steps.build_reuse.outputs.artifact_id || '' }}
        run: |
          set -Eeuo pipefail
          python3 - "$GITHUB_WORKSPACE/applab-acceleration/execution-plan.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["build_cache"] = {
              "hit": os.environ.get("BUILD_CACHE_HIT", "false").lower() == "true",
              "artifact_id": os.environ.get("BUILD_CACHE_ARTIFACT_ID", ""),
          }
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          cp "$GITHUB_WORKSPACE/applab-acceleration/execution-plan.json" \
             "$GITHUB_WORKSPACE/applab-report/execution-plan.json"
          if [[ "$BUILD_CACHE_HIT" == "true" && -d "$GITHUB_WORKSPACE/applab-build-contract" ]]; then
            cp "$GITHUB_WORKSPACE/applab-acceleration/execution-plan.json" \
               "$GITHUB_WORKSPACE/applab-build-contract/execution-plan.json"
          fi

      - name: Setup Java
        if: (steps.impact.outputs.run_static == 'true' || steps.impact.outputs.run_build == 'true') && steps.build_reuse.outputs.hit != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup Flutter channel
        if: (steps.impact.outputs.run_static == 'true' || steps.impact.outputs.run_build == 'true') && steps.build_reuse.outputs.hit != 'true' && inputs.flutter_version == ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Setup exact Flutter version
        if: (steps.impact.outputs.run_static == 'true' || steps.impact.outputs.run_build == 'true') && steps.build_reuse.outputs.hit != 'true' && inputs.flutter_version != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Target preparation
        if: (steps.impact.outputs.run_static == 'true' || steps.impact.outputs.run_build == 'true') && steps.build_reuse.outputs.hit != 'true' && inputs.prepare_command != ''
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        env:
          APPLAB_PREPARE_COMMAND: ${{ inputs.prepare_command }}
        run: bash -Eeuo pipefail -c "$APPLAB_PREPARE_COMMAND"

      - name: Require Android scaffold
        if: steps.impact.outputs.run_build == 'true' && steps.build_reuse.outputs.hit != 'true'
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}"
          if [[ ! -d "$PROJECT_DIR/android" ]]; then
            echo "Target has no android/ scaffold." >&2
            echo "Use prepare_command for repositories that generate platform scaffolding." >&2
            exit 1
          fi

      - name: Resolve dependencies
        if: (steps.impact.outputs.run_static == 'true' || steps.impact.outputs.run_build == 'true') && steps.build_reuse.outputs.hit != 'true'
        working-directory: target/${{ inputs.working_directory }}
        run: flutter pub get

      - name: Post dependency preparation
        if: (steps.impact.outputs.run_static == 'true' || steps.impact.outputs.run_build == 'true') && steps.build_reuse.outputs.hit != 'true' && inputs.post_pub_get_command != ''
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        env:
          APPLAB_POST_PUB_GET_COMMAND: ${{ inputs.post_pub_get_command }}
        run: bash -Eeuo pipefail -c "$APPLAB_POST_PUB_GET_COMMAND"

      - name: Adaptive Flutter checks and build
        id: quality
        if: (steps.impact.outputs.run_static == 'true' || steps.impact.outputs.run_build == 'true') && steps.build_reuse.outputs.hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/adaptive_checks.py \
            --plan "$GITHUB_WORKSPACE/applab-analysis-plan/analysis-plan.json" \
            --engine flutter \
            --project-dir "$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}" \
            --repo-root "$GITHUB_WORKSPACE/target" \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --build-command "${{ inputs.build_command }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve APK
        if: steps.impact.outputs.run_build == 'true' && steps.build_reuse.outputs.hit != 'true'
        id: apk
        shell: bash
        run: |
          APK_FILE="$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}/${{ inputs.apk_path }}"
          if [[ ! -s "$APK_FILE" ]]; then
            echo "Expected APK not found or empty: $APK_FILE" >&2
            exit 1
          fi
          CANDIDATE_APK="$RUNNER_TEMP/applab-candidate.apk"
          cp "$APK_FILE" "$CANDIDATE_APK"
          test "$(sha256sum "$APK_FILE" | awk '{print $1}')" = "$(sha256sum "$CANDIDATE_APK" | awk '{print $1}')"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "candidate_file=$CANDIDATE_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_FILE" | tee "$GITHUB_WORKSPACE/applab-report/apk.txt"


      - name: Restore trusted AppLab contract packager
        if: steps.impact.outputs.run_build == 'true' && steps.build_reuse.outputs.hit != 'true'
        shell: bash
        env:
          APPLAB_TRUSTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          git -C "$GITHUB_WORKSPACE/.applab" reset --hard "$APPLAB_TRUSTED_SHA"
          git -C "$GITHUB_WORKSPACE/.applab" clean -ffd
          test "$(git -C "$GITHUB_WORKSPACE/.applab" rev-parse HEAD)" = "$APPLAB_TRUSTED_SHA"

      - name: Restore target source before trusted packaging
        if: steps.impact.outputs.run_build == 'true' && steps.build_reuse.outputs.hit != 'true'
        id: trusted_target
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_ROOT="$GITHUB_WORKSPACE/target"
          EXPECTED_SHA="${{ steps.target.outputs.resolved_sha }}"
          test "$(git -C "$TARGET_ROOT" rev-parse HEAD)" = "$EXPECTED_SHA"
          git -C "$TARGET_ROOT" reset --hard "$EXPECTED_SHA"
          git -C "$TARGET_ROOT" clean -ffd
          test "$(git -C "$TARGET_ROOT" rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$TARGET_ROOT/.applab-candidate"
          TRUSTED_APK="$TARGET_ROOT/.applab-candidate/app.apk"
          cp "${{ steps.apk.outputs.candidate_file }}" "$TRUSTED_APK"
          test "$(sha256sum "${{ steps.apk.outputs.candidate_file }}" | awk '{print $1}')" = "$(sha256sum "$TRUSTED_APK" | awk '{print $1}')"
          echo "apk_file=$TRUSTED_APK" >> "$GITHUB_OUTPUT"

      - name: Package isolated APK contract
        if: steps.impact.outputs.run_build == 'true' && steps.build_reuse.outputs.hit != 'true'
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          ARTIFACT_NAME="${{ steps.accel.outputs.artifact_name }}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          python .applab/scripts/package_build_contract.py \
            --repo-root "$GITHUB_WORKSPACE/target" \
            --apk "${{ steps.trusted_target.outputs.apk_file }}" \
            --output "$GITHUB_WORKSPACE/applab-build-contract" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ steps.target.outputs.resolved_sha }}" \
            --engine "flutter" \
            --working-directory "${{ inputs.working_directory }}" \
            --package-id "${{ inputs.package_id }}" \
            --maestro-flow "${{ inputs.maestro_flow }}" \
            --analysis-mode "${{ inputs.analysis_mode }}" \
            --baseline-sha "${{ inputs.baseline_sha }}" \
            --analysis-plan-input "$GITHUB_WORKSPACE/applab-analysis-plan/analysis-plan.json" \
            --history-file "$GITHUB_WORKSPACE/.applab-history/history.jsonl" \
            --history-key "${{ inputs.history_key }}" \
            --source-ref "${{ inputs.source_ref != '' && inputs.source_ref || inputs.ref }}" \
            --quality-json "$GITHUB_WORKSPACE/applab-report/adaptive-quality.json" \
            --build-command "${{ inputs.build_command }}" \
            --analyze-status "${{ steps.quality.outputs.analyze || 'NOT_RUN' }}" \
            --lint-status "N/A" \
            --test-status "${{ steps.quality.outputs.unit_tests || 'NOT_RUN' }}" \
            --build-status "${{ steps.quality.outputs.build || 'PASS' }}"
          cp "$GITHUB_WORKSPACE/applab-acceleration/execution-plan.json" \
             "$GITHUB_WORKSPACE/applab-build-contract/execution-plan.json"

      - name: Upload isolated APK contract
        if: steps.impact.outputs.run_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.accel.outputs.artifact_name }}
          path: applab-build-contract/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

      - name: Record analysis-only pipeline metrics
        if: steps.impact.outputs.run_runtime != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RUN_STARTED_AT="$(python .applab/scripts/github_run_started_at.py)"
          python .applab/scripts/pipeline_metrics.py \
            --plan "$GITHUB_WORKSPACE/applab-analysis-plan/analysis-plan.json" \
            --quality "$GITHUB_WORKSPACE/applab-report/adaptive-quality.json" \
            --execution-plan "$GITHUB_WORKSPACE/applab-report/execution-plan.json" \
            --workflow-started-at "$RUN_STARTED_AT" \
            --output "$GITHUB_WORKSPACE/applab-report/pipeline-metrics.json"

      - name: Finalize analysis-only result
        if: steps.impact.outputs.run_runtime != 'true'
        shell: bash
        run: |
          python .applab/scripts/incremental_result.py \
            --plan "$GITHUB_WORKSPACE/applab-analysis-plan/analysis-plan.json" \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --repository "${{ inputs.repository }}" \
            --ref "${{ inputs.source_ref != '' && inputs.source_ref || inputs.ref }}" \
            --resolved-sha "${{ steps.target.outputs.resolved_sha }}" \
            --history-key "${{ inputs.history_key }}" \
            --quality-json "$GITHUB_WORKSPACE/applab-report/adaptive-quality.json" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload analysis-only watcher result
        if: steps.impact.outputs.run_runtime != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-${{ inputs.history_key }}-${{ github.run_id }}
          path: applab-report/
          if-no-files-found: error
          retention-days: 1

      - name: Evaluate analysis-only cache eligibility
        id: analysis_cache
        if: steps.impact.outputs.run_runtime != 'true' && inputs.cache_verification
        shell: bash
        run: |
          set -Eeuo pipefail
          RESULT="$(python -c 'import json; print(str(json.load(open("applab-report/result.json")).get("result","FAIL")).upper())' 2>/dev/null || echo FAIL)"
          if [[ "$RESULT" == "PASS" ]]; then
            echo "cacheable=true" >> "$GITHUB_OUTPUT"
          else
            echo "cacheable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare analysis-only verification cache payload
        if: steps.analysis_cache.outputs.cacheable == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$GITHUB_WORKSPACE/.applab-watch-cache"
          mkdir -p "$GITHUB_WORKSPACE/.applab-watch-cache"
          cp "$GITHUB_WORKSPACE/applab-report/result.json" "$GITHUB_WORKSPACE/.applab-watch-cache/result.json"
          cp "$GITHUB_WORKSPACE/applab-report/summary.md" "$GITHUB_WORKSPACE/.applab-watch-cache/summary.md"

      - name: Cache analysis-only PASS commit
        if: steps.analysis_cache.outputs.cacheable == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-watch-cache
          key: applab-c${{ steps.adaptive_contract.outputs.fingerprint }}-p${{ inputs.config_fingerprint }}-${{ inputs.history_key }}-${{ steps.target.outputs.resolved_sha }}

      - name: Upload build-phase evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-build-evidence-${{ inputs.history_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 1

  verify:
    name: Trusted verify ${{ inputs.repository }}
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.run_runtime == 'true'
    uses: ./.github/workflows/trusted-apk-verifier.yml
    with:
      build_artifact_name: ${{ needs.build.outputs.artifact_name }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.source_ref != '' && inputs.source_ref || inputs.ref }}
      resolved_sha: ${{ needs.build.outputs.resolved_sha }}
      engine: "flutter"
      history_key: ${{ inputs.history_key }}
      cache_verification: ${{ inputs.cache_verification }}
      contract_fingerprint: ${{ needs.build.outputs.contract_fingerprint }}
      config_fingerprint: ${{ inputs.config_fingerprint }}
      approve_visual_baseline: ${{ inputs.approve_visual_baseline }}
      analysis_mode: ${{ inputs.analysis_mode }}
      publish_release_artifact: ${{ inputs.publish_release_artifact }}
      run_maestro: ${{ inputs.run_maestro }}
      android_prepare_command: ${{ inputs.android_prepare_command }}
      api_level: ${{ inputs.api_level }}
      emulator_profile: ${{ inputs.emulator_profile }}
      start_timeout: "30"
      settle_seconds: "5"

  report_build_failure:
    name: Report build failure
    needs: build
    if: always() && needs.build.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Finalize failed build result
        shell: bash
        env:
          RESOLVED_SHA: ${{ needs.build.outputs.resolved_sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/applab-report"
          SHA="$RESOLVED_SHA"
          [[ -n "$SHA" ]] || SHA="${{ inputs.ref }}"
          python .applab/scripts/finalize_external_result.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --repository "${{ inputs.repository }}" \
            --ref "${{ inputs.source_ref != '' && inputs.source_ref || inputs.ref }}" \
            --resolved-sha "$SHA" \
            --history-key "${{ inputs.history_key }}" \
            --engine "flutter" \
            --pipeline-status failure \
            --run-id "$GITHUB_RUN_ID" \
            --analysis-mode "${{ inputs.analysis_mode }}"

      - name: Keep failed SHA retryable
        if: inputs.cache_verification && needs.build.outputs.resolved_sha != ''
        run: echo "Build failure is recorded as evidence but is intentionally not cached as verified."

      - name: Upload failed build result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-${{ inputs.history_key }}-${{ github.run_id }}
          path: applab-report/
          if-no-files-found: error
          retention-days: 1
