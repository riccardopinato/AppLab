name: External Flutter Project Runner

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository in owner/name format
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA to verify
        required: false
        default: main
        type: string
      working_directory:
        description: Flutter project directory inside the target repository
        required: false
        default: "."
        type: string
      flutter_channel:
        description: Flutter channel used when flutter_version is empty
        required: false
        default: stable
        type: string
      flutter_version:
        description: Optional exact Flutter version
        required: false
        default: ""
        type: string
      java_version:
        description: Java version used to build the target project
        required: false
        default: "17"
        type: string
      prepare_command:
        description: Optional repository-specific command run before flutter pub get
        required: false
        default: ""
        type: string
      post_pub_get_command:
        description: Optional repository-specific command run after flutter pub get
        required: false
        default: ""
        type: string
      android_prepare_command:
        description: Optional command run with ADB available after a preliminary APK install
        required: false
        default: ""
        type: string
      api_level:
        description: Android emulator API level
        required: false
        default: "35"
        type: string
      emulator_profile:
        description: Android emulator hardware profile
        required: false
        default: pixel_7_pro
        type: string
      apk_path:
        description: APK path relative to working_directory
        required: false
        default: build/app/outputs/flutter-apk/app-debug.apk
        type: string
      package_id:
        description: Optional Android application id; empty enables automatic detection
        required: false
        default: ""
        type: string
      build_command:
        description: Flutter APK build command
        required: false
        default: flutter build apk --debug
        type: string
      run_flutter_tests:
        description: Run flutter analyze and flutter test
        required: false
        default: true
        type: boolean
      run_maestro:
        description: Run Maestro after launch
        required: false
        default: true
        type: boolean
      maestro_flow:
        description: Optional Maestro flow path relative to target repository root
        required: false
        default: ""
        type: string
      history_key:
        description: Stable identifier used by AppLab Watcher history and caches
        required: false
        default: external
        type: string
      cache_verification:
        description: Save this resolved commit as already verified by AppLab Watcher
        required: false
        default: false
        type: boolean
      cache_epoch:
        description: Legacy watcher cache epoch (retained for compatibility)
        required: false
        default: "1"
        type: string
      contract_fingerprint:
        description: Automatic AppLab verification contract fingerprint
        required: false
        default: "manual"
        type: string
      start_timeout:
        description: Seconds allowed for the app process to start
        required: false
        default: "30"
        type: string
      settle_seconds:
        description: Seconds to let the app settle before visual verification
        required: false
        default: "5"
        type: string
  workflow_call:
    inputs:
      repository:
        description: Public GitHub repository in owner/name format
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA to verify
        required: false
        default: main
        type: string
      working_directory:
        description: Flutter project directory inside the target repository
        required: false
        default: "."
        type: string
      flutter_channel:
        description: Flutter channel used when flutter_version is empty
        required: false
        default: stable
        type: string
      flutter_version:
        description: Optional exact Flutter version
        required: false
        default: ""
        type: string
      java_version:
        description: Java version used to build the target project
        required: false
        default: "17"
        type: string
      prepare_command:
        description: Optional repository-specific command run before flutter pub get
        required: false
        default: ""
        type: string
      post_pub_get_command:
        description: Optional repository-specific command run after flutter pub get
        required: false
        default: ""
        type: string
      android_prepare_command:
        description: Optional command run with ADB available after a preliminary APK install
        required: false
        default: ""
        type: string
      api_level:
        description: Android emulator API level
        required: false
        default: "35"
        type: string
      emulator_profile:
        description: Android emulator hardware profile
        required: false
        default: pixel_7_pro
        type: string
      apk_path:
        description: APK path relative to working_directory
        required: false
        default: build/app/outputs/flutter-apk/app-debug.apk
        type: string
      package_id:
        description: Optional Android application id; empty enables automatic detection
        required: false
        default: ""
        type: string
      build_command:
        description: Flutter APK build command
        required: false
        default: flutter build apk --debug
        type: string
      run_flutter_tests:
        description: Run flutter analyze and flutter test
        required: false
        default: true
        type: boolean
      run_maestro:
        description: Run Maestro after launch
        required: false
        default: true
        type: boolean
      maestro_flow:
        description: Optional Maestro flow path relative to target repository root
        required: false
        default: ""
        type: string
      history_key:
        description: Stable identifier used by AppLab Watcher history and caches
        required: false
        default: external
        type: string
      cache_verification:
        description: Save this resolved commit as already verified by AppLab Watcher
        required: false
        default: false
        type: boolean
      cache_epoch:
        description: Legacy watcher cache epoch (retained for compatibility)
        required: false
        default: "1"
        type: string
      contract_fingerprint:
        description: Automatic AppLab verification contract fingerprint
        required: false
        default: "manual"
        type: string
      start_timeout:
        description: Seconds allowed for the app process to start
        required: false
        default: "30"
        type: string
      settle_seconds:
        description: Seconds to let the app settle before visual verification
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: applab-external-${{ inputs.repository }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ inputs.repository }}@${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Validate target coordinates
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_REF: ${{ inputs.ref }}
          TARGET_WORKDIR: ${{ inputs.working_directory }}
          TARGET_APK_PATH: ${{ inputs.apk_path }}
          TARGET_MAESTRO_FLOW: ${{ inputs.maestro_flow }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath

          repo = os.environ["TARGET_REPOSITORY"].strip()
          ref = os.environ["TARGET_REF"].strip()
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise SystemExit(f"Invalid repository: {repo!r}")
          if not ref or any(ch in ref for ch in "\r\n"):
              raise SystemExit("Invalid ref")

          for key in ("TARGET_WORKDIR", "TARGET_APK_PATH", "TARGET_MAESTRO_FLOW"):
              raw = os.environ.get(key, "").strip()
              if not raw:
                  continue
              path = PurePosixPath(raw)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"{key} must be a safe repository-relative path: {raw!r}")
          PY

      - name: Checkout AppLab
        uses: actions/checkout@v7
        with:
          repository: riccardopinato/AppLab
          ref: ${{ github.sha }}
          path: .applab
          persist-credentials: false

      - name: Checkout target project
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: target
          persist-credentials: false

      - name: Prepare evidence directory
        id: target
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/applab-report"
          RESOLVED_SHA="$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)"
          echo "resolved_sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "repository=${{ inputs.repository }}"
            echo "ref=${{ inputs.ref }}"
            echo "resolved_sha=$RESOLVED_SHA"
            echo "working_directory=${{ inputs.working_directory }}"
            echo "apk_path=${{ inputs.apk_path }}"
          } | tee "$GITHUB_WORKSPACE/applab-report/project.txt"

      - name: Validate Flutter project
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}"
          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup Flutter channel
        if: inputs.flutter_version == ''
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Setup exact Flutter version
        if: inputs.flutter_version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Target preparation
        if: inputs.prepare_command != ''
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        env:
          APPLAB_PREPARE_COMMAND: ${{ inputs.prepare_command }}
        run: bash -Eeuo pipefail -c "$APPLAB_PREPARE_COMMAND"

      - name: Require Android scaffold
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}"
          if [[ ! -d "$PROJECT_DIR/android" ]]; then
            echo "Target has no android/ scaffold." >&2
            echo "Use prepare_command for repositories that generate platform scaffolding." >&2
            exit 1
          fi

      - name: Resolve dependencies
        working-directory: target/${{ inputs.working_directory }}
        run: flutter pub get

      - name: Post dependency preparation
        if: inputs.post_pub_get_command != ''
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        env:
          APPLAB_POST_PUB_GET_COMMAND: ${{ inputs.post_pub_get_command }}
        run: bash -Eeuo pipefail -c "$APPLAB_POST_PUB_GET_COMMAND"

      - name: Analyze
        if: inputs.run_flutter_tests
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee "$GITHUB_WORKSPACE/applab-report/flutter-analyze.txt"

      - name: Unit tests
        if: inputs.run_flutter_tests
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$GITHUB_WORKSPACE/applab-report/flutter-test.txt"

      - name: Build APK
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        run: |
          set -o pipefail
          ${{ inputs.build_command }} 2>&1 | tee "$GITHUB_WORKSPACE/applab-report/flutter-build.txt"

      - name: Resolve APK
        id: apk
        shell: bash
        run: |
          APK_FILE="$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}/${{ inputs.apk_path }}"
          if [[ ! -s "$APK_FILE" ]]; then
            echo "Expected APK not found or empty: $APK_FILE" >&2
            exit 1
          fi
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_FILE" | tee "$GITHUB_WORKSPACE/applab-report/apk.txt"

      - name: Restore trusted AppLab verifier
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C "$GITHUB_WORKSPACE/.applab" reset --hard "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/.applab" clean -ffd
          test "$(git -C "$GITHUB_WORKSPACE/.applab" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Maestro
        if: inputs.run_maestro
        run: |
          chmod +x .applab/scripts/install_maestro.sh
          .applab/scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore previous passing visual baseline
        id: visual_baseline
        uses: actions/cache/restore@v6
        with:
          path: .applab-visual-baseline
          key: applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-${{ steps.target.outputs.resolved_sha }}
          restore-keys: |
            applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-

      - name: Verify APK on Android
        id: verify
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APPLAB_APK_FILE: ${{ steps.apk.outputs.apk_file }}
          APPLAB_RUN_MAESTRO: ${{ inputs.run_maestro }}
          APPLAB_MAESTRO_FLOW: ${{ inputs.maestro_flow }}
          APPLAB_ANDROID_PREPARE_COMMAND: ${{ inputs.android_prepare_command }}
          APPLAB_PACKAGE_ID: ${{ inputs.package_id }}
          APPLAB_TARGET_ROOT: ${{ github.workspace }}/target
          APPLAB_PROJECT_ROOT: ${{ github.workspace }}/target/${{ inputs.working_directory }}
          APPLAB_TRUSTED_ROOT: ${{ github.workspace }}/.applab
          APPLAB_TRUSTED_SHA: ${{ github.sha }}
          APPLAB_REPORT_DIR: ${{ github.workspace }}/applab-report
          APPLAB_VISUAL_BASELINE_DIR: ${{ github.workspace }}/.applab-visual-baseline
          APPLAB_VERSION: "0.6.3"
          START_TIMEOUT: ${{ inputs.start_timeout }}
          SETTLE_SECONDS: ${{ inputs.settle_seconds }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.emulator_profile }}
          disable-animations: true
          script: bash .applab/scripts/run_external_android_gate.sh

      - name: Prepare PASS-only visual baseline
        id: baseline
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          python .applab/scripts/prepare_visual_baseline.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --baseline-dir "$GITHUB_WORKSPACE/.applab-visual-baseline" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ steps.target.outputs.resolved_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --version "0.6.3" \
            --github-output "$GITHUB_OUTPUT"

      - name: Save PASS-only visual baseline
        if: steps.baseline.outputs.promote == 'true'
        uses: actions/cache/save@v6
        with:
          path: .applab-visual-baseline
          key: applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-${{ steps.target.outputs.resolved_sha }}-${{ github.run_id }}

      - name: Finalize external result contract
        if: always()
        env:
          APPLAB_PIPELINE_STATUS: ${{ job.status }}
          APPLAB_RESOLVED_SHA: ${{ steps.target.outputs.resolved_sha }}
        run: |
          python .applab/scripts/finalize_external_result.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --repository "${{ inputs.repository }}" \
            --ref "${{ inputs.ref }}" \
            --resolved-sha "$APPLAB_RESOLVED_SHA" \
            --history-key "${{ inputs.history_key }}" \
            --engine flutter \
            --pipeline-status "$APPLAB_PIPELINE_STATUS" \
            --run-id "$GITHUB_RUN_ID"

      - name: Prepare verification cache payload
        if: always() && inputs.cache_verification && steps.target.outputs.resolved_sha != ''
        run: |
          rm -rf "$GITHUB_WORKSPACE/.applab-watch-cache"
          mkdir -p "$GITHUB_WORKSPACE/.applab-watch-cache"
          cp "$GITHUB_WORKSPACE/applab-report/result.json" "$GITHUB_WORKSPACE/.applab-watch-cache/result.json"
          cp "$GITHUB_WORKSPACE/applab-report/summary.md" "$GITHUB_WORKSPACE/.applab-watch-cache/summary.md"

      - name: Mark resolved commit as checked
        if: always() && inputs.cache_verification && steps.target.outputs.resolved_sha != ''
        uses: actions/cache/save@v6
        with:
          path: .applab-watch-cache
          key: applab-c${{ inputs.contract_fingerprint }}-${{ inputs.history_key }}-${{ steps.target.outputs.resolved_sha }}

      - name: Publish AppLab summary
        if: always()
        shell: bash
        env:
          APPLAB_TARGET_REPOSITORY: ${{ inputs.repository }}
          APPLAB_TARGET_REF: ${{ inputs.ref }}
          APPLAB_TARGET_WORKDIR: ${{ inputs.working_directory }}
          APPLAB_VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## AppLab External Project Runner"
            echo
            printf -- '- Target: `%s@%s`\n' "$APPLAB_TARGET_REPOSITORY" "$APPLAB_TARGET_REF"
            printf -- '- Working directory: `%s`\n' "$APPLAB_TARGET_WORKDIR"
            printf -- '- Android verification: `%s`\n' "$APPLAB_VERIFY_OUTCOME"
            echo
            if [[ -f "$GITHUB_WORKSPACE/applab-report/summary.md" ]]; then
              cat "$GITHUB_WORKSPACE/applab-report/summary.md"
            else
              echo "No Android runtime report was produced."
              echo "Inspect dependency, analyze, test, build, or APK-resolution steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AppLab evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: applab-${{ inputs.history_key }}-${{ github.run_id }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 14
