name: AppLab CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: applab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh watch-profiles/*.sh

      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          PYTHONPATH=backend pytest backend/tests -q

      - name: Validate watcher tooling
        run: |
          python -m py_compile \
            scripts/dismiss_foreign_anr.py \
            scripts/finalize_external_result.py \
            scripts/release_artifact.py \
            scripts/interaction_crawler.py \
            scripts/journey_crawler.py \
            scripts/system_lab.py \
            scripts/performance_lab.py \
            scripts/network_lab.py \
            scripts/persistence_lab.py \
            scripts/configuration_lab.py \
            scripts/resource_pressure_lab.py \
            scripts/background_lab.py \
            scripts/storage_lab.py \
            scripts/smart_test_plan.py \
            scripts/adaptive_checks.py \
            scripts/incremental_result.py \
            scripts/shadow_calibration.py \
            scripts/domain_fingerprint.py \
            scripts/pipeline_metrics.py \
            scripts/github_run_started_at.py \
            scripts/history_learning.py \
            scripts/verification_intelligence.py \
            scripts/workflow_contract_test.py \
            scripts/upgrade_lab.py \
            scripts/prepare_upgrade_baseline.py \
            scripts/prepare_performance_baseline.py \
            scripts/project_autodiscover.py \
            scripts/contract_fingerprint.py \
            scripts/prepare_visual_baseline.py \
            scripts/package_build_contract.py \
            scripts/validate_build_contract.py \
            scripts/visual_qa.py \
            scripts/visual_policy.py \
            scripts/visual_regression.py \
            scripts/visual_journey.py \
            scripts/visual_journey_runtime.py \
            scripts/watch_discover.py \
            scripts/watch_aggregate.py \
            scripts/app_intelligence.py \
            scripts/change_intelligence.py \
            scripts/trusted_evidence_manifest.py \
            scripts/product_review_common.py \
            scripts/behavioral_product_lab.py \
            scripts/state_edge_case_lab.py \
            scripts/evidence_calibration.py \
            scripts/evidence_confidence_engine.py \
            scripts/user_journey_intelligence.py \
            scripts/ux_friction_lab.py \
            scripts/longitudinal_product_intelligence.py \
            scripts/autonomous_experiment_planner.py \
            scripts/applab_analyst.py \
            scripts/product_contract_audit.py \
            scripts/decision_brief.py \
            scripts/autonomous_app_review.py \
            scripts/market_intelligence.py \
            scripts/build_cross_app_corpus.py \
            scripts/cross_app_intelligence.py \
            scripts/audit_orchestrator.py \
            scripts/studio_snapshot.py \
            scripts/control_center_snapshot.py \
            scripts/maintainability_budget.py \
            tests/intelligence/intelligence_corpus_test.py
          python scripts/dismiss_foreign_anr.py --self-test
          python scripts/interaction_crawler.py --self-test
          python scripts/journey_crawler.py --self-test
          python scripts/system_lab.py --self-test
          python scripts/performance_lab.py --self-test
          python scripts/network_lab.py --self-test
          python scripts/persistence_lab.py --self-test
          python scripts/configuration_lab.py --self-test
          python scripts/resource_pressure_lab.py --self-test
          python scripts/background_lab.py --self-test
          python scripts/storage_lab.py --self-test
          python scripts/smart_test_plan.py --self-test
          python scripts/adaptive_checks.py --self-test
          python scripts/incremental_result.py --self-test
          python scripts/shadow_calibration.py --self-test
          python scripts/domain_fingerprint.py --self-test
          python scripts/pipeline_metrics.py --self-test
          python scripts/github_run_started_at.py --self-test
          python scripts/history_learning.py --self-test
          python scripts/verification_intelligence.py --self-test
          python scripts/workflow_contract_test.py
          python scripts/audit_contract_test.py
          python scripts/upgrade_lab.py --self-test
          python scripts/prepare_upgrade_baseline.py --self-test
          python scripts/prepare_performance_baseline.py --self-test
          python scripts/project_autodiscover.py --self-test
          python scripts/prepare_visual_baseline.py --self-test
          python scripts/release_artifact.py --self-test
          python scripts/certification_gate.py --self-test
          python scripts/finalize_certification_matrix.py --self-test
          python scripts/package_build_contract.py --self-test
          python scripts/validate_build_contract.py --self-test
          python scripts/visual_qa.py --self-test
          python scripts/visual_policy.py
          python scripts/visual_regression.py --self-test
          python scripts/visual_journey.py --self-test
          python scripts/watch_discover.py \
            --watchlist watchlist.json \
            --validate-only
          python scripts/app_intelligence.py --self-test
          python scripts/change_intelligence.py --self-test
          python scripts/trusted_evidence_manifest.py --self-test
          python scripts/behavioral_product_lab.py --self-test
          python scripts/state_edge_case_lab.py --self-test
          python scripts/evidence_calibration.py --self-test
          python scripts/evidence_confidence_engine.py --self-test
          python scripts/user_journey_intelligence.py --self-test
          python scripts/ux_friction_lab.py --self-test
          python scripts/longitudinal_product_intelligence.py --self-test
          python scripts/autonomous_experiment_planner.py --self-test
          python scripts/applab_analyst.py --self-test
          python scripts/product_contract_audit.py --self-test
          python scripts/decision_brief.py --self-test
          python scripts/autonomous_app_review.py --self-test
          python scripts/market_intelligence.py --self-test
          python scripts/build_cross_app_corpus.py --self-test
          python scripts/cross_app_intelligence.py --self-test
          python scripts/audit_orchestrator.py --self-test
          python scripts/studio_snapshot.py --self-test
          python scripts/control_center_snapshot.py --self-test
          python scripts/maintainability_budget.py
          python tests/intelligence/intelligence_corpus_test.py

      - name: Frontend build
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          VITE_APPLAB_READ_ONLY=true npm run build -- --outDir dist-readonly

      - name: Build backend container
        run: docker build -t applab-backend:ci backend

      - name: Backend container health smoke
        run: |
          docker run -d --name applab-backend-ci -p 8000:8000 applab-backend:ci
          healthy=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health | grep -q '"version":"4.0.2"'; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != "true" ]]; then
            docker logs applab-backend-ci
            exit 1
          fi

      - name: Validate live compose
        run: docker compose -f docker-compose.live.yml config >/dev/null

      - name: Build frontend container
        run: docker build -t applab-frontend:ci frontend

      - name: Cleanup containers
        if: always()
        run: docker rm -f applab-backend-ci >/dev/null 2>&1 || true

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r backend/requirements.txt --progress-spinner off

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
