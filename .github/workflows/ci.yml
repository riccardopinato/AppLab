      - name: PostgreSQL v5.4B + v5.4E + v5.4F durable schema smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          NAME="applab-v54b-postgres"
          cleanup() { docker rm -f "$NAME" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$NAME" \
            -e POSTGRES_PASSWORD=shadow \
            -e POSTGRES_DB=applab_shadow \
            postgres:16-alpine >/dev/null
          ready=false
          for _ in {1..30}; do
            if docker exec "$NAME" psql -U postgres -d applab_shadow -Atqc 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            docker logs "$NAME"
            exit 1
          fi
          for _ in 1 2; do
            docker exec -i "$NAME" psql \
              -v ON_ERROR_STOP=1 \
              -U postgres \
              -d applab_shadow \
              < integration/orchestration/sql/postgres-v54b-shadow.sql
          done
          for _ in 1 2; do
            docker exec -i "$NAME" psql \
              -v ON_ERROR_STOP=1 \
              -U postgres \
              -d applab_shadow \
              < integration/orchestration/sql/postgres-v54e-queue.sql
          done
          for _ in 1 2; do
            docker exec -i "$NAME" psql \
              -v ON_ERROR_STOP=1 \
              -U postgres \
              -d applab_shadow \
              < integration/orchestration/sql/postgres-v54f-workers.sql
          done
          test "$(docker exec "$NAME" psql -Atq -U postgres -d applab_shadow -c "SELECT value FROM applab_store_meta WHERE key='mode';")" = "SHADOW_NO_DISPATCH"
          test "$(docker exec "$NAME" psql -Atq -U postgres -d applab_shadow -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'applab_%';")" -ge 6

          docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c "
            INSERT INTO applab_operations(
              operation_id,idempotency_key,correlation_id,repository,source_ref,
              resolved_sha,applab_sha,operation_class,analysis_mode,queue_key,
              priority,authority,initial_state,current_state,immutable_identity_sha256,payload
            ) VALUES (
              'op_pg_shadow','idem_pg_shadow','cor_pg_shadow','owner/app','main',
              repeat('a',40),repeat('b',40),'VERIFICATION','fast','owner/app|main|VERIFICATION',
              200,'ORCHESTRATION_ONLY','QUEUED','QUEUED','sha256:fixture','{}'::jsonb
            );"

          if docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c             "DELETE FROM applab_operations WHERE operation_id='op_pg_shadow';" >/dev/null 2>&1; then
            echo "PostgreSQL operation DELETE unexpectedly succeeded"
            exit 1
          fi

          if docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c             "UPDATE applab_operations SET current_state='PLANNING' WHERE operation_id='op_pg_shadow';" >/dev/null 2>&1; then
            echo "PostgreSQL state update without Transition unexpectedly succeeded"
            exit 1
          fi

          docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c "
            INSERT INTO applab_operation_transitions(
              transition_id,operation_id,sequence_number,from_state,to_state,
              reason_code,actor,occurred_at,metadata_digest_sha256,payload_sha256,payload
            ) VALUES (
              'trn_pg_shadow','op_pg_shadow',1,'QUEUED','PLANNING',
              'SHADOW_SMOKE','ci-v54b',NOW(),'sha256:metadata-fixture','sha256:fixture','{}'::jsonb
            );
            UPDATE applab_operations
            SET current_state='PLANNING'
            WHERE operation_id='op_pg_shadow';"
          test "$(docker exec "$NAME" psql -Atq -U postgres -d applab_shadow -c "SELECT current_state FROM applab_operations WHERE operation_id='op_pg_shadow';")" = "PLANNING"

          docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c "
            INSERT INTO applab_queue_entries(
              operation_id,repository,source_ref,operation_class,resolved_sha,priority,
              state,protected,preserve_for_calibration,enqueued_at,available_at,
              retry_count,max_retries,updated_at
            ) VALUES (
              'op_pg_shadow','owner/app','main','VERIFICATION',repeat('a',40),200,
              'QUEUED',FALSE,FALSE,NOW(),NOW(),0,2,NOW()
            );
            INSERT INTO applab_queue_history(
              operation_id,action,from_state,to_state,reason,occurred_at,payload
            ) VALUES (
              'op_pg_shadow','ENQUEUE',NULL,'QUEUED','CI_SMOKE',NOW(),'{}'::jsonb
            );"
          test "$(docker exec "$NAME" psql -Atq -U postgres -d applab_shadow -c "SELECT state FROM applab_queue_entries WHERE operation_id='op_pg_shadow';")" = "QUEUED"

          if docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c             "UPDATE applab_queue_entries SET resolved_sha=repeat('c',40) WHERE operation_id='op_pg_shadow';" >/dev/null 2>&1; then
            echo "PostgreSQL queue identity mutation unexpectedly succeeded"
            exit 1
          fi

          if docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c             "UPDATE applab_queue_history SET reason='tampered' WHERE operation_id='op_pg_shadow';" >/dev/null 2>&1; then
            echo "PostgreSQL queue history mutation unexpectedly succeeded"
            exit 1
          fi

          if docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c             "DELETE FROM applab_queue_entries WHERE operation_id='op_pg_shadow';" >/dev/null 2>&1; then
            echo "PostgreSQL queue DELETE unexpectedly succeeded"
            exit 1
          fi

          docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c "
            INSERT INTO applab_warm_workers(
              worker_id,worker_class,state,applab_sha,capabilities,
              capability_digest_sha256,snapshot_digest_sha256,heartbeat_at,
              current_lease_id,quarantine_reason,registered_at,updated_at
            ) VALUES (
              'warm-pg','WARM_TRUSTED_ANDROID','STARTING',repeat('b',40),
              '{\"kvm\":true,\"android_runtime\":true,\"disposable_avd\":true,\"evidence_capture\":true,\"runtime_profiles\":[\"android-default\"]}'::jsonb,
              'sha256:capability-fixture','sha256:snapshot-fixture',NOW(),
              NULL,NULL,NOW(),NOW()
            );
            INSERT INTO applab_warm_worker_history(
              worker_id,lease_id,action,from_state,to_state,reason,occurred_at,payload
            ) VALUES (
              'warm-pg',NULL,'REGISTER',NULL,'STARTING','CI_SMOKE',NOW(),'{}'::jsonb
            );
            INSERT INTO applab_warm_worker_history(
              worker_id,lease_id,action,from_state,to_state,reason,occurred_at,payload
            ) VALUES (
              'warm-pg',NULL,'ACTIVATE','STARTING','AVAILABLE','CI_SMOKE',NOW(),'{}'::jsonb
            );
            UPDATE applab_warm_workers
            SET state='AVAILABLE'
            WHERE worker_id='warm-pg';"

          if docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c             "UPDATE applab_warm_workers SET state='LEASED' WHERE worker_id='warm-pg';" >/dev/null 2>&1; then
            echo "PostgreSQL warm-worker state mutation without history/lease unexpectedly succeeded"
            exit 1
          fi

          if docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c             "UPDATE applab_warm_workers SET applab_sha=repeat('c',40) WHERE worker_id='warm-pg';" >/dev/null 2>&1; then
            echo "PostgreSQL warm-worker identity mutation unexpectedly succeeded"
            exit 1
          fi

          if docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c             "UPDATE applab_warm_worker_history SET reason='tampered' WHERE worker_id='warm-pg';" >/dev/null 2>&1; then
            echo "PostgreSQL warm-worker history mutation unexpectedly succeeded"
            exit 1
          fi

          if docker exec "$NAME" psql -v ON_ERROR_STOP=1 -U postgres -d applab_shadow -c             "DELETE FROM applab_warm_workers WHERE worker_id='warm-pg';" >/dev/null 2>&1; then
            echo "PostgreSQL warm-worker DELETE unexpectedly succeeded"
            exit 1
          fi

      - name: Frontend build
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          VITE_APPLAB_READ_ONLY=true npm run build -- --outDir dist-readonly

      - name: Build backend container
        run: docker build -t applab-backend:ci backend

      - name: Backend container health smoke
        run: |
          docker run -d --name applab-backend-ci -p 8000:8000 applab-backend:ci
          healthy=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health | grep -q '"version":"5.3.5"'; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != "true" ]]; then
            docker logs applab-backend-ci
            exit 1
          fi

      - name: Validate live compose
        run: docker compose -f docker-compose.live.yml config >/dev/null

      - name: Build frontend container
        run: docker build -t applab-frontend:ci frontend

      - name: Cleanup containers
        if: always()
        run: docker rm -f applab-backend-ci >/dev/null 2>&1 || true

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r backend/requirements.txt --progress-spinner off

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
