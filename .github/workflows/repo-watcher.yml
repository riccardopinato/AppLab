name: AppLab Repo Watcher

on:
  push:
    branches: [main]
    paths:
      - "watchlist.json"
      - "watch-profiles/**"
      - "scripts/watch_*.py"
      - "scripts/finalize_external_result.py"
      - "scripts/run_external_android_gate.sh"
      - ".github/workflows/repo-watcher.yml"
      - ".github/workflows/external-project-runner.yml"
      - ".github/workflows/external-native-android-runner.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-run configured repositories even if their current SHA is cached
        required: false
        default: false
        type: boolean
      repository:
        description: Optional owner/name to run only one configured repository
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [applab-watch]

permissions:
  contents: read
  actions: write

concurrency:
  group: applab-repo-watcher
  cancel-in-progress: true

jobs:
  discover:
    name: Discover changed repositories
    runs-on: ubuntu-latest
    outputs:
      flutter_matrix: ${{ steps.matrix.outputs.flutter_matrix }}
      native_matrix: ${{ steps.matrix.outputs.native_matrix }}
      has_flutter_work: ${{ steps.matrix.outputs.has_flutter_work }}
      has_native_work: ${{ steps.matrix.outputs.has_native_work }}
      scheduled_count: ${{ steps.matrix.outputs.scheduled_count }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve watcher matrices
        id: matrix
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_INPUT: ${{ inputs.force }}
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.repository }}
          MANUAL_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -Eeuo pipefail
          FORCE=false
          if [[ "$FORCE_INPUT" == "true" ]]; then
            FORCE=true
          fi

          ONLY_REPOSITORY="$MANUAL_REPOSITORY"
          if [[ -z "$ONLY_REPOSITORY" && -n "$DISPATCH_REPOSITORY" ]]; then
            ONLY_REPOSITORY="$DISPATCH_REPOSITORY"
          fi

          ARGS=(
            --watchlist watchlist.json
            --applab-repository "$GITHUB_REPOSITORY"
            --matrix-output "$RUNNER_TEMP/watch-matrix.json"
            --flutter-matrix-output "$RUNNER_TEMP/flutter-matrix.json"
            --native-matrix-output "$RUNNER_TEMP/native-matrix.json"
            --status-output "$GITHUB_WORKSPACE/watch-discovery.json"
          )
          if [[ "$FORCE" == "true" ]]; then
            ARGS+=(--force)
          fi
          if [[ -n "$ONLY_REPOSITORY" ]]; then
            ARGS+=(--only-repository "$ONLY_REPOSITORY")
          fi

          python scripts/watch_discover.py "${ARGS[@]}"

          FLUTTER_MATRIX="$(cat "$RUNNER_TEMP/flutter-matrix.json")"
          NATIVE_MATRIX="$(cat "$RUNNER_TEMP/native-matrix.json")"
          FLUTTER_COUNT="$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["include"]))' "$RUNNER_TEMP/flutter-matrix.json")"
          NATIVE_COUNT="$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["include"]))' "$RUNNER_TEMP/native-matrix.json")"
          COUNT=$((FLUTTER_COUNT + NATIVE_COUNT))

          echo "flutter_matrix=$FLUTTER_MATRIX" >> "$GITHUB_OUTPUT"
          echo "native_matrix=$NATIVE_MATRIX" >> "$GITHUB_OUTPUT"
          echo "scheduled_count=$COUNT" >> "$GITHUB_OUTPUT"

          [[ "$FLUTTER_COUNT" -gt 0 ]] &&
            echo "has_flutter_work=true" >> "$GITHUB_OUTPUT" ||
            echo "has_flutter_work=false" >> "$GITHUB_OUTPUT"

          [[ "$NATIVE_COUNT" -gt 0 ]] &&
            echo "has_native_work=true" >> "$GITHUB_OUTPUT" ||
            echo "has_native_work=false" >> "$GITHUB_OUTPUT"

      - name: Discovery summary
        shell: bash
        run: |
          {
            echo "## AppLab watcher discovery"
            echo
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("watch-discovery.json").read_text())
          rows = data.get("repositories", [])
          print(f"- Scheduled: {data.get('scheduled_count', 0)}")
          print(f"- Flutter: {data.get('flutter_scheduled_count', 0)}")
          print(f"- Native Android: {data.get('native_scheduled_count', 0)}")
          print()
          print("| Engine | Repository | SHA | State |")
          print("| --- | --- | --- | --- |")
          for item in rows:
              sha = str(item.get("resolved_sha", ""))[:8] or "—"
              if item.get("error"):
                  state = "ERROR"
              elif item.get("cached"):
                  state = "cached"
              elif item.get("scheduled"):
                  state = "scheduled"
              else:
                  state = "skipped"
              print(
                  f"| {item.get('engine', 'flutter')} | "
                  f"{item.get('repository', '—')} | `{sha}` | {state} |"
              )
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: applab-watch-discovery-${{ github.run_id }}
          path: watch-discovery.json
          if-no-files-found: error
          retention-days: 30

  verify_flutter:
    name: Flutter ${{ matrix.repository }}
    if: needs.discover.outputs.has_flutter_work == 'true'
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.flutter_matrix) }}
    uses: ./.github/workflows/external-project-runner.yml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.resolved_sha }}
      working_directory: ${{ matrix.working_directory }}
      flutter_channel: ${{ matrix.flutter_channel }}
      flutter_version: ${{ matrix.flutter_version }}
      java_version: ${{ matrix.java_version }}
      prepare_command: ${{ matrix.prepare_command }}
      post_pub_get_command: ${{ matrix.post_pub_get_command }}
      android_prepare_command: ${{ matrix.android_prepare_command }}
      api_level: ${{ matrix.api_level }}
      emulator_profile: ${{ matrix.emulator_profile }}
      apk_path: ${{ matrix.apk_path }}
      package_id: ${{ matrix.package_id }}
      build_command: ${{ matrix.build_command }}
      run_flutter_tests: ${{ matrix.run_flutter_tests }}
      run_maestro: ${{ matrix.run_maestro }}
      maestro_flow: ${{ matrix.maestro_flow }}
      history_key: ${{ matrix.key }}
      cache_verification: true
      cache_epoch: ${{ matrix.cache_epoch }}

  verify_native:
    name: Native Android ${{ matrix.repository }}
    if: needs.discover.outputs.has_native_work == 'true'
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.native_matrix) }}
    uses: ./.github/workflows/external-native-android-runner.yml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.resolved_sha }}
      working_directory: ${{ matrix.working_directory }}
      java_version: ${{ matrix.java_version }}
      gradle_version: ${{ matrix.gradle_version }}
      compile_sdk: ${{ matrix.compile_sdk }}
      build_tools: ${{ matrix.build_tools }}
      prepare_command: ${{ matrix.prepare_command }}
      test_command: ${{ matrix.test_command }}
      lint_command: ${{ matrix.lint_command }}
      build_command: ${{ matrix.build_command }}
      apk_path: ${{ matrix.apk_path }}
      package_id: ${{ matrix.package_id }}
      verify_signature: ${{ matrix.verify_signature }}
      android_prepare_command: ${{ matrix.android_prepare_command }}
      api_level: ${{ matrix.api_level }}
      emulator_profile: ${{ matrix.emulator_profile }}
      run_maestro: ${{ matrix.run_maestro }}
      maestro_flow: ${{ matrix.maestro_flow }}
      history_key: ${{ matrix.key }}
      cache_verification: true
      cache_epoch: ${{ matrix.cache_epoch }}

  aggregate:
    name: Update central watcher history
    if: always()
    needs: [discover, verify_flutter, verify_native]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Restore central history
        id: history
        uses: actions/cache/restore@v4
        with:
          path: .applab-history
          key: applab-watch-history-${{ github.run_id }}
          restore-keys: |
            applab-watch-history-

      - name: Download current watcher reports
        uses: actions/download-artifact@v6
        with:
          pattern: applab-watch-*
          path: watch-results
          merge-multiple: false
        continue-on-error: true

      - name: Aggregate current results
        shell: bash
        run: |
          mkdir -p .applab-history
          python scripts/watch_aggregate.py \
            --results-dir watch-results \
            --history-file .applab-history/history.jsonl \
            --summary-output watch-summary.md \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat watch-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save central history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .applab-history
          key: applab-watch-history-${{ github.run_id }}

      - name: Upload central history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applab-watch-history-${{ github.run_id }}
          path: |
            watch-summary.md
            .applab-history/history.jsonl
          if-no-files-found: warn
          retention-days: 90
