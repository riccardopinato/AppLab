name: External Native Android Project Runner

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository in owner/name format
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA to verify
        required: false
        default: main
        type: string
      working_directory:
        description: Gradle project directory inside the target repository
        required: false
        default: "."
        type: string
      java_version:
        description: Java version used by the Android project
        required: false
        default: "17"
        type: string
      gradle_version:
        description: Gradle version used when the repository has no wrapper
        required: false
        default: "8.14.3"
        type: string
      compile_sdk:
        description: Android platform installed before the build
        required: false
        default: "35"
        type: string
      build_tools:
        description: Android build-tools version installed before the build
        required: false
        default: "35.0.0"
        type: string
      prepare_command:
        description: Optional project-specific preparation command
        required: false
        default: ""
        type: string
      test_command:
        description: Optional JVM/unit-test command
        required: false
        default: ""
        type: string
      lint_command:
        description: Optional Android lint/static-analysis command
        required: false
        default: ""
        type: string
      build_command:
        description: Command that produces the APK
        required: true
        type: string
      apk_path:
        description: APK path relative to working_directory
        required: true
        type: string
      package_id:
        description: Optional Android application id; empty enables automatic detection
        required: false
        default: ""
        type: string
      verify_signature:
        description: Verify the produced APK with apksigner
        required: false
        default: true
        type: boolean
      android_prepare_command:
        description: Optional command run with ADB available before AppLab verification
        required: false
        default: ""
        type: string
      api_level:
        description: Android emulator API level
        required: false
        default: "35"
        type: string
      emulator_profile:
        description: Android emulator hardware profile
        required: false
        default: pixel_7_pro
        type: string
      run_maestro:
        description: Run Maestro after launch
        required: false
        default: true
        type: boolean
      maestro_flow:
        description: Optional Maestro flow path relative to target repository root
        required: false
        default: ""
        type: string
      history_key:
        description: Stable identifier used by AppLab Watcher history and caches
        required: false
        default: external-native
        type: string
      cache_verification:
        description: Save this resolved commit as already verified by AppLab Watcher
        required: false
        default: false
        type: boolean
      cache_epoch:
        description: Legacy watcher cache epoch (retained for compatibility)
        required: false
        default: "1"
        type: string
      contract_fingerprint:
        description: Automatic AppLab verification contract fingerprint
        required: false
        default: "manual"
        type: string
      approve_visual_baseline:
        description: Explicitly accept a visual WARN as the new baseline
        required: false
        default: false
        type: boolean
      config_fingerprint:
        description: Fingerprint of this target's watcher/build configuration
        required: false
        default: "manual"
        type: string
      analysis_mode:
        description: AppLab analysis mode (fast, full or certification)
        required: false
        default: full
        type: string
      baseline_sha:
        description: Last verified SHA used for FAST changed-file planning
        required: false
        default: ""
        type: string
      history_risk_bias:
        description: Historical failure risk bias supplied by Repo Watcher
        required: false
        default: 0
        type: number
      publish_release_artifact:
        description: Allow CERTIFIED runs to publish the verified APK
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      ref:
        required: false
        default: main
        type: string
      working_directory:
        required: false
        default: "."
        type: string
      java_version:
        required: false
        default: "17"
        type: string
      gradle_version:
        required: false
        default: "8.14.3"
        type: string
      compile_sdk:
        required: false
        default: "35"
        type: string
      build_tools:
        required: false
        default: "35.0.0"
        type: string
      prepare_command:
        required: false
        default: ""
        type: string
      test_command:
        required: false
        default: ""
        type: string
      lint_command:
        required: false
        default: ""
        type: string
      build_command:
        required: true
        type: string
      apk_path:
        required: true
        type: string
      package_id:
        required: false
        default: ""
        type: string
      verify_signature:
        required: false
        default: true
        type: boolean
      android_prepare_command:
        required: false
        default: ""
        type: string
      api_level:
        required: false
        default: "35"
        type: string
      emulator_profile:
        required: false
        default: pixel_7_pro
        type: string
      run_maestro:
        required: false
        default: true
        type: boolean
      maestro_flow:
        required: false
        default: ""
        type: string
      history_key:
        required: false
        default: external-native
        type: string
      cache_verification:
        required: false
        default: false
        type: boolean
      cache_epoch:
        required: false
        default: "1"
        type: string
      contract_fingerprint:
        required: false
        default: "manual"
        type: string
      approve_visual_baseline:
        required: false
        default: false
        type: boolean
      config_fingerprint:
        required: false
        default: "manual"
        type: string
      analysis_mode:
        required: false
        default: full
        type: string
      baseline_sha:
        required: false
        default: ""
        type: string
      history_risk_bias:
        required: false
        default: 0
        type: number
      publish_release_artifact:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: applab-native-${{ inputs.repository }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.repository }}@${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      resolved_sha: ${{ steps.target.outputs.resolved_sha }}
      artifact_name: ${{ steps.contract.outputs.artifact_name }}
      analysis_lane: ${{ steps.impact.outputs.lane }}
      effective_mode: ${{ steps.impact.outputs.effective_mode }}
      runtime_required: ${{ steps.impact.outputs.runtime_required }}
      static_required: ${{ steps.impact.outputs.static_required }}
      risk_score: ${{ steps.impact.outputs.risk_score }}
      confidence: ${{ steps.impact.outputs.confidence }}
      shadow_full: ${{ steps.impact.outputs.shadow_full }}

    steps:
      - name: Validate target coordinates
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_REF: ${{ inputs.ref }}
          TARGET_WORKDIR: ${{ inputs.working_directory }}
          TARGET_APK_PATH: ${{ inputs.apk_path }}
          TARGET_MAESTRO_FLOW: ${{ inputs.maestro_flow }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath

          repo = os.environ["TARGET_REPOSITORY"].strip()
          ref = os.environ["TARGET_REF"].strip()
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise SystemExit(f"Invalid repository: {repo!r}")
          if not ref or any(ch in ref for ch in "\r\n"):
              raise SystemExit("Invalid ref")

          for key in ("TARGET_WORKDIR", "TARGET_APK_PATH", "TARGET_MAESTRO_FLOW"):
              raw = os.environ.get(key, "").strip()
              if not raw:
                  continue
              path = PurePosixPath(raw)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(
                      f"{key} must be a safe repository-relative path: {raw!r}"
                  )
          PY

      - name: Checkout AppLab
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Checkout target project
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: target
          fetch-depth: 2
          persist-credentials: false

      - name: Fetch FAST baseline commit
        if: inputs.analysis_mode == 'fast' && inputs.baseline_sha != ''
        shell: bash
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$BASELINE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git -C "$GITHUB_WORKSPACE/target" fetch --no-tags --depth=1 origin "$BASELINE_SHA" || true
          fi

      - name: Prepare evidence directory
        id: target
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/applab-report"
          RESOLVED_SHA="$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)"
          echo "resolved_sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "engine=native_android"
            echo "repository=${{ inputs.repository }}"
            echo "ref=${{ inputs.ref }}"
            echo "resolved_sha=$RESOLVED_SHA"
            echo "working_directory=${{ inputs.working_directory }}"
            echo "apk_path=${{ inputs.apk_path }}"
          } | tee "$GITHUB_WORKSPACE/applab-report/project.txt"

      - name: Plan adaptive analysis
        id: impact
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/smart_test_plan.py \
            --repo-root "$GITHUB_WORKSPACE/target" \
            --mode "${{ inputs.analysis_mode }}" \
            --baseline-sha "${{ inputs.baseline_sha }}" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ steps.target.outputs.resolved_sha }}" \
            --history-risk-bias "${{ inputs.history_risk_bias }}" \
            --shadow-rate 10 \
            --output "$GITHUB_WORKSPACE/applab-report/analysis-plan.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Adaptive analysis summary
        shell: bash
        run: |
          {
            echo "## AppLab v0.9 Adaptive Impact Analysis"
            echo
            echo "- Lane: `${{ steps.impact.outputs.lane }}`"
            echo "- Effective mode: `${{ steps.impact.outputs.effective_mode }}`"
            echo "- Risk: `${{ steps.impact.outputs.risk_level }}` (${{ steps.impact.outputs.risk_score }}/100)"
            echo "- Confidence: `${{ steps.impact.outputs.confidence }}`"
            echo "- Runtime required: `${{ steps.impact.outputs.runtime_required }}`"
            echo "- Shadow FULL sample: `${{ steps.impact.outputs.shadow_full }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Android project
        if: steps.impact.outputs.static_required == 'true'
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}"
          test -d "$PROJECT_DIR"
          if [[ ! -f "$PROJECT_DIR/settings.gradle" &&
                ! -f "$PROJECT_DIR/settings.gradle.kts" &&
                ! -f "$PROJECT_DIR/build.gradle" &&
                ! -f "$PROJECT_DIR/build.gradle.kts" ]]; then
            echo "No Gradle Android project found in $PROJECT_DIR" >&2
            exit 1
          fi

      - name: Setup Java
        if: steps.impact.outputs.static_required == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Install Android SDK components
        if: steps.impact.outputs.static_required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found on GitHub runner." >&2
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${{ inputs.compile_sdk }}" \
            "build-tools;${{ inputs.build_tools }}"

      - name: Setup Gradle
        if: steps.impact.outputs.static_required == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Target preparation
        if: steps.impact.outputs.static_required == 'true' && inputs.prepare_command != ''
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        env:
          APPLAB_PREPARE_COMMAND: ${{ inputs.prepare_command }}
        run: bash -Eeuo pipefail -c "$APPLAB_PREPARE_COMMAND"

      - name: Adaptive Android quality and build plan
        if: steps.impact.outputs.static_required == 'true'
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
          LINT_COMMAND: ${{ inputs.lint_command }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          RUNTIME_REQUIRED: ${{ steps.impact.outputs.runtime_required }}
          ANALYSIS_LANE: ${{ steps.impact.outputs.lane }}
          CONFIDENCE: ${{ steps.impact.outputs.confidence }}
          MODULES_JSON: ${{ steps.impact.outputs.android_modules }}
        run: |
          set -Eeuo pipefail
          python - <<'PY' > "$RUNNER_TEMP/applab-gradle-plan.json"
          import json, os, re, shlex
          test=os.environ.get("TEST_COMMAND","").strip()
          lint=os.environ.get("LINT_COMMAND","").strip()
          build=os.environ.get("BUILD_COMMAND","").strip() if os.environ.get("RUNTIME_REQUIRED")=="true" else ""
          commands=[x for x in (test,lint,build) if x]
          modules=json.loads(os.environ.get("MODULES_JSON") or "[]")
          confidence=float(os.environ.get("CONFIDENCE") or "0")
          lane=os.environ.get("ANALYSIS_LANE","")
          parsed=[]
          for command in commands:
              parts=shlex.split(command)
              parsed.append(parts)
          can_merge=bool(parsed) and all(p and p[0] in {"gradle","./gradlew","gradlew"} for p in parsed)
          executable=parsed[0][0] if can_merge else ""
          tasks=[]
          flags=[]
          if can_merge:
              for parts in parsed:
                  for part in parts[1:]:
                      if part.startswith("-"):
                          if part not in flags: flags.append(part)
                      elif re.fullmatch(r"[:A-Za-z0-9_.-]+",part):
                          if part not in tasks: tasks.append(part)
                      else:
                          can_merge=False
              if can_merge and lane in {"fast_runtime","static_only"} and confidence >= .85 and len(modules)==1:
                  module=modules[0]
                  scoped=[]
                  for task in tasks:
                      if task.startswith(":") or ":" in task:
                          scoped.append(task)
                      else:
                          scoped.append(f":{module}:{task}")
                  tasks=scoped
          print(json.dumps({
              "merge":can_merge,
              "executable":executable,
              "tasks":tasks,
              "flags":flags,
              "commands":commands,
          }))
          PY
          MERGE="$(python -c 'import json; print("true" if json.load(open("'"$RUNNER_TEMP/applab-gradle-plan.json"'"))["merge"] else "false")')"
          if [[ "$MERGE" == "true" ]]; then
            mapfile -t PARTS < <(python - <<'PY'
          import json, os
          p=json.load(open(os.environ["RUNNER_TEMP"]+"/applab-gradle-plan.json"))
          for item in [p["executable"],*p["tasks"],*p["flags"]]: print(item)
          PY
            )
            "${PARTS[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/applab-report/android-quality-build.txt"
          else
            : > "$GITHUB_WORKSPACE/applab-report/android-quality-build.txt"
            if [[ -n "$TEST_COMMAND" ]]; then
              bash -Eeuo pipefail -c "$TEST_COMMAND" 2>&1 | tee -a "$GITHUB_WORKSPACE/applab-report/android-quality-build.txt"
            fi
            if [[ -n "$LINT_COMMAND" ]]; then
              bash -Eeuo pipefail -c "$LINT_COMMAND" 2>&1 | tee -a "$GITHUB_WORKSPACE/applab-report/android-quality-build.txt"
            fi
            if [[ "$RUNTIME_REQUIRED" == "true" ]]; then
              bash -Eeuo pipefail -c "$BUILD_COMMAND" 2>&1 | tee -a "$GITHUB_WORKSPACE/applab-report/android-quality-build.txt"
            fi
          fi

      - name: Resolve APK
        if: steps.impact.outputs.runtime_required == 'true'
        id: apk
        shell: bash
        run: |
          APK_FILE="$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}/${{ inputs.apk_path }}"
          if [[ ! -s "$APK_FILE" ]]; then
            echo "Expected APK not found or empty: $APK_FILE" >&2
            exit 1
          fi
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          {
            ls -lh "$APK_FILE"
            sha256sum "$APK_FILE"
          } | tee "$GITHUB_WORKSPACE/applab-report/apk.txt"

      - name: Verify APK signature
        if: steps.impact.outputs.runtime_required == 'true' && inputs.verify_signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/${{ inputs.build_tools }}/apksigner" \
            verify --verbose "${{ steps.apk.outputs.apk_file }}" |
            tee "$GITHUB_WORKSPACE/applab-report/apksigner.txt"


      - name: Restore trusted AppLab contract packager
        if: steps.impact.outputs.runtime_required == 'true'
        shell: bash
        env:
          APPLAB_TRUSTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          git -C "$GITHUB_WORKSPACE/.applab" reset --hard "$APPLAB_TRUSTED_SHA"
          git -C "$GITHUB_WORKSPACE/.applab" clean -ffd
          test "$(git -C "$GITHUB_WORKSPACE/.applab" rev-parse HEAD)" = "$APPLAB_TRUSTED_SHA"

      - name: Package isolated APK contract
        if: steps.impact.outputs.runtime_required == 'true'
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          ARTIFACT_NAME="applab-build-${{ inputs.history_key }}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          python .applab/scripts/package_build_contract.py \
            --repo-root "$GITHUB_WORKSPACE/target" \
            --apk "${{ steps.apk.outputs.apk_file }}" \
            --output "$GITHUB_WORKSPACE/applab-build-contract" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ steps.target.outputs.resolved_sha }}" \
            --engine "native_android" \
            --working-directory "${{ inputs.working_directory }}" \
            --package-id "${{ inputs.package_id }}" \
            --maestro-flow "${{ inputs.maestro_flow }}" \
            --analysis-mode "${{ inputs.analysis_mode }}" \
            --baseline-sha "${{ inputs.baseline_sha }}" \
            --build-command "${{ inputs.build_command }}" \
            --analyze-status "N/A" \
            --lint-status "${{ inputs.lint_command != '' && 'PASS' || 'NOT_RUN' }}" \
            --test-status "${{ inputs.test_command != '' && 'PASS' || 'NOT_RUN' }}" \
            --build-status "PASS"

      - name: Upload isolated APK contract
        if: steps.impact.outputs.runtime_required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.contract.outputs.artifact_name }}
          path: applab-build-contract/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          include-hidden-files: true

      - name: Finalize adaptive non-runtime result
        if: steps.impact.outputs.runtime_required != 'true'
        shell: bash
        run: |
          python .applab/scripts/non_runtime_result.py \
            --plan "$GITHUB_WORKSPACE/applab-report/analysis-plan.json" \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --repository "${{ inputs.repository }}" \
            --ref "${{ inputs.ref }}" \
            --resolved-sha "${{ steps.target.outputs.resolved_sha }}" \
            --history-key "${{ inputs.history_key }}" \
            --engine native_android \
            --run-id "$GITHUB_RUN_ID" \
            --static-status PASS

      - name: Upload adaptive non-runtime result
        if: steps.impact.outputs.runtime_required != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: applab-${{ inputs.history_key }}-${{ github.run_id }}
          path: applab-report/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare adaptive non-runtime cache
        if: steps.impact.outputs.runtime_required != 'true' && inputs.cache_verification
        run: |
          rm -rf "$GITHUB_WORKSPACE/.applab-watch-cache"
          mkdir -p "$GITHUB_WORKSPACE/.applab-watch-cache"
          cp "$GITHUB_WORKSPACE/applab-report/result.json" "$GITHUB_WORKSPACE/.applab-watch-cache/result.json"
          cp "$GITHUB_WORKSPACE/applab-report/summary.md" "$GITHUB_WORKSPACE/.applab-watch-cache/summary.md"

      - name: Cache adaptive non-runtime result
        if: steps.impact.outputs.runtime_required != 'true' && inputs.cache_verification
        uses: actions/cache/save@v6
        with:
          path: .applab-watch-cache
          key: applab-c${{ inputs.contract_fingerprint }}-p${{ inputs.config_fingerprint }}-${{ inputs.history_key }}-${{ steps.target.outputs.resolved_sha }}

      - name: Upload build-phase evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: applab-build-evidence-${{ inputs.history_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: Trusted verify ${{ inputs.repository }}
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.runtime_required == 'true'
    uses: ./.github/workflows/trusted-apk-verifier.yml
    with:
      build_artifact_name: ${{ needs.build.outputs.artifact_name }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      resolved_sha: ${{ needs.build.outputs.resolved_sha }}
      engine: "native_android"
      history_key: ${{ inputs.history_key }}
      cache_verification: ${{ inputs.cache_verification }}
      contract_fingerprint: ${{ inputs.contract_fingerprint }}
      config_fingerprint: ${{ inputs.config_fingerprint }}
      approve_visual_baseline: ${{ inputs.approve_visual_baseline }}
      analysis_mode: ${{ needs.build.outputs.effective_mode }}
      publish_release_artifact: ${{ inputs.publish_release_artifact }}
      run_maestro: ${{ inputs.run_maestro }}
      android_prepare_command: ${{ inputs.android_prepare_command }}
      api_level: ${{ inputs.api_level }}
      emulator_profile: ${{ inputs.emulator_profile }}

  report_build_failure:
    name: Report build failure
    needs: build
    if: always() && needs.build.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted AppLab
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Finalize failed build result
        shell: bash
        env:
          RESOLVED_SHA: ${{ needs.build.outputs.resolved_sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/applab-report"
          SHA="$RESOLVED_SHA"
          [[ -n "$SHA" ]] || SHA="${{ inputs.ref }}"
          python .applab/scripts/finalize_external_result.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --repository "${{ inputs.repository }}" \
            --ref "${{ inputs.ref }}" \
            --resolved-sha "$SHA" \
            --history-key "${{ inputs.history_key }}" \
            --engine "native_android" \
            --pipeline-status failure \
            --run-id "$GITHUB_RUN_ID" \
            --analysis-mode "${{ inputs.analysis_mode }}"

      - name: Prepare failed verification cache payload
        if: inputs.cache_verification && needs.build.outputs.resolved_sha != ''
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.applab-watch-cache"
          cp "$GITHUB_WORKSPACE/applab-report/result.json" "$GITHUB_WORKSPACE/.applab-watch-cache/result.json"
          cp "$GITHUB_WORKSPACE/applab-report/summary.md" "$GITHUB_WORKSPACE/.applab-watch-cache/summary.md"

      - name: Cache failed resolved commit
        if: inputs.cache_verification && needs.build.outputs.resolved_sha != ''
        uses: actions/cache/save@v6
        with:
          path: .applab-watch-cache
          key: applab-c${{ inputs.contract_fingerprint }}-p${{ inputs.config_fingerprint }}-${{ inputs.history_key }}-${{ needs.build.outputs.resolved_sha }}

      - name: Upload failed build result
        uses: actions/upload-artifact@v7
        with:
          name: applab-${{ inputs.history_key }}-${{ github.run_id }}
          path: applab-report/
          if-no-files-found: error
          retention-days: 14
