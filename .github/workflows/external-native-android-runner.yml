name: External Native Android Project Runner

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository in owner/name format
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA to verify
        required: false
        default: main
        type: string
      working_directory:
        description: Gradle project directory inside the target repository
        required: false
        default: "."
        type: string
      java_version:
        description: Java version used by the Android project
        required: false
        default: "17"
        type: string
      gradle_version:
        description: Gradle version used when the repository has no wrapper
        required: false
        default: "8.14.3"
        type: string
      compile_sdk:
        description: Android platform installed before the build
        required: false
        default: "35"
        type: string
      build_tools:
        description: Android build-tools version installed before the build
        required: false
        default: "35.0.0"
        type: string
      prepare_command:
        description: Optional project-specific preparation command
        required: false
        default: ""
        type: string
      test_command:
        description: Optional JVM/unit-test command
        required: false
        default: ""
        type: string
      lint_command:
        description: Optional Android lint/static-analysis command
        required: false
        default: ""
        type: string
      build_command:
        description: Command that produces the APK
        required: true
        type: string
      apk_path:
        description: APK path relative to working_directory
        required: true
        type: string
      package_id:
        description: Optional Android application id; empty enables automatic detection
        required: false
        default: ""
        type: string
      verify_signature:
        description: Verify the produced APK with apksigner
        required: false
        default: true
        type: boolean
      android_prepare_command:
        description: Optional command run with ADB available before AppLab verification
        required: false
        default: ""
        type: string
      api_level:
        description: Android emulator API level
        required: false
        default: "35"
        type: string
      emulator_profile:
        description: Android emulator hardware profile
        required: false
        default: pixel_7_pro
        type: string
      run_maestro:
        description: Run Maestro after launch
        required: false
        default: true
        type: boolean
      maestro_flow:
        description: Optional Maestro flow path relative to target repository root
        required: false
        default: ""
        type: string
      history_key:
        description: Stable identifier used by AppLab Watcher history and caches
        required: false
        default: external-native
        type: string
      cache_verification:
        description: Save this resolved commit as already verified by AppLab Watcher
        required: false
        default: false
        type: boolean
      cache_epoch:
        description: Watcher cache epoch
        required: false
        default: "1"
        type: string
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      ref:
        required: false
        default: main
        type: string
      working_directory:
        required: false
        default: "."
        type: string
      java_version:
        required: false
        default: "17"
        type: string
      gradle_version:
        required: false
        default: "8.14.3"
        type: string
      compile_sdk:
        required: false
        default: "35"
        type: string
      build_tools:
        required: false
        default: "35.0.0"
        type: string
      prepare_command:
        required: false
        default: ""
        type: string
      test_command:
        required: false
        default: ""
        type: string
      lint_command:
        required: false
        default: ""
        type: string
      build_command:
        required: true
        type: string
      apk_path:
        required: true
        type: string
      package_id:
        required: false
        default: ""
        type: string
      verify_signature:
        required: false
        default: true
        type: boolean
      android_prepare_command:
        required: false
        default: ""
        type: string
      api_level:
        required: false
        default: "35"
        type: string
      emulator_profile:
        required: false
        default: pixel_7_pro
        type: string
      run_maestro:
        required: false
        default: true
        type: boolean
      maestro_flow:
        required: false
        default: ""
        type: string
      history_key:
        required: false
        default: external-native
        type: string
      cache_verification:
        required: false
        default: false
        type: boolean
      cache_epoch:
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: applab-native-${{ inputs.repository }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ inputs.repository }}@${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Validate target coordinates
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_REF: ${{ inputs.ref }}
          TARGET_WORKDIR: ${{ inputs.working_directory }}
          TARGET_APK_PATH: ${{ inputs.apk_path }}
          TARGET_MAESTRO_FLOW: ${{ inputs.maestro_flow }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath

          repo = os.environ["TARGET_REPOSITORY"].strip()
          ref = os.environ["TARGET_REF"].strip()
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise SystemExit(f"Invalid repository: {repo!r}")
          if not ref or any(ch in ref for ch in "\r\n"):
              raise SystemExit("Invalid ref")

          for key in ("TARGET_WORKDIR", "TARGET_APK_PATH", "TARGET_MAESTRO_FLOW"):
              raw = os.environ.get(key, "").strip()
              if not raw:
                  continue
              path = PurePosixPath(raw)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(
                      f"{key} must be a safe repository-relative path: {raw!r}"
                  )
          PY

      - name: Checkout AppLab
        uses: actions/checkout@v6
        with:
          repository: riccardopinato/AppLab
          path: .applab

      - name: Checkout target project
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: target
          persist-credentials: false

      - name: Prepare evidence directory
        id: target
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/applab-report"
          RESOLVED_SHA="$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)"
          echo "resolved_sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "engine=native_android"
            echo "repository=${{ inputs.repository }}"
            echo "ref=${{ inputs.ref }}"
            echo "resolved_sha=$RESOLVED_SHA"
            echo "working_directory=${{ inputs.working_directory }}"
            echo "apk_path=${{ inputs.apk_path }}"
          } | tee "$GITHUB_WORKSPACE/applab-report/project.txt"

      - name: Validate Android project
        shell: bash
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}"
          test -d "$PROJECT_DIR"
          if [[ ! -f "$PROJECT_DIR/settings.gradle" &&
                ! -f "$PROJECT_DIR/settings.gradle.kts" &&
                ! -f "$PROJECT_DIR/build.gradle" &&
                ! -f "$PROJECT_DIR/build.gradle.kts" ]]; then
            echo "No Gradle Android project found in $PROJECT_DIR" >&2
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Install Android SDK components
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found on GitHub runner." >&2
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${{ inputs.compile_sdk }}" \
            "build-tools;${{ inputs.build_tools }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Target preparation
        if: inputs.prepare_command != ''
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        env:
          APPLAB_PREPARE_COMMAND: ${{ inputs.prepare_command }}
        run: bash -Eeuo pipefail -c "$APPLAB_PREPARE_COMMAND"

      - name: Unit tests
        if: inputs.test_command != ''
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        env:
          APPLAB_TEST_COMMAND: ${{ inputs.test_command }}
        run: |
          set -o pipefail
          bash -Eeuo pipefail -c "$APPLAB_TEST_COMMAND" 2>&1 |
            tee "$GITHUB_WORKSPACE/applab-report/android-test.txt"

      - name: Android lint
        if: inputs.lint_command != ''
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        env:
          APPLAB_LINT_COMMAND: ${{ inputs.lint_command }}
        run: |
          set -o pipefail
          bash -Eeuo pipefail -c "$APPLAB_LINT_COMMAND" 2>&1 |
            tee "$GITHUB_WORKSPACE/applab-report/android-lint.txt"

      - name: Build APK
        working-directory: target/${{ inputs.working_directory }}
        shell: bash
        env:
          APPLAB_BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -o pipefail
          bash -Eeuo pipefail -c "$APPLAB_BUILD_COMMAND" 2>&1 |
            tee "$GITHUB_WORKSPACE/applab-report/android-build.txt"

      - name: Resolve APK
        id: apk
        shell: bash
        run: |
          APK_FILE="$GITHUB_WORKSPACE/target/${{ inputs.working_directory }}/${{ inputs.apk_path }}"
          if [[ ! -s "$APK_FILE" ]]; then
            echo "Expected APK not found or empty: $APK_FILE" >&2
            exit 1
          fi
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          {
            ls -lh "$APK_FILE"
            sha256sum "$APK_FILE"
          } | tee "$GITHUB_WORKSPACE/applab-report/apk.txt"

      - name: Verify APK signature
        if: inputs.verify_signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/${{ inputs.build_tools }}/apksigner" \
            verify --verbose "${{ steps.apk.outputs.apk_file }}" |
            tee "$GITHUB_WORKSPACE/applab-report/apksigner.txt"

      - name: Install Maestro
        if: inputs.run_maestro
        run: |
          chmod +x .applab/scripts/install_maestro.sh
          .applab/scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore previous passing visual baseline
        id: visual_baseline
        uses: actions/cache/restore@v4
        with:
          path: .applab-visual-baseline
          key: applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-${{ steps.target.outputs.resolved_sha }}
          restore-keys: |
            applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-

      - name: Verify APK on Android
        id: verify
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APPLAB_APK_FILE: ${{ steps.apk.outputs.apk_file }}
          APPLAB_RUN_MAESTRO: ${{ inputs.run_maestro }}
          APPLAB_MAESTRO_FLOW: ${{ inputs.maestro_flow }}
          APPLAB_ANDROID_PREPARE_COMMAND: ${{ inputs.android_prepare_command }}
          APPLAB_PACKAGE_ID: ${{ inputs.package_id }}
          APPLAB_TARGET_ROOT: ${{ github.workspace }}/target
          APPLAB_REPORT_DIR: ${{ github.workspace }}/applab-report
          APPLAB_VISUAL_BASELINE_DIR: ${{ github.workspace }}/.applab-visual-baseline
          APPLAB_VERSION: "0.6.2"
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.emulator_profile }}
          disable-animations: true
          script: bash .applab/scripts/run_external_android_gate.sh

      - name: Prepare passing visual baseline
        if: steps.verify.outcome == 'success'
        shell: bash
        env:
          APPLAB_BASELINE_REPOSITORY: ${{ inputs.repository }}
          APPLAB_BASELINE_SHA: ${{ steps.target.outputs.resolved_sha }}
        run: |
          set -Eeuo pipefail
          BASELINE_DIR="$GITHUB_WORKSPACE/.applab-visual-baseline"
          REPORT_DIR="$GITHUB_WORKSPACE/applab-report"
          rm -rf "$BASELINE_DIR"
          mkdir -p "$BASELINE_DIR"

          if [[ -s "$REPORT_DIR/post-maestro.png" && -s "$REPORT_DIR/post-maestro-window.xml" ]]; then
            cp "$REPORT_DIR/post-maestro.png" "$BASELINE_DIR/screenshot.png"
            cp "$REPORT_DIR/post-maestro-window.xml" "$BASELINE_DIR/window.xml"
            SOURCE_STAGE="post-maestro"
          else
            cp "$REPORT_DIR/launch.png" "$BASELINE_DIR/screenshot.png"
            cp "$REPORT_DIR/launch-window.xml" "$BASELINE_DIR/window.xml"
            SOURCE_STAGE="launch"
          fi

          if [[ -d "$REPORT_DIR/visual-journey/current" ]]; then
            mkdir -p "$BASELINE_DIR/journey"
            cp -a "$REPORT_DIR/visual-journey/current/." "$BASELINE_DIR/journey/"
          fi

          APPLAB_BASELINE_STAGE="$SOURCE_STAGE" python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "applab_version": "0.6.2",
              "repository": os.environ["APPLAB_BASELINE_REPOSITORY"],
              "resolved_sha": os.environ["APPLAB_BASELINE_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "source_stage": os.environ["APPLAB_BASELINE_STAGE"],
              "created_at": datetime.now(timezone.utc).isoformat(),
          }
          metadata_path = Path(".applab-visual-baseline/metadata.json")
          metadata_path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          journey_root = Path(".applab-visual-baseline/journey")
          if journey_root.is_dir():
              for checkpoint in journey_root.iterdir():
                  if checkpoint.is_dir():
                      (checkpoint / "metadata.json").write_text(
                          json.dumps(payload, indent=2, sort_keys=True) + "\n",
                          encoding="utf-8",
                      )
          PY

      - name: Save passing visual baseline
        if: steps.verify.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .applab-visual-baseline
          key: applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-${{ steps.target.outputs.resolved_sha }}-${{ github.run_id }}

      - name: Finalize external result contract
        if: always()
        env:
          APPLAB_PIPELINE_STATUS: ${{ job.status }}
          APPLAB_RESOLVED_SHA: ${{ steps.target.outputs.resolved_sha }}
        run: |
          python .applab/scripts/finalize_external_result.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --repository "${{ inputs.repository }}" \
            --ref "${{ inputs.ref }}" \
            --resolved-sha "$APPLAB_RESOLVED_SHA" \
            --history-key "${{ inputs.history_key }}" \
            --engine native_android \
            --pipeline-status "$APPLAB_PIPELINE_STATUS" \
            --run-id "$GITHUB_RUN_ID"

      - name: Prepare verification cache payload
        if: always() && inputs.cache_verification && steps.target.outputs.resolved_sha != ''
        run: |
          rm -rf "$GITHUB_WORKSPACE/.applab-watch-cache"
          mkdir -p "$GITHUB_WORKSPACE/.applab-watch-cache"
          cp "$GITHUB_WORKSPACE/applab-report/result.json" \
            "$GITHUB_WORKSPACE/.applab-watch-cache/result.json"
          cp "$GITHUB_WORKSPACE/applab-report/summary.md" \
            "$GITHUB_WORKSPACE/.applab-watch-cache/summary.md"

      - name: Mark resolved commit as checked
        if: always() && inputs.cache_verification && steps.target.outputs.resolved_sha != ''
        uses: actions/cache/save@v4
        with:
          path: .applab-watch-cache
          key: applab-v0.5-e${{ inputs.cache_epoch }}-${{ inputs.history_key }}-${{ steps.target.outputs.resolved_sha }}

      - name: Publish AppLab summary
        if: always()
        shell: bash
        env:
          APPLAB_TARGET_REPOSITORY: ${{ inputs.repository }}
          APPLAB_TARGET_REF: ${{ inputs.ref }}
          APPLAB_TARGET_WORKDIR: ${{ inputs.working_directory }}
          APPLAB_VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "## AppLab Native Android Project Runner"
            echo
            printf -- '- Target: `%s@%s`\n' "$APPLAB_TARGET_REPOSITORY" "$APPLAB_TARGET_REF"
            printf -- '- Working directory: `%s`\n' "$APPLAB_TARGET_WORKDIR"
            printf -- '- Android verification: `%s`\n' "$APPLAB_VERIFY_OUTCOME"
            echo
            if [[ -f "$GITHUB_WORKSPACE/applab-report/summary.md" ]]; then
              cat "$GITHUB_WORKSPACE/applab-report/summary.md"
            else
              echo "No Android runtime report was produced."
              echo "Inspect test, lint, build, signature, or APK-resolution steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AppLab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applab-${{ inputs.history_key }}-${{ github.run_id }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 14
