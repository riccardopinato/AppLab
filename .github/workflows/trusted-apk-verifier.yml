name: Trusted APK Verifier

on:
  workflow_call:
    inputs:
      build_artifact_name:
        required: true
        type: string
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string
      resolved_sha:
        required: true
        type: string
      engine:
        required: true
        type: string
      history_key:
        required: true
        type: string
      cache_verification:
        required: false
        default: false
        type: boolean
      contract_fingerprint:
        required: false
        default: "manual"
        type: string
      config_fingerprint:
        required: false
        default: "manual"
        type: string
      run_maestro:
        required: false
        default: true
        type: boolean
      android_prepare_command:
        required: false
        default: ""
        type: string
      api_level:
        required: false
        default: "35"
        type: string
      emulator_profile:
        required: false
        default: pixel_7_pro
        type: string
      start_timeout:
        required: false
        default: "30"
        type: string
      settle_seconds:
        required: false
        default: "5"
        type: string
      approve_visual_baseline:
        required: false
        default: false
        type: boolean
      analysis_mode:
        required: false
        default: full
        type: string
      publish_release_artifact:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Trusted verify ${{ inputs.repository }}@${{ inputs.resolved_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout trusted AppLab
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Prepare trusted report directory
        run: mkdir -p "$GITHUB_WORKSPACE/applab-report"

      - name: Download untrusted build contract
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.build_artifact_name }}
          path: .applab-build

      - name: Validate build contract
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/validate_build_contract.py \
            --root "$GITHUB_WORKSPACE/.applab-build" \
            --expected-repository "${{ inputs.repository }}" \
            --expected-sha "${{ inputs.resolved_sha }}" \
            --expected-engine "${{ inputs.engine }}" \
            --expected-analysis-mode "${{ inputs.analysis_mode }}" \
            --github-output "$GITHUB_OUTPUT"
          cp "$GITHUB_WORKSPACE/.applab-build/contract.json" \
             "$GITHUB_WORKSPACE/applab-report/build-contract.json"
          cp "$GITHUB_WORKSPACE/.applab-build/analysis-plan.json" \
             "$GITHUB_WORKSPACE/applab-report/analysis-plan.json"
          if [[ -s "$GITHUB_WORKSPACE/.applab-build/shadow-full-plan.json" ]]; then
            cp "$GITHUB_WORKSPACE/.applab-build/shadow-full-plan.json" \
               "$GITHUB_WORKSPACE/applab-report/shadow-full-plan.json"
          fi
          if [[ -s "$GITHUB_WORKSPACE/.applab-build/build-timings.json" ]]; then
            cp "$GITHUB_WORKSPACE/.applab-build/build-timings.json" \
               "$GITHUB_WORKSPACE/applab-report/timings.json"
          fi

      - name: Restore Maestro cache
        if: inputs.run_maestro
        id: maestro_cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.maestro
          key: applab-maestro-${{ runner.os }}-2.10.0-v1

      - name: Install Maestro
        if: inputs.run_maestro
        run: |
          chmod +x .applab/scripts/install_maestro.sh
          .applab/scripts/install_maestro.sh

      - name: Save Maestro cache
        if: inputs.run_maestro && steps.maestro_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.maestro
          key: applab-maestro-${{ runner.os }}-2.10.0-v1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore clean AVD snapshot cache
        id: avd_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: applab-avd-v1-api${{ inputs.api_level }}-google_apis-x86_64-${{ inputs.emulator_profile }}

      - name: Create clean AVD snapshot
        if: steps.avd_cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.emulator_profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated clean AppLab AVD snapshot."

      - name: Save clean AVD snapshot cache
        if: steps.avd_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: applab-avd-v1-api${{ inputs.api_level }}-google_apis-x86_64-${{ inputs.emulator_profile }}

      - name: Restore previous passing visual baseline
        id: visual_baseline
        uses: actions/cache/restore@v6
        with:
          path: .applab-visual-baseline
          key: applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}
          restore-keys: |
            applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-

      - name: Restore previous passing performance baseline
        id: performance_baseline
        uses: actions/cache/restore@v6
        with:
          path: .applab-performance-baseline
          key: applab-performance-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}
          restore-keys: |
            applab-performance-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-

      - name: Restore previous passing upgrade baseline
        id: upgrade_baseline
        uses: actions/cache/restore@v6
        with:
          path: .applab-upgrade-baseline
          key: applab-upgrade-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}
          restore-keys: |
            applab-upgrade-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-

      - name: Resolve effective analysis mode
        id: analysis
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.analysis_mode }}
        run: |
          set -Eeuo pipefail
          MODE="$REQUESTED_MODE"
          if [[ "$MODE" != "fast" && "$MODE" != "full" && "$MODE" != "certification" ]]; then
            echo "Unsupported analysis mode: $MODE" >&2
            exit 2
          fi
          if [[ "$MODE" == "fast" ]]; then
            if [[ ! -s "$GITHUB_WORKSPACE/.applab-upgrade-baseline/baseline.apk" || -z "$(find "$GITHUB_WORKSPACE/.applab-visual-baseline" -type f -print -quit 2>/dev/null)" ]]; then
              MODE="full"
              echo "FAST requested but no previous full baseline is available; falling back to FULL."
            fi
          fi
          echo "effective_mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Start trusted runtime timer
        id: runtime_clock
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Verify APK inside trusted Android runtime
        id: verify
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APPLAB_APK_FILE: ${{ steps.contract.outputs.apk_file }}
          APPLAB_RUN_MAESTRO: ${{ inputs.run_maestro }}
          APPLAB_MAESTRO_FLOW: ${{ steps.contract.outputs.maestro_flow }}
          APPLAB_ANDROID_PREPARE_COMMAND: ${{ inputs.android_prepare_command }}
          APPLAB_PACKAGE_ID: ${{ steps.contract.outputs.package_id }}
          APPLAB_TARGET_ROOT: ${{ steps.contract.outputs.target_root }}
          APPLAB_PROJECT_ROOT: ${{ steps.contract.outputs.project_root }}
          APPLAB_TRUSTED_ROOT: ${{ github.workspace }}/.applab
          APPLAB_TRUSTED_SHA: ${{ job.workflow_sha }}
          APPLAB_REPORT_DIR: ${{ github.workspace }}/applab-report
          APPLAB_VISUAL_BASELINE_DIR: ${{ github.workspace }}/.applab-visual-baseline
          APPLAB_PERFORMANCE_BASELINE_JSON: ${{ github.workspace }}/.applab-performance-baseline/performance-lab.json
          APPLAB_UPGRADE_BASELINE_APK: ${{ github.workspace }}/.applab-upgrade-baseline/baseline.apk
          APPLAB_VERSION: "0.9.0"
          APPLAB_ANALYSIS_MODE: ${{ steps.analysis.outputs.effective_mode }}
          APPLAB_ANALYSIS_PLAN_JSON: ${{ steps.contract.outputs.analysis_plan_file }}
          START_TIMEOUT: ${{ inputs.start_timeout }}
          SETTLE_SECONDS: ${{ inputs.settle_seconds }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.emulator_profile }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .applab/scripts/run_external_android_gate.sh

      - name: Record trusted runtime timing
        if: always()
        shell: bash
        env:
          STARTED: ${{ steps.runtime_clock.outputs.started }}
        run: |
          python - "$GITHUB_WORKSPACE/applab-report/timings.json" "$STARTED" "$(date +%s)" "$GITHUB_WORKSPACE/applab-report/result.json" <<'PY'
          import json,os,sys
          path,start,end,result=sys.argv[1],int(sys.argv[2] or 0),int(sys.argv[3]),sys.argv[4]
          data={}
          if os.path.isfile(path):
              try: data=json.load(open(path))
              except Exception: data={}
          runtime=0.0
          if os.path.isfile(result):
              try: runtime=float(json.load(open(result)).get("runtime_seconds",0) or 0)
              except Exception: runtime=0.0
          verifier=max(0,end-start) if start else 0
          data["runtime_seconds"]=runtime
          data["verifier_seconds"]=verifier
          data["emulator_seconds"]=max(0.0,verifier-runtime)
          json.dump(data,open(path,"w"),indent=2,sort_keys=True)
          PY

      - name: Shadow FULL calibration
        id: shadow_full
        if: steps.contract.outputs.shadow_full == 'true' && steps.analysis.outputs.effective_mode == 'fast' && steps.verify.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APPLAB_APK_FILE: ${{ steps.contract.outputs.apk_file }}
          APPLAB_RUN_MAESTRO: ${{ inputs.run_maestro }}
          APPLAB_MAESTRO_FLOW: ${{ steps.contract.outputs.maestro_flow }}
          APPLAB_ANDROID_PREPARE_COMMAND: ${{ inputs.android_prepare_command }}
          APPLAB_PACKAGE_ID: ${{ steps.contract.outputs.package_id }}
          APPLAB_TARGET_ROOT: ${{ steps.contract.outputs.target_root }}
          APPLAB_PROJECT_ROOT: ${{ steps.contract.outputs.project_root }}
          APPLAB_TRUSTED_ROOT: ${{ github.workspace }}/.applab
          APPLAB_TRUSTED_SHA: ${{ job.workflow_sha }}
          APPLAB_REPORT_DIR: ${{ github.workspace }}/applab-shadow-full
          APPLAB_VISUAL_BASELINE_DIR: ${{ github.workspace }}/.applab-visual-baseline
          APPLAB_PERFORMANCE_BASELINE_JSON: ${{ github.workspace }}/.applab-performance-baseline/performance-lab.json
          APPLAB_UPGRADE_BASELINE_APK: ${{ github.workspace }}/.applab-upgrade-baseline/baseline.apk
          APPLAB_VERSION: "0.9.0"
          APPLAB_ANALYSIS_MODE: full
          APPLAB_ANALYSIS_PLAN_JSON: ${{ steps.contract.outputs.shadow_plan_file }}
          START_TIMEOUT: ${{ inputs.start_timeout }}
          SETTLE_SECONDS: ${{ inputs.settle_seconds }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.emulator_profile }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .applab/scripts/run_external_android_gate.sh

      - name: Compare FAST with shadow FULL
        id: shadow_compare
        if: always() && steps.contract.outputs.shadow_full == 'true' && steps.analysis.outputs.effective_mode == 'fast' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/applab-report/shadow-full"
          if [[ -d "$GITHUB_WORKSPACE/applab-shadow-full" ]]; then
            cp -a "$GITHUB_WORKSPACE/applab-shadow-full/." "$GITHUB_WORKSPACE/applab-report/shadow-full/"
          fi
          python .applab/scripts/shadow_calibration.py \
            --plan "$GITHUB_WORKSPACE/applab-report/analysis-plan.json" \
            --fast-result "$GITHUB_WORKSPACE/applab-report/result.json" \
            --full-result "$GITHUB_WORKSPACE/applab-shadow-full/result.json" \
            --output "$GITHUB_WORKSPACE/applab-report/shadow-calibration.json" \
            --apply-to "$GITHUB_WORKSPACE/applab-report/result.json"

      - name: Evaluate production certification
        id: certification
        if: always() && steps.analysis.outputs.effective_mode == 'certification'
        shell: bash
        run: |
          python .applab/scripts/certification_gate.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --contract-root "$GITHUB_WORKSPACE/.applab-build" \
            --api-level "${{ inputs.api_level }}" \
            --emulator-profile "${{ inputs.emulator_profile }}" \
            --target "google_apis" \
            --arch "x86_64"

      - name: Prepare PASS-only visual baseline
        id: baseline
        if: steps.verify.outcome == 'success' && steps.shadow_compare.outcome != 'failure' && (steps.analysis.outputs.effective_mode == 'full' || steps.certification.outputs.status == 'CERTIFIED')
        shell: bash
        env:
          APPROVE_VISUAL_BASELINE: ${{ inputs.approve_visual_baseline }}
        run: |
          EXTRA_ARGS=()
          if [[ "$APPROVE_VISUAL_BASELINE" == "true" ]]; then
            EXTRA_ARGS+=(--approve-current)
          fi
          python .applab/scripts/prepare_visual_baseline.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --baseline-dir "$GITHUB_WORKSPACE/.applab-visual-baseline" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --version "0.9.0" \
            --github-output "$GITHUB_OUTPUT" \
            "${EXTRA_ARGS[@]}"

      - name: Save PASS-only visual baseline
        if: steps.baseline.outputs.promote == 'true'
        uses: actions/cache/save@v6
        with:
          path: .applab-visual-baseline
          key: applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}-${{ github.run_id }}

      - name: Prepare PASS-only performance baseline
        id: performance_baseline_prepare
        if: steps.verify.outcome == 'success' && steps.shadow_compare.outcome != 'failure' && (steps.analysis.outputs.effective_mode == 'full' || steps.certification.outputs.status == 'CERTIFIED')
        shell: bash
        run: |
          python .applab/scripts/prepare_performance_baseline.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --baseline-dir "$GITHUB_WORKSPACE/.applab-performance-baseline" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --version "0.9.0" \
            --github-output "$GITHUB_OUTPUT"

      - name: Save PASS-only performance baseline
        if: steps.performance_baseline_prepare.outputs.promote == 'true' && (steps.analysis.outputs.effective_mode == 'full' || steps.certification.outputs.status == 'CERTIFIED')
        uses: actions/cache/save@v6
        with:
          path: .applab-performance-baseline
          key: applab-performance-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}-${{ github.run_id }}

      - name: Prepare PASS-only upgrade baseline
        id: upgrade_baseline_prepare
        if: steps.verify.outcome == 'success' && steps.shadow_compare.outcome != 'failure' && (steps.analysis.outputs.effective_mode == 'full' || steps.certification.outputs.status == 'CERTIFIED')
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/.applab-upgrade-baseline"
          python .applab/scripts/prepare_upgrade_baseline.py \
            --source-apk "${{ steps.contract.outputs.apk_file }}" \
            --baseline-dir "$GITHUB_WORKSPACE/.applab-upgrade-baseline" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --version "0.9.0"

      - name: Save PASS-only upgrade baseline
        if: steps.verify.outcome == 'success' && steps.shadow_compare.outcome != 'failure' && (steps.analysis.outputs.effective_mode == 'full' || steps.certification.outputs.status == 'CERTIFIED')
        uses: actions/cache/save@v6
        with:
          path: .applab-upgrade-baseline
          key: applab-upgrade-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}-${{ github.run_id }}

      - name: Prepare PASS-only installable release
        id: release
        if: steps.certification.outputs.status == 'CERTIFIED' && inputs.publish_release_artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .applab/scripts/release_artifact.py prepare \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --contract-root "$GITHUB_WORKSPACE/.applab-build" \
            --output-dir "$GITHUB_WORKSPACE/applab-release" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --history-key "${{ inputs.history_key }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload verified installable APK
        id: release_upload
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: applab-release/
          if-no-files-found: error
          retention-days: 90

      - name: Bind verified APK download metadata
        if: steps.release.outputs.publish == 'true'
        run: |
          python .applab/scripts/release_artifact.py bind \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --artifact-id "${{ steps.release_upload.outputs.artifact-id }}" \
            --artifact-url "${{ steps.release_upload.outputs.artifact-url }}"

      - name: Record cache telemetry
        if: always()
        shell: bash
        env:
          MAESTRO_CACHE_HIT: ${{ steps.maestro_cache.outputs.cache-hit }}
          AVD_CACHE_HIT: ${{ steps.avd_cache.outputs.cache-hit }}
          VISUAL_CACHE_HIT: ${{ steps.visual_baseline.outputs.cache-hit }}
          PERFORMANCE_CACHE_HIT: ${{ steps.performance_baseline.outputs.cache-hit }}
          UPGRADE_CACHE_HIT: ${{ steps.upgrade_baseline.outputs.cache-hit }}
        run: |
          python - "$GITHUB_WORKSPACE/applab-report/cache.json" <<'PY'
          import json,os,sys
          def flag(name):
              return os.environ.get(name, "").strip().lower() == "true"
          json.dump(
              {
                  "maestro": flag("MAESTRO_CACHE_HIT"),
                  "avd": flag("AVD_CACHE_HIT"),
                  "visual_baseline": flag("VISUAL_CACHE_HIT"),
                  "performance_baseline": flag("PERFORMANCE_CACHE_HIT"),
                  "upgrade_baseline": flag("UPGRADE_CACHE_HIT"),
              },
              open(sys.argv[1], "w"),
              indent=2,
              sort_keys=True,
          )
          PY

      - name: Finalize trusted result contract
        if: always()
        env:
          APPLAB_PIPELINE_STATUS: ${{ job.status }}
        run: |
          python .applab/scripts/finalize_external_result.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --repository "${{ inputs.repository }}" \
            --ref "${{ inputs.ref }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --history-key "${{ inputs.history_key }}" \
            --engine "${{ inputs.engine }}" \
            --pipeline-status "$APPLAB_PIPELINE_STATUS" \
            --run-id "$GITHUB_RUN_ID" \
            --analysis-mode "${{ steps.analysis.outputs.effective_mode }}" \
            --config-fingerprint "${{ inputs.config_fingerprint }}"

      - name: Resolve selected-domain cache fingerprint
        id: verification_fp
        if: always()
        shell: bash
        run: |
          FP="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("applab-report/result.json")
          try: print(json.loads(p.read_text()).get("verification_contract_fingerprint",""))
          except Exception: print("")
          PY
          )"
          [[ -n "$FP" ]] || FP="${{ inputs.contract_fingerprint }}"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Prepare verification cache payload
        if: always() && inputs.cache_verification
        run: |
          rm -rf "$GITHUB_WORKSPACE/.applab-watch-cache"
          mkdir -p "$GITHUB_WORKSPACE/.applab-watch-cache"
          cp "$GITHUB_WORKSPACE/applab-report/result.json" \
             "$GITHUB_WORKSPACE/.applab-watch-cache/result.json"
          cp "$GITHUB_WORKSPACE/applab-report/summary.md" \
             "$GITHUB_WORKSPACE/.applab-watch-cache/summary.md"

      - name: Mark resolved commit as checked
        if: always() && inputs.cache_verification
        uses: actions/cache/save@v6
        with:
          path: .applab-watch-cache
          key: applab-c${{ steps.verification_fp.outputs.fingerprint }}-p${{ inputs.config_fingerprint }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}

      - name: Publish trusted verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AppLab v0.9.0 Trusted APK Verification"
            echo
            echo "- Target: \`${{ inputs.repository }}@${{ inputs.resolved_sha }}\`"
            echo "- Engine: \`${{ inputs.engine }}\`"
            echo "- Analysis: \`${{ steps.analysis.outputs.effective_mode }}\`"
            echo "- Build job repository checkout: **not present in this job**"
            echo
            if [[ -f "$GITHUB_WORKSPACE/applab-report/summary.md" ]]; then
              cat "$GITHUB_WORKSPACE/applab-report/summary.md"
              if [[ -f "$GITHUB_WORKSPACE/applab-report/certification.md" ]]; then
                echo
                cat "$GITHUB_WORKSPACE/applab-report/certification.md"
              fi
            else
              echo "Trusted verification ended before a runtime report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trusted AppLab evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: applab-${{ inputs.history_key }}-${{ github.run_id }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 14
