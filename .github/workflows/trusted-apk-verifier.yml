name: Trusted APK Verifier

on:
  workflow_call:
    inputs:
      build_artifact_name:
        required: true
        type: string
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string
      resolved_sha:
        required: true
        type: string
      engine:
        required: true
        type: string
      history_key:
        required: true
        type: string
      cache_verification:
        required: false
        default: false
        type: boolean
      contract_fingerprint:
        required: false
        default: "manual"
        type: string
      config_fingerprint:
        required: false
        default: "manual"
        type: string
      run_maestro:
        required: false
        default: true
        type: boolean
      android_prepare_command:
        required: false
        default: ""
        type: string
      api_level:
        required: false
        default: "35"
        type: string
      emulator_profile:
        required: false
        default: pixel_7_pro
        type: string
      start_timeout:
        required: false
        default: "30"
        type: string
      settle_seconds:
        required: false
        default: "5"
        type: string
      approve_visual_baseline:
        required: false
        default: false
        type: boolean
      analysis_mode:
        required: false
        default: full
        type: string
      publish_release_artifact:
        required: false
        default: true
        type: boolean
      physical_evidence_run_id:
        description: Optional trusted AppLab Physical Evidence Hub workflow run id
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  journey_plan:
    name: Plan journey sharding
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      mode: ${{ steps.plan.outputs.mode }}
      authoritative: ${{ steps.plan.outputs.authoritative }}
      matrix: ${{ steps.plan.outputs.matrix }}
      coordinator_journeys: ${{ steps.plan.outputs.coordinator_journeys }}
    steps:
      - name: Checkout trusted AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Download untrusted build contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.build_artifact_name }}
          path: .applab-build

      - name: Validate sharding input contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/validate_build_contract.py \
            --root "$GITHUB_WORKSPACE/.applab-build" \
            --expected-repository "${{ inputs.repository }}" \
            --expected-sha "${{ inputs.resolved_sha }}" \
            --expected-engine "${{ inputs.engine }}" \
            --expected-analysis-mode "${{ inputs.analysis_mode }}" \
            --expected-trusted-applab-sha "${{ job.workflow_sha }}"

      - name: Plan isolated journey shards
        id: plan
        shell: bash
        env:
          RUN_MAESTRO: ${{ inputs.run_maestro }}
        run: |
          set -Eeuo pipefail
          if [[ "$RUN_MAESTRO" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "mode=disabled" >> "$GITHUB_OUTPUT"
            echo "authoritative=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'coordinator_journeys=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python .applab/scripts/journey_sharding.py \
            --contract-root "$GITHUB_WORKSPACE/.applab-build" \
            --trusted-root "$GITHUB_WORKSPACE/.applab" \
            --repository "${{ inputs.repository }}" \
            --output "$GITHUB_WORKSPACE/journey-sharding-plan.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload journey sharding plan
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: journey-sharding-plan-${{ github.run_id }}
          path: journey-sharding-plan.json
          if-no-files-found: error
          retention-days: 1

  journey_shards:
    name: Journey shard ${{ matrix.id }}
    needs: journey_plan
    if: needs.journey_plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ needs.journey_plan.outputs.authoritative != 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.journey_plan.outputs.matrix) }}
    steps:
      - name: Checkout trusted AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Download build contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.build_artifact_name }}
          path: .applab-build

      - name: Validate shard build contract
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/validate_build_contract.py \
            --root "$GITHUB_WORKSPACE/.applab-build" \
            --expected-repository "${{ inputs.repository }}" \
            --expected-sha "${{ inputs.resolved_sha }}" \
            --expected-engine "${{ inputs.engine }}" \
            --expected-analysis-mode "${{ inputs.analysis_mode }}" \
            --expected-trusted-applab-sha "${{ job.workflow_sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      - name: Restore clean AVD snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.android/avd
          key: applab-clean-avd-schema1-google_apis-api${{ inputs.api_level }}-x86_64-${{ inputs.emulator_profile }}

      - name: Ensure Android system image
        shell: bash
        env:
          APPLAB_ANDROID_API_LEVEL: ${{ inputs.api_level }}
          APPLAB_ANDROID_TARGET: google_apis
          APPLAB_ANDROID_ARCH: x86_64
          APPLAB_ANDROID_CHANNEL: "0"
        run: bash .applab/scripts/ensure_android_system_image.sh

      - name: Install Maestro
        run: |
          chmod +x .applab/scripts/install_maestro.sh
          .applab/scripts/install_maestro.sh

      - name: Execute isolated journey shard
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          APPLAB_APK_FILE: ${{ steps.contract.outputs.apk_file }}
          APPLAB_TARGET_ROOT: ${{ steps.contract.outputs.target_root }}
          APPLAB_TRUSTED_ROOT: ${{ github.workspace }}/.applab
          APPLAB_ANALYSIS_PLAN_JSON: ${{ steps.contract.outputs.analysis_plan_file }}
          APPLAB_REPORT_DIR: ${{ github.workspace }}/journey-shard-report
          APPLAB_REPOSITORY: ${{ inputs.repository }}
          APPLAB_PACKAGE_ID: ${{ steps.contract.outputs.package_id }}
          APPLAB_JOURNEY_IDS_JSON: ${{ toJSON(matrix.journeys) }}
          APPLAB_SHARD_ID: ${{ matrix.id }}
          APPLAB_ANDROID_PREPARE_COMMAND: ${{ inputs.android_prepare_command }}
          APPLAB_BUILD_CONTRACT_JSON: ${{ github.workspace }}/.applab-build/contract.json
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.emulator_profile }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .applab/scripts/run_journey_shard.sh

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: journey-shard-${{ github.run_id }}-${{ matrix.id }}
          path: journey-shard-report/
          if-no-files-found: warn
          retention-days: 1

  verify:
    needs: journey_plan
    if: always() && needs.journey_plan.result == 'success'
    name: Trusted verify ${{ inputs.repository }}@${{ inputs.resolved_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout trusted AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Prepare trusted report directory
        run: mkdir -p "$GITHUB_WORKSPACE/applab-report"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Android SDK tools for resilient image install
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      # AVD cache schema is intentionally decoupled from the AppLab release.
      # Bump `schema1` only when API/arch/profile/emulator configuration becomes incompatible.
      - name: Restore clean AVD snapshot
        id: avd_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.android/avd
          key: applab-clean-avd-schema1-google_apis-api${{ inputs.api_level }}-x86_64-${{ inputs.emulator_profile }}

      - name: Ensure Android system image with retry
        shell: bash
        env:
          APPLAB_ANDROID_API_LEVEL: ${{ inputs.api_level }}
          APPLAB_ANDROID_TARGET: google_apis
          APPLAB_ANDROID_ARCH: x86_64
          APPLAB_ANDROID_CHANNEL: "0"
        run: bash .applab/scripts/ensure_android_system_image.sh

      - name: Create pristine AVD snapshot on cache miss
        if: steps.avd_cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.emulator_profile }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell pm list packages >/dev/null
            adb logcat -c
            echo "Pristine AppLab AVD prepared before target APK installation."

      - name: Save pristine AVD snapshot before target execution
        if: steps.avd_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.android/avd
          key: applab-clean-avd-schema1-google_apis-api${{ inputs.api_level }}-x86_64-${{ inputs.emulator_profile }}

      - name: Download untrusted build contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.build_artifact_name }}
          path: .applab-build

      - name: Validate build contract
        id: contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/validate_build_contract.py \
            --root "$GITHUB_WORKSPACE/.applab-build" \
            --expected-repository "${{ inputs.repository }}" \
            --expected-sha "${{ inputs.resolved_sha }}" \
            --expected-engine "${{ inputs.engine }}" \
            --expected-analysis-mode "${{ inputs.analysis_mode }}" \
            --expected-trusted-applab-sha "${{ job.workflow_sha }}" \
            --github-output "$GITHUB_OUTPUT"
          cp "$GITHUB_WORKSPACE/.applab-build/contract.json" \
             "$GITHUB_WORKSPACE/applab-report/build-contract.json"
          cp "$GITHUB_WORKSPACE/.applab-build/analysis-plan.json" \
             "$GITHUB_WORKSPACE/applab-report/analysis-plan.json"
          cp "$GITHUB_WORKSPACE/.applab-build/adaptive-quality.json" \
             "$GITHUB_WORKSPACE/applab-report/adaptive-quality.json" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/.applab-build/execution-plan.json" \
             "$GITHUB_WORKSPACE/applab-report/execution-plan.json" 2>/dev/null || true

      - name: Verify physical evidence hub run provenance
        id: physical_run
        if: inputs.physical_evidence_run_id != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python .applab/scripts/physical_evidence.py verify-run \
            --repository "${{ job.workflow_repository }}" \
            --run-id "${{ inputs.physical_evidence_run_id }}"

      - name: Download trusted physical evidence attestation
        if: inputs.physical_evidence_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.physical_run.outputs.artifact_name }}
          path: .applab-physical
          github-token: ${{ github.token }}
          repository: ${{ job.workflow_repository }}
          run-id: ${{ inputs.physical_evidence_run_id }}

      - name: Bind physical evidence to exact APK
        if: inputs.physical_evidence_run_id != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/physical_evidence.py validate \
            --record "$GITHUB_WORKSPACE/.applab-physical/physical-session.json" \
            --contract "$GITHUB_WORKSPACE/.applab-build/contract.json" \
            --artifact "$GITHUB_WORKSPACE/.applab-build/app.apk" \
            --expected-hub-repository "${{ job.workflow_repository }}" \
            --expected-hub-run-id "${{ inputs.physical_evidence_run_id }}" \
            --expected-hub-run-attempt "${{ steps.physical_run.outputs.run_attempt }}" \
            --expected-hub-head-sha "${{ steps.physical_run.outputs.head_sha }}" \
            --verifier-run-id "$GITHUB_RUN_ID" \
            --verifier-trusted-applab-sha "${{ job.workflow_sha }}" \
            --output "$GITHUB_WORKSPACE/applab-report/physical-evidence.json" \
            --summary "$GITHUB_WORKSPACE/applab-report/physical-evidence.md"

      - name: Cache pinned Maestro
        id: maestro_cache
        if: inputs.run_maestro
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.maestro
          key: applab-maestro-${{ runner.os }}-2.10.0

      - name: Install Maestro
        if: inputs.run_maestro
        run: |
          chmod +x .applab/scripts/install_maestro.sh
          .applab/scripts/install_maestro.sh

      - name: Restore previous passing visual baseline
        id: visual_baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-visual-baseline
          key: applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}
          restore-keys: |
            applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-

      - name: Restore previous passing performance baseline
        id: performance_baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-performance-baseline
          key: applab-performance-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}
          restore-keys: |
            applab-performance-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-

      - name: Restore previous passing upgrade baseline
        id: upgrade_baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-upgrade-baseline
          key: applab-upgrade-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}
          restore-keys: |
            applab-upgrade-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-

      - name: Resolve effective analysis mode
        id: analysis
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.analysis_mode }}
        run: |
          set -Eeuo pipefail
          MODE="$(python -c 'import json; print(json.load(open("applab-report/analysis-plan.json")).get("mode","full"))')"
          LANE="$(python -c 'import json; print(json.load(open("applab-report/analysis-plan.json")).get("lane","FULL_RUNTIME"))')"
          BASELINE_FALLBACK=false
          if [[ "$REQUESTED_MODE" == "certification" ]]; then
            MODE="certification"
          fi
          if [[ "$MODE" != "fast" && "$MODE" != "full" && "$MODE" != "certification" ]]; then
            echo "Unsupported effective analysis mode: $MODE" >&2
            exit 2
          fi
          if [[ "$MODE" == "fast" ]]; then
            if [[ ! -s "$GITHUB_WORKSPACE/.applab-upgrade-baseline/baseline.apk" || -z "$(find "$GITHUB_WORKSPACE/.applab-visual-baseline" -type f -print -quit 2>/dev/null)" ]]; then
              MODE="full"
              LANE="FULL_RUNTIME"
              BASELINE_FALLBACK=true
              echo "FAST requested but no previous full baseline is available; falling back to FULL."
            fi
          fi
          if [[ "$BASELINE_FALLBACK" == "true" ]]; then
            python - "$GITHUB_WORKSPACE/applab-report/analysis-plan.json" "${{ steps.contract.outputs.analysis_plan_file }}" <<'PY'
          import json
          import sys
          from pathlib import Path

          for raw in sys.argv[1:]:
              path = Path(raw)
              payload = json.loads(path.read_text(encoding="utf-8"))
              payload["mode"] = "full"
              payload["lane"] = "FULL_RUNTIME"
              payload["fallback_full"] = True
              selected = payload.get("selected_labs", {})
              payload["selected_labs"] = {key: True for key in selected}
              reasons = payload.get("reasons", {})
              for key in payload["selected_labs"]:
                  values = reasons.setdefault(key, [])
                  marker = "missing trusted runtime baseline; effective FULL fallback"
                  if marker not in values:
                      values.append(marker)
              payload["reasons"] = reasons
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + chr(10), encoding="utf-8")
          PY
          fi
          python - \
            "$GITHUB_WORKSPACE/applab-report/analysis-plan.json" \
            "$GITHUB_WORKSPACE/applab-report/execution-plan.json" \
            "$MODE" "$LANE" "$BASELINE_FALLBACK" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan_path = Path(sys.argv[1])
          execution_path = Path(sys.argv[2])
          if execution_path.is_file():
              plan = json.loads(plan_path.read_text(encoding="utf-8"))
              execution = json.loads(execution_path.read_text(encoding="utf-8"))
              selected = sorted(
                  key
                  for key, enabled in (plan.get("selected_labs") or {}).items()
                  if enabled
              )
              execution.setdefault(
                  "preflight_runtime",
                  {
                      "mode": execution.get("mode"),
                      "lane": execution.get("lane"),
                      "selected_labs": execution.get("selected_labs", []),
                      "run_static": execution.get("run_static"),
                      "run_build": execution.get("run_build"),
                      "run_runtime": execution.get("run_runtime"),
                  },
              )
              execution["plan_scope"] = "build_identity_with_effective_runtime_overlay"
              execution["effective_runtime"] = {
                  "mode": sys.argv[3],
                  "lane": sys.argv[4],
                  "fallback_full": sys.argv[5].lower() == "true",
                  "selected_labs": selected,
                  "run_static": bool(plan.get("run_static", True)),
                  "run_build": bool(plan.get("run_build", True)),
                  "run_runtime": bool(plan.get("run_runtime", True)),
              }
              guardrails = execution.setdefault("guardrails", {})
              guardrails["trusted_runtime_fallback_recorded"] = True
              execution_path.write_text(
                  json.dumps(execution, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
          echo "effective_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"

      - name: Start runtime timing
        shell: bash
        run: |
          date +%s%3N > "$GITHUB_WORKSPACE/applab-report/runtime-start-ms.txt"

      - name: Verify APK inside trusted Android runtime
        id: verify
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          APPLAB_APK_FILE: ${{ steps.contract.outputs.apk_file }}
          APPLAB_REPOSITORY: ${{ inputs.repository }}
          APPLAB_RUN_MAESTRO: ${{ inputs.run_maestro }}
          APPLAB_MAESTRO_FLOW: ${{ steps.contract.outputs.maestro_flow }}
          APPLAB_ANDROID_PREPARE_COMMAND: ${{ inputs.android_prepare_command }}
          APPLAB_PACKAGE_ID: ${{ steps.contract.outputs.package_id }}
          APPLAB_TARGET_ROOT: ${{ steps.contract.outputs.target_root }}
          APPLAB_PROJECT_ROOT: ${{ steps.contract.outputs.project_root }}
          APPLAB_TRUSTED_ROOT: ${{ github.workspace }}/.applab
          APPLAB_TRUSTED_SHA: ${{ job.workflow_sha }}
          APPLAB_REPORT_DIR: ${{ github.workspace }}/applab-report
          APPLAB_VISUAL_BASELINE_DIR: ${{ github.workspace }}/.applab-visual-baseline
          APPLAB_PERFORMANCE_BASELINE_JSON: ${{ github.workspace }}/.applab-performance-baseline/performance-lab.json
          APPLAB_UPGRADE_BASELINE_APK: ${{ github.workspace }}/.applab-upgrade-baseline/baseline.apk
          APPLAB_VERSION: "1.0.0"
          APPLAB_ANALYSIS_MODE: ${{ steps.analysis.outputs.effective_mode }}
          APPLAB_ANALYSIS_PLAN_JSON: ${{ steps.contract.outputs.analysis_plan_file }}
          APPLAB_JOURNEY_IDS_JSON: ${{ needs.journey_plan.outputs.authoritative == 'true' && needs.journey_plan.outputs.coordinator_journeys || '' }}
          START_TIMEOUT: ${{ inputs.start_timeout }}
          SETTLE_SECONDS: ${{ inputs.settle_seconds }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.emulator_profile }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .applab/scripts/run_external_android_gate.sh

      - name: Prepare coordinator journey evidence
        if: always() && needs.journey_plan.outputs.authoritative == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$GITHUB_WORKSPACE/journey-coordinator-report"
          mkdir -p "$GITHUB_WORKSPACE/journey-coordinator-report"
          if [[ -s "$GITHUB_WORKSPACE/applab-report/journey-runtime.json" ]]; then
            cp "$GITHUB_WORKSPACE/applab-report/journey-runtime.json"                "$GITHUB_WORKSPACE/journey-coordinator-report/journey-runtime.json"
          fi
          cp "$GITHUB_WORKSPACE/.applab-build/contract.json"              "$GITHUB_WORKSPACE/journey-coordinator-report/contract.json"

      - name: Upload coordinator journey evidence
        if: always() && needs.journey_plan.outputs.authoritative == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: journey-shard-${{ github.run_id }}-coordinator
          path: journey-coordinator-report/
          if-no-files-found: error
          retention-days: 1

      - name: Finalize runtime timing
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          report=Path("applab-report")
          start_path=report/"runtime-start-ms.txt"
          start=int(start_path.read_text().strip()) if start_path.is_file() else int(time.time()*1000)
          end=int(time.time()*1000)
          (report/"runtime-timing.json").write_text(
              json.dumps({"runtime_seconds": round(max(0,end-start)/1000,3)}, indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Evaluate v5.7E exact-artifact reuse promotion
        id: reuse_promotion
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/verification_reuse_promotion_v57e.py \
            --contract "$GITHUB_WORKSPACE/.applab-build/contract.json" \
            --execution-plan "$GITHUB_WORKSPACE/applab-report/execution-plan.json" \
            --result "$GITHUB_WORKSPACE/applab-report/result.json" \
            --output "$GITHUB_WORKSPACE/applab-report/verification-reuse-promotion-v57e.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Enforce v5.7E promotion gate on reused build
        if: always() && steps.reuse_promotion.outputs.cache_hit == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.reuse_promotion.outputs.promotion_ready }}" = "true"

      - name: Evaluate production certification
        id: certification
        if: always() && steps.analysis.outputs.effective_mode == 'certification'
        shell: bash
        run: |
          python .applab/scripts/certification_gate.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --contract-root "$GITHUB_WORKSPACE/.applab-build" \
            --api-level "${{ inputs.api_level }}" \
            --emulator-profile "${{ inputs.emulator_profile }}" \
            --target "google_apis" \
            --arch "x86_64"

      - name: Prepare PASS-only visual baseline
        id: baseline
        if: steps.verify.outcome == 'success' && (steps.analysis.outputs.effective_mode == 'full' || steps.certification.outputs.status == 'CERTIFIED')
        shell: bash
        env:
          APPROVE_VISUAL_BASELINE: ${{ inputs.approve_visual_baseline }}
        run: |
          EXTRA_ARGS=()
          if [[ "$APPROVE_VISUAL_BASELINE" == "true" ]]; then
            EXTRA_ARGS+=(--approve-current)
          fi
          python .applab/scripts/prepare_visual_baseline.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --baseline-dir "$GITHUB_WORKSPACE/.applab-visual-baseline" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --version "1.0.0" \
            --github-output "$GITHUB_OUTPUT" \
            "${EXTRA_ARGS[@]}"

      - name: Save PASS-only visual baseline
        if: steps.baseline.outputs.promote == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-visual-baseline
          key: applab-visual-baseline-v2-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}-${{ github.run_id }}

      - name: Prepare PASS-only performance baseline
        id: performance_baseline_prepare
        if: steps.verify.outcome == 'success' && (steps.analysis.outputs.effective_mode == 'full' || steps.certification.outputs.status == 'CERTIFIED')
        shell: bash
        run: |
          python .applab/scripts/prepare_performance_baseline.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --baseline-dir "$GITHUB_WORKSPACE/.applab-performance-baseline" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --version "1.0.0" \
            --github-output "$GITHUB_OUTPUT"

      - name: Save PASS-only performance baseline
        if: steps.performance_baseline_prepare.outputs.promote == 'true' && (steps.analysis.outputs.effective_mode == 'full' || steps.certification.outputs.status == 'CERTIFIED')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-performance-baseline
          key: applab-performance-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}-${{ github.run_id }}

      - name: Prepare PASS-only upgrade baseline
        id: upgrade_baseline_prepare
        if: steps.verify.outcome == 'success' && (steps.analysis.outputs.effective_mode == 'full' || steps.certification.outputs.status == 'CERTIFIED')
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/.applab-upgrade-baseline"
          python .applab/scripts/prepare_upgrade_baseline.py \
            --source-apk "${{ steps.contract.outputs.apk_file }}" \
            --baseline-dir "$GITHUB_WORKSPACE/.applab-upgrade-baseline" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --version "1.0.0"

      - name: Save PASS-only upgrade baseline
        if: steps.verify.outcome == 'success' && (steps.analysis.outputs.effective_mode == 'full' || steps.certification.outputs.status == 'CERTIFIED')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-upgrade-baseline
          key: applab-upgrade-baseline-v1-${{ inputs.repository }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}-${{ github.run_id }}

      - name: Prepare PASS-only installable release
        id: release
        if: steps.certification.outputs.status == 'CERTIFIED' && inputs.publish_release_artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .applab/scripts/release_artifact.py prepare \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --contract-root "$GITHUB_WORKSPACE/.applab-build" \
            --output-dir "$GITHUB_WORKSPACE/applab-release" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --history-key "${{ inputs.history_key }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload verified installable APK
        id: release_upload
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: applab-release/
          if-no-files-found: error
          retention-days: 7

      - name: Bind verified APK download metadata
        if: steps.release.outputs.publish == 'true'
        run: |
          python .applab/scripts/release_artifact.py bind \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --artifact-id "${{ steps.release_upload.outputs.artifact-id }}" \
            --artifact-url "${{ steps.release_upload.outputs.artifact-url }}"

      - name: Calibrate shadow FULL decision
        if: always() && steps.verify.outcome != 'skipped'
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/applab-report/result.json" ]] && \
             [[ "$(python -c 'import json; print(str(json.load(open("applab-report/analysis-plan.json")).get("shadow_full",False)).lower())')" == "true" ]]; then
            python .applab/scripts/shadow_calibration.py \
              --plan "$GITHUB_WORKSPACE/applab-report/analysis-plan.json" \
              --result "$GITHUB_WORKSPACE/applab-report/result.json" \
              --output "$GITHUB_WORKSPACE/applab-report/shadow-calibration.json"
          fi

      - name: Record adaptive pipeline metrics
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RUN_STARTED_AT="$(python .applab/scripts/github_run_started_at.py)"
          python .applab/scripts/pipeline_metrics.py \
            --plan "$GITHUB_WORKSPACE/applab-report/analysis-plan.json" \
            --quality "$GITHUB_WORKSPACE/applab-report/adaptive-quality.json" \
            --execution-plan "$GITHUB_WORKSPACE/applab-report/execution-plan.json" \
            --shadow "$GITHUB_WORKSPACE/applab-report/shadow-calibration.json" \
            --runtime-timing "$GITHUB_WORKSPACE/applab-report/runtime-timing.json" \
            --avd-cache-hit "${{ steps.avd_cache.outputs.cache-hit }}" \
            --maestro-cache-hit "${{ steps.maestro_cache.outputs.cache-hit }}" \
            --workflow-started-at "$RUN_STARTED_AT" \
            --output "$GITHUB_WORKSPACE/applab-report/pipeline-metrics.json"

      - name: Finalize trusted result contract
        if: always()
        env:
          APPLAB_PIPELINE_STATUS: ${{ job.status }}
        run: |
          python .applab/scripts/finalize_external_result.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --repository "${{ inputs.repository }}" \
            --ref "${{ inputs.ref }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --history-key "${{ inputs.history_key }}" \
            --engine "${{ inputs.engine }}" \
            --pipeline-status "$APPLAB_PIPELINE_STATUS" \
            --run-id "$GITHUB_RUN_ID" \
            --analysis-mode "${{ steps.analysis.outputs.effective_mode || inputs.analysis_mode }}"

      - name: Build Release Reality record
        if: always()
        shell: bash
        env:
          RR_REPOSITORY: ${{ inputs.repository }}
          RR_SHA: ${{ inputs.resolved_sha }}
          RR_RUNTIME_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -Eeuo pipefail
          python .applab/scripts/release_reality.py \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --artifact "$GITHUB_WORKSPACE/.applab-build/app.apk" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --trusted-applab-sha "${{ job.workflow_sha }}" \
            --runtime-outcome "${{ steps.verify.outcome }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path("applab-report/release-reality.json").read_text())
          assert payload["source"]["repository"] == os.environ["RR_REPOSITORY"], payload
          assert payload["source"]["resolved_sha"] == os.environ["RR_SHA"], payload
          assert payload["workflow"]["workflow_run_id"] == os.environ["GITHUB_RUN_ID"], payload
          states = {row["key"]: row["state"] for row in payload["levels"]}
          if os.environ["RR_RUNTIME_OUTCOME"] == "success":
              assert states["ARTIFACT_BUILT"] == "PASS", payload
              assert states["TRUSTED_RUNTIME_VERIFIED"] == "PASS", payload
          PY

      - name: Bind trusted runtime evidence
        if: always() && steps.verify.outcome == 'success' && (steps.reuse_promotion.outputs.cache_hit != 'true' || steps.reuse_promotion.outputs.promotion_ready == 'true')
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/trusted_evidence_manifest.py create \
            --report-dir "$GITHUB_WORKSPACE/applab-report" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --analysis-mode "${{ steps.analysis.outputs.effective_mode }}" \
            --contract-fingerprint "${{ inputs.contract_fingerprint }}" \
            --config-fingerprint "${{ inputs.config_fingerprint }}" \
            --trusted-applab-sha "${{ job.workflow_sha }}"

      - name: Evaluate verification cache eligibility
        id: verification_cache
        if: always() && inputs.cache_verification && needs.journey_plan.outputs.authoritative != 'true'
        shell: bash
        env:
          APPLAB_JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          RESULT="$(python -c 'import json; print(str(json.load(open("applab-report/result.json")).get("result","FAIL")).upper())' 2>/dev/null || echo FAIL)"
          if [[ "$APPLAB_JOB_STATUS" == "success" && "$RESULT" == "PASS" ]]; then
            echo "cacheable=true" >> "$GITHUB_OUTPUT"
          else
            echo "cacheable=false" >> "$GITHUB_OUTPUT"
            echo "AppLab will not cache a non-PASS or failed pipeline; the watcher may retry this SHA."
          fi

      - name: Prepare verification cache payload
        if: steps.verification_cache.outputs.cacheable == 'true'
        run: |
          rm -rf "$GITHUB_WORKSPACE/.applab-watch-cache"
          mkdir -p "$GITHUB_WORKSPACE/.applab-watch-cache"
          cp "$GITHUB_WORKSPACE/applab-report/result.json" \
             "$GITHUB_WORKSPACE/.applab-watch-cache/result.json"
          cp "$GITHUB_WORKSPACE/applab-report/summary.md" \
             "$GITHUB_WORKSPACE/.applab-watch-cache/summary.md"

      - name: Mark resolved PASS commit as checked
        if: steps.verification_cache.outputs.cacheable == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-watch-cache
          key: applab-c${{ inputs.contract_fingerprint }}-p${{ inputs.config_fingerprint }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}

      - name: Publish trusted verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AppLab v5.3.5 Trusted APK Verification"
            echo
            echo "- Target: \`${{ inputs.repository }}@${{ inputs.resolved_sha }}\`"
            echo "- Engine: \`${{ inputs.engine }}\`"
            echo "- Analysis: \`${{ steps.analysis.outputs.effective_mode }}\`"
            if [[ -f "$GITHUB_WORKSPACE/applab-report/execution-plan.json" ]]; then
              BUILD_REUSE="$(python -c 'import json; d=json.load(open("applab-report/execution-plan.json")); c=d.get("build_cache") or {}; print("N/A" if c.get("applicable") is False else ("HIT" if c.get("hit") is True else "MISS"))')"
              EXECUTION_KEY="$(python -c 'import json; d=json.load(open("applab-report/execution-plan.json")); print(str(d.get("execution_key",""))[:16])')"
              echo "- Build reuse: \`$BUILD_REUSE\`"
              echo "- Execution key: \`$EXECUTION_KEY\`"
            fi
            echo "- Build job repository checkout: **not present in this job**"
            echo
            if [[ -f "$GITHUB_WORKSPACE/applab-report/summary.md" ]]; then
              cat "$GITHUB_WORKSPACE/applab-report/summary.md"
              if [[ -f "$GITHUB_WORKSPACE/applab-report/certification.md" ]]; then
                echo
                cat "$GITHUB_WORKSPACE/applab-report/certification.md"
              fi
              if [[ -f "$GITHUB_WORKSPACE/applab-report/release-reality.md" ]]; then
                echo
                cat "$GITHUB_WORKSPACE/applab-report/release-reality.md"
              fi
              if [[ -f "$GITHUB_WORKSPACE/applab-report/physical-evidence.md" ]]; then
                echo
                cat "$GITHUB_WORKSPACE/applab-report/physical-evidence.md"
              fi
            else
              echo "Trusted verification ended before a runtime report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trusted AppLab evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-${{ inputs.history_key }}-${{ github.run_id }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 1


  journey_aggregate:
    name: Aggregate journey shards
    needs: [journey_plan, journey_shards, verify]
    if: always() && needs.journey_plan.outputs.authoritative == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Download build contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.build_artifact_name }}
          path: .applab-build

      - name: Download all journey shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: journey-shard-${{ github.run_id }}-*
          path: journey-shard-evidence

      - name: Aggregate exact-artifact journey verdict
        id: aggregate
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/journey_shard_aggregate.py \
            --expected-contract "$GITHUB_WORKSPACE/.applab-build/contract.json" \
            --plan "$GITHUB_WORKSPACE/.applab-build/analysis-plan.json" \
            --evidence-root "$GITHUB_WORKSPACE/journey-shard-evidence" \
            --mode authoritative \
            --output "$GITHUB_WORKSPACE/journey-shard-aggregate.json"

      - name: Upload aggregate journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: journey-shard-aggregate-${{ github.run_id }}
          path: journey-shard-aggregate.json
          if-no-files-found: warn
          retention-days: 1

      - name: Download coordinator trusted evidence
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: applab-${{ inputs.history_key }}-${{ github.run_id }}
          path: coordinator-trusted-evidence

      - name: Finalize authoritative canonical evidence
        id: canonical
        if: always()
        shell: bash
        run: |
          set +e
          python .applab/scripts/finalize_journey_shard_result.py \
            --coordinator-dir "$GITHUB_WORKSPACE/coordinator-trusted-evidence" \
            --aggregate "$GITHUB_WORKSPACE/journey-shard-aggregate.json" \
            --artifact "$GITHUB_WORKSPACE/.applab-build/app.apk" \
            --output-dir "$GITHUB_WORKSPACE/authoritative-trusted-evidence" \
            --repository "${{ inputs.repository }}" \
            --resolved-sha "${{ inputs.resolved_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --analysis-mode "${{ inputs.analysis_mode }}" \
            --contract-fingerprint "${{ inputs.contract_fingerprint }}" \
            --config-fingerprint "${{ inputs.config_fingerprint }}" \
            --trusted-applab-sha "${{ job.workflow_sha }}"
          STATUS=$?
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish authoritative canonical evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-${{ inputs.history_key }}-${{ github.run_id }}
          path: authoritative-trusted-evidence/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Prepare authoritative verification cache
        if: inputs.cache_verification && steps.canonical.outputs.status == '0'
        shell: bash
        run: |
          set -Eeuo pipefail
          RESULT="$(python -c 'import json; print(str(json.load(open("authoritative-trusted-evidence/result.json")).get("result","FAIL")).upper())')"
          [[ "$RESULT" == "PASS" ]]
          rm -rf "$GITHUB_WORKSPACE/.applab-watch-cache"
          mkdir -p "$GITHUB_WORKSPACE/.applab-watch-cache"
          cp "$GITHUB_WORKSPACE/authoritative-trusted-evidence/result.json" "$GITHUB_WORKSPACE/.applab-watch-cache/result.json"
          cp "$GITHUB_WORKSPACE/authoritative-trusted-evidence/summary.md" "$GITHUB_WORKSPACE/.applab-watch-cache/summary.md"
          cp "$GITHUB_WORKSPACE/authoritative-trusted-evidence/journey-shard-aggregate.json" "$GITHUB_WORKSPACE/.applab-watch-cache/journey-shard-aggregate.json"

      - name: Mark authoritative PASS commit as checked
        if: inputs.cache_verification && steps.canonical.outputs.status == '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-watch-cache
          key: applab-c${{ inputs.contract_fingerprint }}-p${{ inputs.config_fingerprint }}-${{ inputs.history_key }}-${{ inputs.resolved_sha }}

      - name: Enforce authoritative aggregate verdict
        if: always()
        shell: bash
        env:
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          CANONICAL_STATUS: ${{ steps.canonical.outputs.status }}
        run: |
          set -Eeuo pipefail
          if [[ "$AGGREGATE_OUTCOME" != "success" || "$CANONICAL_STATUS" != "0" ]]; then
            echo "Authoritative journey sharding did not produce a final PASS." >&2
            exit 1
          fi
