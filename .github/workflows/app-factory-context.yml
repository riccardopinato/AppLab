# APP_FACTORY_CONTEXT_v2 — source metadata only, PR-only; no runtime product changes
name: App Factory — context snapshot
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/app-factory-context.yml'
permissions:
  contents: read
concurrency:
  group: app-factory-context-${{ github.repository }}
  cancel-in-progress: false
jobs:
  validate-app-factory-context:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate workflow contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('.github/workflows/app-factory-context.yml').read_text(encoding='utf-8')
          for marker in ('APP_FACTORY_CONTEXT_v2', 'workflow_dispatch:', 'pull-requests: write', 'APP_FACTORY_CONTEXT.md', 'git push origin HEAD:refs/heads/automation/app-factory-context'):
              assert marker in s, marker
          print('APP_FACTORY_CONTEXT_CONTRACT_PASS')
          PY
  snapshot-app-factory-context:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Reconcile public source SHAs and propose reviewed update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${BASE_BRANCH}"
          if git ls-remote --exit-code --heads origin automation/app-factory-context >/dev/null; then
            git fetch origin automation/app-factory-context
            git switch --track -c automation/app-factory-context origin/automation/app-factory-context
            git merge --no-edit "origin/${BASE_BRANCH}"
          else
            git switch -c automation/app-factory-context "origin/${BASE_BRANCH}"
          fi
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, urllib.request
          from pathlib import Path
          sources = [["riccardopinato/App-Factory-Core","Master, Golden e policy"],["riccardopinato/Idee-app-Archivi-riferimenti","Idee, capability e donor"]]
          token = os.environ.get('GH_TOKEN', '')
          rows = []
          for repo, role in sources:
              def api(path):
                  req = urllib.request.Request('https://api.github.com/repos/' + repo + path, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'AppFactorySnapshot/1', 'Authorization': 'Bearer ' + token})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return json.load(resp)
              meta = api('')
              branch = meta['default_branch']
              head = api('/commits/' + branch)
              sha = head['sha']
              if len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha): raise ValueError('Invalid SHA')
              rows.append({'repository': repo, 'purpose': role, 'branch': branch, 'sha': sha, 'commit_date': head['commit']['committer']['date']})
          rows.sort(key=lambda x: x['repository'])
          payload = {'schema': 1, 'sources': rows}
          dest = Path('docs'); dest.mkdir(exist_ok=True)
          (dest / 'APP_FACTORY_CONTEXT.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8')
          lines = ['# App Factory — sorgenti monitorate', '', '> Snapshot metadata GitHub generato automaticamente. Non certifica implementazioni, test, APK o release.', '', '| Repository | Uso | Branch | Commit | Ultimo commit (UTC) |', '|---|---|---|---|---|']
          for x in rows:
              url = 'https://github.com/' + x['repository']
              lines.append('| [' + x['repository'] + '](' + url + ') | ' + x['purpose'] + ' | `' + x['branch'] + '` | [`' + x['sha'][:12] + '`](' + url + '/commit/' + x['sha'] + ') | ' + x['commit_date'] + ' |')
          lines.extend(['', '## Limiti', '', '- Solo SHA e timestamp di repository pubblici autorizzati; non sono importati codice, dati privati o documenti.', '- Le modifiche di Product Bible, Roadmap, Donor, Golden o sorgenti richiedono audit e PR separata.', '- Un cambiamento SHA non equivale a test o approvazione; la PR di snapshot resta soggetta ai gate.', ''])
          (dest / 'APP_FACTORY_CONTEXT.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
          git add -- docs/APP_FACTORY_CONTEXT.json docs/APP_FACTORY_CONTEXT.md
          if git diff --cached --quiet; then
            echo 'SNAPSHOT_UNCHANGED'
          else
            git commit -m 'chore(context): observe upstream factory commits'
          fi
          REMOTE_HEAD="$(git ls-remote origin refs/heads/automation/app-factory-context | awk '{print $1}')"
          if [ "$(git rev-parse HEAD)" != "$REMOTE_HEAD" ]; then
            git push origin HEAD:refs/heads/automation/app-factory-context
          fi
          if git diff --quiet "origin/${BASE_BRANCH}" HEAD -- docs/APP_FACTORY_CONTEXT.json docs/APP_FACTORY_CONTEXT.md; then
            echo 'NO_OP: no snapshot delta versus base'
            exit 0
          fi
          if [ -z "$(gh pr list --head automation/app-factory-context --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --head automation/app-factory-context --base "${BASE_BRANCH}" --title 'chore(context): new upstream GitHub snapshot' --body 'Metadata only: observe upstream commit SHAs and dates. No application code, Master, Golden, deployment or certification changed. Review and merge through normal project gates.'
          fi
