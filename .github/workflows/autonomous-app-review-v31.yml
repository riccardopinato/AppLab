name: AppLab True Autonomous App Review v4.3.0

on:
  schedule:
    - cron: "17 3 1 * *"
  pull_request:
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Target repository in owner/name form. Empty = this repository."
        required: false
        default: ""
        type: string
      target_ref:
        description: "Branch, tag or SHA to resolve once and review immutably."
        required: false
        default: "main"
        type: string
      max_files:
        description: "Maximum tracked text files for product analysis."
        required: false
        default: "3500"
        type: string
      run_maestro:
        description: "Run Maestro during trusted verification."
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      target_repository:
        required: false
        default: ""
        type: string
      target_ref:
        required: false
        default: "main"
        type: string
      max_files:
        required: false
        default: "3500"
        type: string
      run_maestro:
        required: false
        default: true
        type: boolean
    secrets:
      APPLAB_TARGET_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: applab-true-autonomous-review-${{ github.event.pull_request.head.repo.full_name || inputs.target_repository || github.repository }}-${{ github.event.pull_request.number || github.event.pull_request.head.ref || inputs.target_ref || 'main' }}
  cancel-in-progress: true

jobs:
  scope:
    name: Required-check scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        name: Decide whether trusted runtime work is applicable
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/applab-changed-files.txt"
          if grep -Eq '(^\.github/workflows/(autonomous-app-review-v31|trusted-apk-verifier|universal-project-runner)\.yml$|^scripts/(trusted_evidence_manifest|project_autodiscover|autonomous_app_review|behavioral_product_lab|state_edge_case_lab|evidence_calibration|evidence_confidence_engine|journey_crawler|user_journey_intelligence|ux_friction_lab|longitudinal_product_intelligence|autonomous_experiment_planner|applab_analyst|evidence_graph|product_contract_audit|decision_brief)\.py$|^scripts/verify_apk\.sh$)' "$RUNNER_TEMP/applab-changed-files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  resolve:
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.run == 'true'
    name: Resolve immutable target
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.target.outputs.repository }}
      source_ref: ${{ steps.target.outputs.source_ref }}
      lineage_ref: ${{ steps.target.outputs.lineage_ref }}
      base_sha: ${{ steps.target.outputs.base_sha }}
      resolved_sha: ${{ steps.sha.outputs.resolved_sha }}
    steps:
      - name: Resolve coordinates
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPOSITORY: ${{ inputs.target_repository }}
          INPUT_REF: ${{ inputs.target_ref }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            REPOSITORY="$PR_REPOSITORY"
            SOURCE_REF="$PR_SHA"
            LINEAGE_REF="$PR_HEAD_REF"
            BASE_SHA="$PR_BASE_SHA"
          else
            REPOSITORY="${INPUT_REPOSITORY:-}"
            SOURCE_REF="${INPUT_REF:-main}"
            LINEAGE_REF="$SOURCE_REF"
            BASE_SHA=""
            [[ -n "$REPOSITORY" ]] || REPOSITORY="${{ github.repository }}"
          fi
          [[ -n "$REPOSITORY" && -n "$SOURCE_REF" ]] || {
            echo "Unable to resolve autonomous review target." >&2
            exit 2
          }
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "lineage_ref=$LINEAGE_REF" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout target once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.source_ref }}
          path: target
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.APPLAB_TARGET_TOKEN || github.token }}

      - name: Pin resolved SHA
        id: sha
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA="$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid resolved SHA" >&2; exit 2; }
          echo "resolved_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ steps.target.outputs.repository }}@${{ steps.target.outputs.source_ref }} -> $SHA" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Build and trusted runtime verification
    needs: resolve
    uses: ./.github/workflows/universal-project-runner.yml
    with:
      repository: ${{ needs.resolve.outputs.repository }}
      ref: ${{ needs.resolve.outputs.resolved_sha }}
      source_ref: ${{ needs.resolve.outputs.source_ref }}
      run_maestro: ${{ github.event_name == 'pull_request' || inputs.run_maestro }}
      history_key: autonomous-review-v31
      cache_verification: false
      contract_fingerprint: autonomous-review-v31
      config_fingerprint: autonomous-review-v31
      approve_visual_baseline: false
      analysis_mode: full
      baseline_sha: ""
      force_release_build: false
      publish_release_artifact: false

  review:
    name: Trusted evidence autonomous review
    needs: [resolve, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Checkout exact reviewed target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.resolved_sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.APPLAB_TARGET_TOKEN || github.token }}

      - name: Verify exact target SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL="$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)"
          test "$ACTUAL" = "${{ needs.resolve.outputs.resolved_sha }}"

      - name: Resolve longitudinal history scope
        id: longitudinal_scope
        shell: bash
        run: |
          set -Eeuo pipefail
          SCOPE="$(printf '%s' "${{ needs.resolve.outputs.repository }}" | sha256sum | cut -c1-20)"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "artifact_name=applab-longitudinal-history-$SCOPE" >> "$GITHUB_OUTPUT"

      - name: Restore repository-wide longitudinal history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_ARTIFACT: ${{ steps.longitudinal_scope.outputs.artifact_name }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.applab-longitudinal"
          ARTIFACT_ID="$(
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$HISTORY_ARTIFACT&per_page=100"               --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty'
          )"
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "No repository-wide longitudinal history artifact found."
          else
            gh api               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"               > "$RUNNER_TEMP/longitudinal-history.zip"
            unzip -q -o "$RUNNER_TEMP/longitudinal-history.zip"               -d "$GITHUB_WORKSPACE/.applab-longitudinal"
            echo "Restored longitudinal history artifact $ARTIFACT_ID."
          fi

      - name: Download trusted verifier evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: applab-autonomous-review-v31-${{ github.run_id }}
          path: trusted-runtime

      - name: Validate Trusted Evidence Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/trusted_evidence_manifest.py validate             --report-dir "$GITHUB_WORKSPACE/trusted-runtime"             --repository "${{ needs.resolve.outputs.repository }}"             --resolved-sha "${{ needs.resolve.outputs.resolved_sha }}"             --run-id "$GITHUB_RUN_ID"             --output "$GITHUB_WORKSPACE/trusted-runtime-validation.json"

      - name: Run True Autonomous App Review
        shell: bash
        env:
          MAX_FILES: ${{ inputs.max_files || '3500' }}
        run: |
          set -Eeuo pipefail
          python .applab/scripts/autonomous_app_review.py             --repo-root "$GITHUB_WORKSPACE/target"             --runtime-evidence-dir "$GITHUB_WORKSPACE/trusted-runtime"             --expected-repository "${{ needs.resolve.outputs.repository }}"             --expected-sha "${{ needs.resolve.outputs.resolved_sha }}"             --expected-run-id "$GITHUB_RUN_ID"             --require-trusted-runtime             --output-dir "$GITHUB_WORKSPACE/applab-autonomous-review"             --max-files "${MAX_FILES:-3500}"

      - name: Build longitudinal product intelligence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.applab-longitudinal"
          python .applab/scripts/longitudinal_product_intelligence.py \
            --current-dir "$GITHUB_WORKSPACE/applab-autonomous-review" \
            --history-dir "$GITHUB_WORKSPACE/.applab-longitudinal" \
            --repository "${{ needs.resolve.outputs.repository }}" \
            --resolved-sha "${{ needs.resolve.outputs.resolved_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --lineage-ref "${{ needs.resolve.outputs.lineage_ref }}" \
            --base-sha "${{ needs.resolve.outputs.base_sha }}" \
            --output-dir "$GITHUB_WORKSPACE/applab-autonomous-review" \
            --snapshot-output "$GITHUB_WORKSPACE/.applab-longitudinal/${{ needs.resolve.outputs.resolved_sha }}.json" \
            --history-limit 20

      - name: Build autonomous experiment plan
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/autonomous_experiment_planner.py \
            --evidence-dir "$GITHUB_WORKSPACE/applab-autonomous-review" \
            --output-dir "$GITHUB_WORKSPACE/applab-autonomous-review"

      - name: Build AppLab Analyst report
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/applab_analyst.py \
            --evidence-dir "$GITHUB_WORKSPACE/applab-autonomous-review" \
            --output-dir "$GITHUB_WORKSPACE/applab-autonomous-review"

      - name: Build Evidence Graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/evidence_graph.py \
            --evidence-dir "$GITHUB_WORKSPACE/applab-autonomous-review" \
            --trusted-runtime-dir "$GITHUB_WORKSPACE/trusted-runtime" \
            --output-dir "$GITHUB_WORKSPACE/applab-autonomous-review"

      - name: Upload repository-wide longitudinal history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.longitudinal_scope.outputs.artifact_name }}
          path: .applab-longitudinal/**/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Publish v4.2 review
        shell: bash
        run: |
          {
            echo "## AppLab True Autonomous App Review v4.3.0"
            echo
            echo "**Target:** `${{ needs.resolve.outputs.repository }}@${{ needs.resolve.outputs.resolved_sha }}`"
            echo
            cat "$GITHUB_WORKSPACE/applab-autonomous-review/autonomous-review.md"
            echo
            cat "$GITHUB_WORKSPACE/applab-autonomous-review/longitudinal-intelligence.md"
            echo
            cat "$GITHUB_WORKSPACE/applab-autonomous-review/experiment-plan.md"
            echo
            cat "$GITHUB_WORKSPACE/applab-autonomous-review/analyst-report.md"
            echo
            cat "$GITHUB_WORKSPACE/applab-autonomous-review/evidence-graph.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package Studio-ready evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT_ID="$(printf '%s' "${{ needs.resolve.outputs.repository }}" | tr '/' '_')"
          PROJECT_DIR="$GITHUB_WORKSPACE/studio-evidence/$PROJECT_ID"
          mkdir -p "$PROJECT_DIR"
          cp "$GITHUB_WORKSPACE/applab-autonomous-review/"*.json "$PROJECT_DIR/"
          cp "$GITHUB_WORKSPACE/trusted-runtime/trusted-evidence-manifest.json" "$PROJECT_DIR/"
          cp "$GITHUB_WORKSPACE/trusted-runtime/result.json" "$PROJECT_DIR/trusted-runtime-result.json"
          cp "$GITHUB_WORKSPACE/trusted-runtime-validation.json" "$PROJECT_DIR/"

      - name: Build Studio snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          python .applab/scripts/studio_snapshot.py \
            --evidence-root "$GITHUB_WORKSPACE/studio-evidence" \
            --output "$GITHUB_WORKSPACE/studio.json"

      - name: Upload Autonomous Review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-autonomous-review-v31-result-${{ github.run_id }}
          path: |
            applab-autonomous-review/
            studio-evidence/
            studio.json
          if-no-files-found: error
          retention-days: 30
