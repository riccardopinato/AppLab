name: Temporary Lockfile Refresh

on:
  pull_request:
    paths:
      - "frontend/package.json"
      - ".github/workflows/lockfile-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate npm lockfile
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "applab-lockfile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: regenerate frontend lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
