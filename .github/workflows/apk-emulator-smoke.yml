name: APK Emulator Smoke

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct HTTPS URL of the APK to test
        required: true
        type: string
      package_id:
        description: Optional package id; leave empty for automatic detection
        required: false
        default: ""
        type: string
      api_level:
        description: Android API level
        required: false
        default: "35"
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - name: Download APK
        run: curl --fail --location --retry 3 "${{ inputs.apk_url }}" --output app-under-test.apk

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run AppLab
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            chmod +x scripts/*.sh
            ./scripts/verify_apk.sh "$GITHUB_WORKSPACE/app-under-test.apk" "${{ inputs.package_id }}"

      - name: Upload AppLab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applab-report
          path: applab-report/
          if-no-files-found: warn
