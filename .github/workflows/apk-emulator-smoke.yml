name: APK Emulator Smoke

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct HTTPS URL of the APK to test
        required: true
        type: string
      package_id:
        description: Optional package id; leave empty for automatic detection
        required: false
        default: ""
        type: string
      api_level:
        description: Android API level
        required: false
        default: "35"
        type: string
      run_maestro:
        description: Run generic Maestro launch/home/relaunch smoke
        required: false
        default: true
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download APK
        run: curl --fail --location --retry 3 "${{ inputs.apk_url }}" --output app-under-test.apk

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro
        if: inputs.run_maestro
        run: |
          chmod +x scripts/install_maestro.sh
          ./scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run AppLab
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          APPLAB_RUN_MAESTRO: ${{ inputs.run_maestro }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            chmod +x scripts/*.sh
            RUN_MAESTRO="$APPLAB_RUN_MAESTRO" ./scripts/verify_apk.sh "$GITHUB_WORKSPACE/app-under-test.apk" "${{ inputs.package_id }}"

      - name: Upload AppLab report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-report
          path: applab-report/
          if-no-files-found: warn
          retention-days: 1
