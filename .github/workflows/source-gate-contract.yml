name: AppLab Source Gate Contract Tests

on:
  pull_request:
    paths:
      - ".github/workflows/repo-watcher.yml"
      - ".github/workflows/source-gate-watcher.yml"
      - ".github/workflows/source-gate-contract.yml"
      - "scripts/source_gate_watch.py"
      - "scripts/workflow_contract_test.py"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python source gate self-test
        run: python3 scripts/source_gate_watch.py --self-test
      - name: Automatic APK exclusion contract
        run: python3 scripts/workflow_contract_test.py
