name: AppLab Autonomous App Review v3 (Legacy Static)

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: "Target repository in owner/name form. Empty = this repository."
        required: false
        default: ""
        type: string
      target_ref:
        description: "Branch, tag or SHA to review."
        required: false
        default: "main"
        type: string
      runtime_evidence_path:
        description: "Deprecated. Target-authored runtime evidence is no longer accepted."
        required: false
        default: ""
        type: string
      max_files:
        description: "Maximum tracked text files for static product analysis."
        required: false
        default: "3500"
        type: string
  workflow_call:
    inputs:
      target_repository:
        required: false
        default: ""
        type: string
      target_ref:
        required: false
        default: "main"
        type: string
      runtime_evidence_path:
        required: false
        default: ""
        type: string
      max_files:
        required: false
        default: "3500"
        type: string
    secrets:
      APPLAB_TARGET_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: applab-autonomous-review-v3-legacy-${{ inputs.target_repository || github.repository }}-${{ inputs.target_ref || 'main' }}
  cancel-in-progress: true

jobs:
  review:
    name: Legacy static product review
    runs-on: ubuntu-latest
    steps:
      - name: Reject untrusted runtime path
        shell: bash
        env:
          RUNTIME_PATH: ${{ inputs.runtime_evidence_path }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${RUNTIME_PATH:-}" ]]; then
            echo "runtime_evidence_path is deprecated because target-authored evidence is not trusted." >&2
            echo "Use AppLab Autonomous App Review v3.1 for bound Trusted Verifier evidence." >&2
            exit 2
          fi

      - name: Checkout trusted AppLab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .applab
          persist-credentials: false

      - name: Resolve target
        id: target
        shell: bash
        env:
          INPUT_REPOSITORY: ${{ inputs.target_repository }}
          INPUT_REF: ${{ inputs.target_ref }}
        run: |
          set -Eeuo pipefail
          REPOSITORY="${INPUT_REPOSITORY:-}"
          REF="${INPUT_REF:-main}"
          [[ -n "$REPOSITORY" ]] || REPOSITORY="${{ github.repository }}"
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.ref }}
          path: target
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.APPLAB_TARGET_TOKEN || github.token }}

      - name: Run static-only Autonomous Review
        shell: bash
        env:
          MAX_FILES: ${{ inputs.max_files }}
        run: |
          set -Eeuo pipefail
          python .applab/scripts/autonomous_app_review.py             --repo-root "$GITHUB_WORKSPACE/target"             --output-dir "$GITHUB_WORKSPACE/applab-autonomous-review"             --max-files "${MAX_FILES:-3500}"

      - name: Publish review
        shell: bash
        run: cat "$GITHUB_WORKSPACE/applab-autonomous-review/autonomous-review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-autonomous-review-legacy-${{ github.run_id }}
          path: applab-autonomous-review/
          if-no-files-found: error
          retention-days: 30
