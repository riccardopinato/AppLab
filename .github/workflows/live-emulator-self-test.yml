name: Live Emulator Browser E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "selftest/**"
      - "docker-compose.live.yml"
      - "scripts/check_live_host.sh"
      - ".github/workflows/live-emulator-self-test.yml"
      - ".github/workflows/runtime-fixture-build.yml"
      - "scripts/restore_runtime_fixture.sh"
      - "scripts/build_runtime_fixture_fallback.sh"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "selftest/**"
      - "docker-compose.live.yml"
      - "scripts/check_live_host.sh"
      - ".github/workflows/live-emulator-self-test.yml"
      - ".github/workflows/runtime-fixture-build.yml"
      - "scripts/restore_runtime_fixture.sh"

concurrency:
  group: applab-live-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  live-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enable KVM
        run: |
          if [[ ! -e /dev/kvm ]]; then
            sudo modprobe kvm || true
            sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
          fi
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi
          test -e /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Verify live host
        run: |
          chmod +x scripts/check_live_host.sh
          ./scripts/check_live_host.sh

      - name: Setup Java for manual runtime fixture
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle for manual runtime fixture
        if: github.event_name == 'workflow_dispatch'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: "9.6.0"

      - name: Setup Android SDK for manual runtime fixture
        if: github.event_name == 'workflow_dispatch'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android SDK components for manual runtime fixture
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build manual runtime fixture fallback
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/build_runtime_fixture_fallback.sh
          ./scripts/build_runtime_fixture_fallback.sh "$GITHUB_WORKSPACE/runtime-fixture"

      - name: Restore canonical runtime fixture
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          chmod +x scripts/restore_runtime_fixture.sh
          ./scripts/restore_runtime_fixture.sh "$GITHUB_WORKSPACE/runtime-fixture"

      - name: Install Playwright Chromium
        working-directory: frontend/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Build live AppLab stack
        run: docker compose -f docker-compose.live.yml build backend frontend

      - name: Start AppLab controller and frontend
        run: |
          docker compose -f docker-compose.live.yml up -d backend frontend

          backend_ready=false
          frontend_ready=false
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              backend_ready=true
            fi
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              frontend_ready=true
            fi
            if [[ "$backend_ready" == "true" && "$frontend_ready" == "true" ]]; then
              exit 0
            fi
            sleep 2
          done

          docker compose -f docker-compose.live.yml logs backend frontend
          exit 1

      - name: Start managed Android emulator
        run: |
          http_code="$(curl --show-error --silent             --max-time 900             -X POST             -o runtime-start.json             -w '%{http_code}'             http://127.0.0.1:8000/api/runtime/start)"
          cat runtime-start.json
          if [[ "$http_code" != "200" ]]; then
            echo "AppLab runtime start returned HTTP $http_code" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          with open("runtime-start.json", encoding="utf-8") as fh:
              data = json.load(fh)
          assert data["live_ready"] is True, data
          assert data["adb_ready"] is True, data
          assert data["boot_completed"] is True, data
          assert data["gateway_ready"] is True, data
          PY

      - name: Verify WebRTC gateway and Android screenshot
        run: |
          curl --fail --show-error --silent             http://127.0.0.1:8080/api/v1/emulator/status             | tee gateway-status.json

          curl --fail --show-error --silent             http://127.0.0.1:8000/api/screenshot             --output live-emulator.png

          test -s live-emulator.png

      - name: Install and launch browser interaction target
        run: |
          curl --fail --show-error --silent             -F "file=@runtime-fixture/app-debug.apk"             http://127.0.0.1:8000/api/apk/install             | tee browser-install.json

          launch_ready=false
          for attempt in {1..5}; do
            curl --fail --show-error --silent               -H "Content-Type: application/json"               -d '{"package_id":"dev.applab.selftest"}'               http://127.0.0.1:8000/api/app/launch               | tee browser-launch.json

            sleep 1
            if curl --fail --show-error --silent               http://127.0.0.1:8000/api/ui/hierarchy               | tee browser-ui-before.json               | grep -Fq "RUN INTERACTION TEST"; then
              launch_ready=true
              break
            fi
            echo "Self-test activity not visible after launch attempt $attempt; retrying..."
          done

          if [[ "$launch_ready" != "true" ]]; then
            cat browser-ui-before.json || true
            exit 1
          fi

          for _ in {1..30}; do
            curl --fail --show-error --silent               http://127.0.0.1:8000/api/ui/hierarchy               > browser-ui-before.json
            if grep -Fq "RUN INTERACTION TEST" browser-ui-before.json; then
              exit 0
            fi
            sleep 1
          done

          cat browser-ui-before.json
          exit 1

      - name: Browser WebRTC video and input E2E
        working-directory: frontend/e2e
        env:
          APPLAB_FRONTEND_URL: http://127.0.0.1:5173
          APPLAB_BACKEND_URL: http://127.0.0.1:8000
        run: npm test

      - name: Stop managed Android emulator
        if: always()
        run: |
          curl --show-error --silent             --max-time 120             -X POST             http://127.0.0.1:8000/api/runtime/stop             | tee runtime-stop.json || true

      - name: Collect live browser evidence
        if: always()
        run: |
          docker compose -f docker-compose.live.yml logs backend > backend-live.log 2>&1 || true
          docker compose -f docker-compose.live.yml logs frontend > frontend-live.log 2>&1 || true
          docker logs applab-emulator > emulator-container.log 2>&1 || true
          docker cp applab-backend-1:/data/emulator-last.log emulator-last.log 2>/dev/null || true
          docker cp applab-backend-1:/data/gateway.log gateway.log 2>/dev/null || true
          curl --show-error --silent http://127.0.0.1:8000/api/history?limit=30 > history.json || true
          docker ps -a > docker-ps.txt || true

      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-browser-webrtc-e2e
          path: |
            runtime-start.json
            runtime-stop.json
            gateway-status.json
            live-emulator.png
            browser-install.json
            browser-launch.json
            browser-ui-before.json
            backend-live.log
            frontend-live.log
            emulator-container.log
            emulator-last.log
            gateway.log
            history.json
            docker-ps.txt
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          if-no-files-found: warn
          retention-days: 1

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.live.yml down --remove-orphans || true
