name: Emulator Self Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "selftest/**"
      - "tests/flows/selftest.yaml"
      - ".maestro/**"
      - ".github/workflows/emulator-self-test.yml"
      - ".github/workflows/runtime-fixture-build.yml"
      - "scripts/restore_runtime_fixture.sh"
  pull_request:


concurrency:
  group: applab-emulator-self-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  scope:
    name: Required-check scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      profile: ${{ steps.profile.outputs.profile }}
      profile_reason: ${{ steps.profile.outputs.reason }}
      selected_labs: ${{ steps.profile.outputs.selected_labs }}
      units: ${{ steps.profile.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        name: Decide whether trusted runtime work is applicable
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/applab-changed-files.txt"
          if grep -Eq '^(scripts/|selftest/|tests/flows/selftest\.yaml$|\.maestro/|\.github/workflows/(emulator-self-test|runtime-fixture-build)\.yml$)' "$RUNNER_TEMP/applab-changed-files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - id: profile
        name: Plan v6.0G self-test runtime depth
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "profile=FULL" >> "$GITHUB_OUTPUT"
            echo "reason=NON_PR_FULL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/selftest_runtime_profile_v60g.py \
            --changed-files "$RUNNER_TEMP/applab-changed-files.txt" \
            --output "$RUNNER_TEMP/selftest-runtime-profile.json" \
            --github-output "$GITHUB_OUTPUT"

  android-runtime:
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Maestro
        run: |
          chmod +x scripts/install_maestro.sh
          ./scripts/install_maestro.sh

      - name: Setup Gradle for manual runtime fixture
        if: github.event_name == 'workflow_dispatch'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: "9.6.0"

      - name: Build manual runtime fixture fallback
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/build_runtime_fixture_fallback.sh
          ./scripts/build_runtime_fixture_fallback.sh "$GITHUB_WORKSPACE/runtime-fixture"

      - name: Restore canonical runtime fixture
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          chmod +x scripts/restore_runtime_fixture.sh
          ./scripts/restore_runtime_fixture.sh "$GITHUB_WORKSPACE/runtime-fixture"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Full Android runtime verification
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            SELFTEST_PROFILE='${{ needs.scope.outputs.profile }}' SELFTEST_PROFILE_REASON='${{ needs.scope.outputs.profile_reason }}' SELFTEST_SELECTED_LABS='${{ needs.scope.outputs.selected_labs }}' SELFTEST_UNITS='${{ needs.scope.outputs.units }}' bash scripts/run_emulator_selftest_v60g.sh
      - name: Publish runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-emulator-self-test
          path: |
            applab-report/
            applab-report-no-maestro/
            applab-report-fast/
            applab-report-certification/
            v60g-fast-plan.json
          if-no-files-found: warn
          retention-days: 1
