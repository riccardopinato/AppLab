name: Emulator Self Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "selftest/**"
      - "tests/flows/selftest.yaml"
      - ".maestro/**"
      - ".github/workflows/emulator-self-test.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "selftest/**"
      - "tests/flows/selftest.yaml"
      - ".maestro/**"
      - ".github/workflows/emulator-self-test.yml"

concurrency:
  group: applab-emulator-self-test
  cancel-in-progress: true

jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Maestro
        run: |
          chmod +x scripts/install_maestro.sh
          ./scripts/install_maestro.sh

      - name: Build self-test APK
        run: gradle -p selftest :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Full Android runtime verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            chmod +x scripts/*.sh
            RUN_MAESTRO=true MAESTRO_FLOW="$GITHUB_WORKSPACE/tests/flows/selftest.yaml" REPORT_DIR="$GITHUB_WORKSPACE/applab-report" APPLAB_TARGET_ROOT="$GITHUB_WORKSPACE" APPLAB_PROJECT_ROOT="$GITHUB_WORKSPACE" APPLAB_VERSION="0.7.3" ./scripts/verify_apk.sh "$GITHUB_WORKSPACE/selftest/app/build/outputs/apk/debug/app-debug.apk" "dev.applab.selftest"
            grep -Fq -- "- Result: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            grep -Fq -- "- Maestro: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            grep -Fq "dev.applab.selftest" "$GITHUB_WORKSPACE/applab-report/activity.txt"
            grep -Fq "INTERACTION_OK" "$GITHUB_WORKSPACE/applab-report/post-maestro-window.xml"
            test -s "$GITHUB_WORKSPACE/applab-report/launch.png"
            test -s "$GITHUB_WORKSPACE/applab-report/post-maestro.png"
            test -s "$GITHUB_WORKSPACE/applab-report/logcat.txt"
            python -c 'import json,pathlib; report=json.loads(pathlib.Path("applab-report/visual-journey.json").read_text()); names={item["name"] for item in report["checkpoints"]}; assert {"launch","final","settings","dialog"} <= names, names; assert report["checkpoint_count"] >= 4, report; assert report["visual_qa"] == "PASS", report'
            python -c 'import json,pathlib; report=json.loads(pathlib.Path("applab-report/system-lab.json").read_text()); assert report["result"] == "PASS", report; assert report["process_restart"]["restart_success"], report; assert report["deep_links"][0]["success"], report; assert any(x["permission"] == "android.permission.POST_NOTIFICATIONS" and x["success"] for x in report["permission_actions"]), report'
            python -c 'import json,pathlib; report=json.loads(pathlib.Path("applab-report/network-lab.json").read_text()); assert report["result"] in {"PASS","WARN"}, report; assert report["package_id"] == "dev.applab.selftest", report'
            test -s "$GITHUB_WORKSPACE/applab-report/network-offline.png"
            test -s "$GITHUB_WORKSPACE/applab-report/network-recovered.png"

            RUN_MAESTRO=false REPORT_DIR="$GITHUB_WORKSPACE/applab-report-no-maestro" APPLAB_TARGET_ROOT="$GITHUB_WORKSPACE" APPLAB_PROJECT_ROOT="$GITHUB_WORKSPACE" APPLAB_VERSION="0.7.3" ./scripts/verify_apk.sh "$GITHUB_WORKSPACE/selftest/app/build/outputs/apk/debug/app-debug.apk" "dev.applab.selftest"
            python -c 'import json,pathlib; report=json.loads(pathlib.Path("applab-report-no-maestro/result.json").read_text()); journey=json.loads(pathlib.Path("applab-report-no-maestro/visual-journey.json").read_text()); system=json.loads(pathlib.Path("applab-report-no-maestro/system-lab.json").read_text()); network=json.loads(pathlib.Path("applab-report-no-maestro/network-lab.json").read_text()); assert report["result"] == "PASS", report; assert report["maestro"] == "SKIPPED", report; assert report["network_lab"] in {"PASS","WARN"}, report; assert journey["checkpoint_count"] == 2, journey; assert {x["name"] for x in journey["checkpoints"]} == {"launch","final"}, journey; assert system["result"] == "PASS", system; assert network["result"] in {"PASS","WARN"}, network'

      - name: Publish runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: applab-emulator-self-test
          path: |
            applab-report/
            applab-report-no-maestro/
          if-no-files-found: warn
          retention-days: 14
