name: CamperBoss Home Autonomous Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/camperboss-home-review.yml"

permissions:
  contents: read

jobs:
  review:
    uses: ./.github/workflows/autonomous-app-review-v3.yml
    with:
      target_repository: riccardopinato/CamperBoss
      target_ref: step-16-release-core
      runtime_evidence_path: ""
      max_files: "3500"
