name: AppLab Continuous Maintenance

on:
  push:
    branches: [main]
    paths:
      - "scripts/continuous_maintenance_v56.py"
      - "scripts/v62_background_proof.py"
      - "integration/orchestration/contracts/continuous-maintenance-v56.json"
      - "integration/orchestration/V56_CONTINUOUS_MAINTENANCE_MODE.md"
      - ".github/workflows/continuous-maintenance.yml"
      - "integration/factory/v57-pilots.json"
      - "scripts/factory_adoption_observatory_v57a.py"
      - "scripts/factory_throughput_v57b.py"
      - "scripts/pattern3_discovery_v57c.py"
      - "scripts/factory_reuse_planner_v57d.py"
      - "scripts/verification_reuse_v57e.py"
      - "scripts/factory_runtime_acceleration_v58r.py"
      - "integration/factory/v58r-runtime-acceleration.json"
  schedule:
    - cron: "47 * * * *"
  workflow_run:
    workflows: ["AppLab Repo Watcher"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: applab-continuous-maintenance
  cancel-in-progress: true

jobs:
  sweep:
    name: Evidence-only maintenance sweep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restore central watcher history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-history
          key: applab-watch-history-maintenance-${{ github.run_id }}
          restore-keys: |
            applab-watch-history-

      - name: Restore maintenance queue
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-maintenance
          key: applab-maintenance-queue-restore-${{ github.run_id }}
          restore-keys: |
            applab-maintenance-queue-

      - name: Build continuous maintenance queue
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .applab-maintenance
          ARGS=(
            --policy integration/orchestration/contracts/continuous-maintenance-v56.json
            --output-json .applab-maintenance/maintenance-queue.next.json
            --output-md .applab-maintenance/maintenance-queue.md
          )
          if [[ -f .applab-history/history.jsonl ]]; then
            ARGS+=(--history-file .applab-history/history.jsonl)
          fi
          if [[ -f .applab-maintenance/maintenance-queue.json ]]; then
            ARGS+=(--previous-queue .applab-maintenance/maintenance-queue.json)
          fi
          python scripts/continuous_maintenance_v56.py "${ARGS[@]}"
          mv .applab-maintenance/maintenance-queue.next.json .applab-maintenance/maintenance-queue.json
          cat .applab-maintenance/maintenance-queue.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build runtime stability diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f .applab-history/history.jsonl ]]; then
            python scripts/runtime_stability_v56a.py \
              --history-file .applab-history/history.jsonl \
              --output-json .applab-maintenance/runtime-stability.json \
              --output-md .applab-maintenance/runtime-stability.md
            cat .applab-maintenance/runtime-stability.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build delta and heuristic advisory evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f .applab-history/history.jsonl ]]; then
            python scripts/delta_calibration.py \
              --history-file .applab-history/history.jsonl \
              --output-json .applab-maintenance/delta-calibration.json \
              --output-md .applab-maintenance/delta-calibration.md
            python scripts/delta_execution_experiment_v56c.py \
              --calibration .applab-maintenance/delta-calibration.json \
              --output .applab-maintenance/delta-experiment.json
            python scripts/heuristic_calibration_v56d.py \
              --history-file .applab-history/history.jsonl \
              --output .applab-maintenance/heuristic-calibration.json
          fi

      - name: Build Factory throughput advisory evidence
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -f \
            .applab-maintenance/factory-adoption-observatory.json \
            .applab-maintenance/factory-adoption-observatory.md \
            .applab-maintenance/factory-throughput.json \
            .applab-maintenance/pattern3-candidates.json \
            .applab-maintenance/factory-reuse-plan.json \
            .applab-maintenance/verification-reuse.json \
            .applab-maintenance/factory-runtime-acceleration.json \
            .applab-maintenance/factory-runtime-acceleration.md
          python scripts/factory_adoption_observatory_v57a.py \
            --watchlist watchlist.json \
            --pilots integration/factory/v57-pilots.json \
            --output-json .applab-maintenance/factory-adoption-observatory.json \
            --output-md .applab-maintenance/factory-adoption-observatory.md
          python scripts/factory_throughput_v57b.py \
            --observatory .applab-maintenance/factory-adoption-observatory.json \
            --pilots integration/factory/v57-pilots.json \
            --output .applab-maintenance/factory-throughput.json
          python scripts/factory_runtime_acceleration_v58r.py \
            --observatory .applab-maintenance/factory-adoption-observatory.json \
            --output-json .applab-maintenance/factory-runtime-acceleration.json \
            --output-md .applab-maintenance/factory-runtime-acceleration.md
          if [[ -f .applab-maintenance/maintenance-queue.json ]]; then
            python scripts/pattern3_discovery_v57c.py \
              --queue .applab-maintenance/maintenance-queue.json \
              --output .applab-maintenance/pattern3-candidates.json
          fi
          python scripts/factory_reuse_planner_v57d.py \
            --observatory .applab-maintenance/factory-adoption-observatory.json \
            --watchlist watchlist.json \
            --output .applab-maintenance/factory-reuse-plan.json
          python scripts/verification_reuse_v57e.py \
            --observatory .applab-maintenance/factory-adoption-observatory.json \
            --watchlist watchlist.json \
            --output .applab-maintenance/verification-reuse.json
          cat .applab-maintenance/factory-adoption-observatory.md >> "$GITHUB_STEP_SUMMARY"
          cat .applab-maintenance/factory-runtime-acceleration.md >> "$GITHUB_STEP_SUMMARY"

      - name: Observe live v6.2 self-canary and repair proofs
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p .applab-maintenance
          rm -f .applab-maintenance/v62-background-proof.json .applab-maintenance/v62-background-proof.md
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > "$RUNNER_TEMP/v62-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > "$RUNNER_TEMP/v62-artifacts.json"
          python scripts/v62_background_proof.py \
            --runs "$RUNNER_TEMP/v62-runs.json" \
            --artifacts "$RUNNER_TEMP/v62-artifacts.json" \
            --policy integration/orchestration/v61d-expansion.json \
            --output-json .applab-maintenance/v62-background-proof.json \
            --output-md .applab-maintenance/v62-background-proof.md
          cat .applab-maintenance/v62-background-proof.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save maintenance queue
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .applab-maintenance
          key: applab-maintenance-queue-${{ github.run_id }}

      - name: Upload maintenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: applab-continuous-maintenance-${{ github.run_id }}
          path: .applab-maintenance/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
