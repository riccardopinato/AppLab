name: AppLab Flutter Project Gate

on:
  workflow_call:
    inputs:
      flutter_channel:
        description: Flutter channel
        required: false
        default: stable
        type: string
      working_directory:
        description: Flutter project directory relative to repository root
        required: false
        default: "."
        type: string
      api_level:
        description: Android emulator API level
        required: false
        default: "35"
        type: string
      emulator_profile:
        description: Android emulator hardware profile
        required: false
        default: pixel_7_pro
        type: string
      apk_path:
        description: APK path relative to working_directory
        required: false
        default: build/app/outputs/flutter-apk/app-debug.apk
        type: string
      package_id:
        description: Optional Android application id
        required: false
        default: ""
        type: string
      build_command:
        description: Flutter APK build command
        required: false
        default: flutter build apk --debug
        type: string
      run_flutter_tests:
        description: Run flutter analyze and flutter test
        required: false
        default: true
        type: boolean
      run_maestro:
        description: Run Maestro smoke/journey verification
        required: false
        default: true
        type: boolean
      maestro_flow:
        description: Optional flow path relative to repository root
        required: false
        default: ""
        type: string
      start_timeout:
        description: Seconds allowed for the app process to start
        required: false
        default: "30"
        type: string
      settle_seconds:
        description: Seconds to let the app settle before diagnostics
        required: false
        default: "5"
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: AppLab v0.6.3 Unified Flutter Gate
    uses: riccardopinato/AppLab/.github/workflows/external-project-runner.yml@main
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
      working_directory: ${{ inputs.working_directory }}
      flutter_channel: ${{ inputs.flutter_channel }}
      java_version: "17"
      api_level: ${{ inputs.api_level }}
      emulator_profile: ${{ inputs.emulator_profile }}
      apk_path: ${{ inputs.apk_path }}
      package_id: ${{ inputs.package_id }}
      build_command: ${{ inputs.build_command }}
      run_flutter_tests: ${{ inputs.run_flutter_tests }}
      run_maestro: ${{ inputs.run_maestro }}
      maestro_flow: ${{ inputs.maestro_flow }}
      history_key: reusable-flutter
      cache_verification: false
      contract_fingerprint: reusable-v063
      start_timeout: ${{ inputs.start_timeout }}
      settle_seconds: ${{ inputs.settle_seconds }}
