name: X10-032 Android APK debug rollback rehearsal
on:
  pull_request:
    paths:
      - "selftest/app/build.gradle.kts"
      - "scripts/x10_android_apk_rollback.py"
      - "backend/tests/test_x10_android_apk_rollback.py"
      - "integration/agent_core/X10-032_APK_ROLLBACK_REHEARSAL.md"
      - ".github/workflows/x10-android-apk-rollback.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-debug-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Offline fail-closed safety unit tests
        run: python3 -m unittest backend.tests.test_x10_android_apk_rollback -v
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Setup Gradle 9.6 for existing AppLab self-test fixture
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: '9.6.0'
      - name: Build two debug APK versions from exact same source and signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/x10-rollback"
          gradle -p selftest :app:assembleDebug -Px10RollbackFixtureVersionCode=101 --no-daemon
          cp selftest/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/x10-rollback/old-101.apk"
          gradle -p selftest :app:assembleDebug -Px10RollbackFixtureVersionCode=102 --no-daemon
          cp selftest/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/x10-rollback/new-102.apk"
          test -s "$RUNNER_TEMP/x10-rollback/old-101.apk"
          test -s "$RUNNER_TEMP/x10-rollback/new-102.apk"
          test "$(sha256sum "$RUNNER_TEMP/x10-rollback/old-101.apk" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/x10-rollback/new-102.apk" | cut -d' ' -f1)"
      - name: Enable KVM for disposable Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real APK install, upgrade, downgrade rejection and debug rollback
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            python3 scripts/x10_android_apk_rollback.py --old "$RUNNER_TEMP/x10-rollback/old-101.apk" --new "$RUNNER_TEMP/x10-rollback/new-102.apk" --output "$RUNNER_TEMP/x10-rollback/emulator-receipt.json"
      - name: Emit scope boundary
        if: success()
        run: |
          echo 'X10-032: emulator DEBUG fixture only. This is NOT real Anna/TasteAI APK rollback, NOT physical device, NOT signed release, NOT Play, NOT Golden.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload non-authoritative emulator receipt, never synthetic APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: x10-032-emulator-debug-rollback-receipt
          path: ${{ runner.temp }}/x10-rollback/emulator-receipt.json
          if-no-files-found: warn
          retention-days: 30
